#国策  
  RAJ_powerfulempire: "强大的帝国"
  RAJ_powerfulempire_desc: "广阔的疆域，安定的国民，朕又开始了一天的统治，啊，伟大的帝国，强大的帝国！"
  RAJ_support_ANR: "支援狩人军团"
  RAJ_support_ANR_desc: "艾斯德斯卿还在远方的前线与叛逆鏖战，朕要为她送去必备的军资粮草，让她们为朕打一个打胜仗！"
  RAJ_feast: "盛宴"
  RAJ_feast_desc: "奥斯内特又为朕准备了一场盛宴，政务的事情等会再说，朕要用膳了......"
  RAJ_diplomacy: "外交"
  RAJ_diplomacy_desc: "跟外国人打交道？嗯...一切就交给奥斯内特卿了..."
  RAJ_present: "奖赏"
  RAJ_present_desc: "朕的摄政奥斯内特卿一直为朕鞠躬尽瘁，朕要重重地赏他，来啊，把礼物都抬上来！"
  RAJ_invite_eng: "圣杯托管"
  RAJ_invite_eng_desc: "该让圣杯人来帮助我们进行具体的管理吗？朕不太清楚..."
  RAJ_im_smart: "朕之明智"
  RAJ_im_smart_desc: "帝国在朕和历代先君的统治下一直繁荣昌盛至今，朕的才智一定能应付这一切..."
  RAJ_hes_loyal: "卿之忠诚"
  RAJ_hes_loyal_desc: "奥斯内特是朕的肱骨之臣，对朕毫无私心可言，他提出的建议相比一定是为国家的忠义之举......"
  RAJ_approved: "准了"
  RAJ_approved_desc: "好吧！那就让圣杯来帮我们进行管理吧，奥斯内特，朕的宴会准备好了吗..."

