RAJ_corruption: "贪腐"
RAJ_corruption_desc: "历史上曾用过诸多的文字与故事来形容它，堆积如山的珍宝、富丽堂皇的宫殿，脑满肠肥的权贵...但一切永远没有这两个字形容得痛切，形容得无力：贪腐..."
RAJ_ruin: "摇摇欲坠的国家机器"
RAJ_ruin_desc: "上下其手的官僚机构，懦弱无能的皇帝，骄奢淫逸的摄政，还有哪个国家能比这儿更能容忍腐朽与低效...哦，兴许是它的后来者，抑或是它的继承者..."
RAJ_rely_on_ACDC: "依赖狩人军团"
RAJ_rely_on_ACDC_desc: "自灾变之后，帝国所有的精锐都云集在艾斯德斯元帅的麾下，帝国的军权也自然掌握在艾斯德斯的手中，由她全权负责对叛匪的清剿...那既然如此，我们也就不必亲自操劳军事了吧..."

ANR_Long_live_for_ACDC: "艾斯德斯元帅万岁！"
ANR_Long_live_for_ACDC_desc: "现在，所有渴望功勋，渴望力量，渴望鲜血的帝国军人都集结在艾斯德斯元帅的麾下，狩人军团的荣光与元帅永存，万岁！万岁！万岁！"
ANR_ACE: "帝国精锐云集"
ANR_ACE_desc: "狩人军团本就以强悍精干著称，在狩人军团获得实质性的独断专行权利后，帝国境内的工程师、善战老兵、新锐军事理论家都涌向狩人军团的辖区内，企图在新的权柄下获得荣升的机遇..."
ANR_anti_NRR: "革命军克星"
ANR_anti_NRR_desc: "在革命军中，艾斯德斯元帅的威名无人不知无人不晓，就连最善战的敌将，在听闻艾斯德斯的威名后也无不胆寒，任何螳臂当车的叛匪在狩人军团面前也只是一群负隅顽抗的虫豸。"
