  # 5. 结果事件与限时精神
  LOS_culinary.1.t:0 "传世迷宫佳肴出炉！"
  LOS_culinary.1.d:0 "金黄诱人的香气瞬间弥漫了整个黄金国灶台！本次美食研究取得了超出预期的惊艳成果，无论前线官兵还是后方民众都对这道新式魔物料理赞不绝口。"
  LOS_culinary.1.a:0 "“太美味了！立刻推广全国！”"

  LOS_culinary.2.t:0 "美食研究顺利完成"
  LOS_culinary.2.d:0 "经过十五天的反复试制与调味，新式迷宫食谱已定型并配发至各部炊事班，军民士气与后勤表现均获得了切实提升。"
  LOS_culinary.2.a:0 "“吃饱了才有力气干活！”"

  LOS_culinary.3.t:0 "灾难性的黑暗料理……"
  LOS_culinary.3.d:0 "锅盖掀开的那一刻，一股难以名状的紫黑色浓烟直冲屋顶。虽然莱欧斯坚持说“去掉焦掉的部分还能吃”，但试吃员们短期内显然需要一点心理建设。"
  LOS_culinary.3.a:0 "“下次一定注意火候……”"
  LOS_CUL_SUCCESS_CD_TT:0 "§Y灶台将进入 60 天休整冷却；本次消耗的食材需 120 天补货冷却。§!"
  LOS_CUL_DARK_NO_CD_TT:0 "§G虽然做出了黑暗料理，但灶台无需休整，可以立刻重新挑选食材再次烹饪！§!\n§R（本次消耗的食材需 120 天补货冷却）§!"

