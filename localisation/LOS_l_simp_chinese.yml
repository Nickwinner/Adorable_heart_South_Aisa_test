  LOS_CUL_MOTTO:0 "§7“进食是生者的权利！唯有吃饱，才能继续前行。”§!"
  LOS_CUL_INFO_TT:0 "§Y【美食研究说明】§!\n1. §W搭配流程§!：在左侧滑动挑选「食材」→ 在中间选定「料理做法」→ 在右侧指定「主厨」→ 点击下方开始试制。\n2. §W冷却机制§!：每次烹饪成功或大成功后，灶台进入 §Y60§! 天休整冷却；但若做出§R黑暗料理§!，则§G无灶台冷却，可立刻再次烹饪§!。\n3. §W食材补货§!：无论烹饪成败，用过的食材均需 §Y120§! 天补货冷却，期间请轮换其他食材或推进剧情解锁新食材。"

