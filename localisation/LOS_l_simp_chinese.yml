#事件

  LOS.event.1.t: "今天的晚饭是……?"
  LOS.event.1.d: "南亚南端，印度洋畔，海岸。\n\n莱欧斯坐在海岸边的大石头上，呆呆地望着面前的汪洋大海。\n\n炎热、潮湿、闷。\n与位于北欧的家乡截然不同。\n\n从他带领队伍从老家的迷宫城出发，前往地下从未到达过的迷宫深处并另寻出口，最终找到出口，已经过去了大概十个多月。\n\n但这儿是哪儿来着？\n\n觅得出口后的莱欧斯众人花了三天才从当地的原住民口中得知，他们几乎穿越了半个世界，从北欧的迷宫来到了南亚的一处山脉脚下。所幸他们出来的地方是一处任何人都懒得管的边远之地，所以他们得以安然落脚而没有人把他们当作非法闯入者。\n\n但是困扰在“恶食王”——黄金国国王和冒险者的领袖——莱欧斯心中最大的问题是：没有好吃的。\n是的，相比于地下迷宫中的各种美味的魔物（玛露希尔：x）而言，出来后的最大问题是没有食物，或者说，没有足够美味的食物。莱欧斯曾考虑过要不就此折返，再回到地下迷宫并最终回到北欧的黄金国迷宫城去，但是殿后的冒险者报告说迷宫结构发生了变化，他们来时的道路被巨石封死，原路折返已不可行。\n\n烤蛇尾鸡的余味还在莱欧斯口中流连……\n\n莱欧斯坐在石头上发呆，直到后面连身呼喊得不到回应的玛露希尔用法杖猛敲他的后背。"
  LOS.event.1.a: "是啊，晚饭吃什么呢？"
  LOS.event.2.t: "怪谈"
  LOS.event.2.d: "夜晚，海边，冒险团临时帐篷。\n\n“最后一批冒险者也从迷宫出口处出来了，所幸没有大的伤亡，”卡布尔掀开帐篷，加入到莱欧斯数人的聚餐当中，“已经分配了足够的帐篷，今晚应该没有别的事情了。”\n\n“粮食储备还够吗？”莱欧斯从烤架上拿下一串烤扇贝。\n“远征探险的时候携带的干粮还没有吃完，”卡布尔向坐在一旁的森西要了一杯开水，一饮而尽，“这里的食物产量倒是很高，算上储备和可预计的采摘食物，等到科尼斯堡的船队来接我们应该是绰绰有余……”\n\n“取得联络了吗？”“还没有，我们的人还没有找到最近的大城市，还得等，但是即使现在能取得联系，北欧船队开来也要个把月吧。”\n\n“哎……”没能得到满意答案的玛露希尔抱坐成一团，“昨天从附近的原住民那里得到了一则令人不安的传闻，说是北部的丛林丘陵里有大批吃人的怪物，我们出去侦察的人昨晚也看到了可疑的踪迹，卡布尔，能不能想办法快点取得联络？还有齐尔察克，你不是说你们半身人的公会全世界都有的吗？”\n\n“你这么说我也……”\n“嗯？”\n\n正在吃生蚝的莱欧斯在众人的口中捕捉到了一个他想听到的关键词，他迅速将口中的生蚝吞下，险些噎住。"
  LOS.event.2.a: "“你说有怪物？”"
  LOS.event.3.t: "准备“宴会”"
  LOS.event.3.d: "冒险团临时帐篷。\n\n早晨伊始就兴致勃勃的莱欧斯激动地召集大伙开一个简短的会议，当然是关于之前所提及的北方的怪物们。\n\n“卡布尔？”\n“咳咳……”黄金国外长，也是黄金国行政处的处长（毕竟宫廷一共也就没有几个人）卡布尔清了清嗓子，“查到了，北部的领地属于一个个分散的部落，根据我们的消息，不存在一个统一的领袖。”\n\n“齐尔察克？”\n“真是的，我昨天才带领侦察队回来诶……”半身人公会领袖齐尔察克，“我们确实发现了成群的异形生物，嘛，看上去和迷宫里的怪物好像差不多就是了，动作很快，但是没什么护甲，可以轻易猎杀。”\n\n“很好！森西？”\n“刀已经磨好了，”森西回答的时候依旧在磨着他的菜刀，“后勤队里面有不少人的刀具磨损比较严重，还有些锅在撤出迷宫的时候遗失了，可能到时候烹饪的压力会很大。”\n\n“……慢着，森西，为什么你也来开会了？”玛露希尔这时才发觉异常。\n“因为莱欧斯说接下来要狩猎，然后烹饪……”\n\n宫廷精灵魔法师转头怒瞪着坐在中间的恶食王。\n\n“啊……你看，我们现在刚刚出来，还没有定居点对吧，”莱欧斯摆手解释，“然后这也是非常好的食物补充来源……”\n“闭嘴！我们之前不是说好在地下迷宫吃魔物只是因为食物不够的吗！”\n“哎呀，玛露希尔你真是的，我也只是想尝一下……”\n“不要不要绝对不要！”\n\n莱欧斯无奈地看向坐在旁边的法琳，希望妹妹能帮着说两句。"
  LOS.event.3.a: "幸运的是，法琳看见了莱欧斯的眼神"
  LOS.event.3.b: "不巧，眯眼的法琳没看见莱欧斯的暗示"
  LOS.event.4.t: "一票之“食”"
  LOS.event.4.d: "“嘛，玛露希尔，老哥也只是好奇罢了。”身形壮硕的法琳按住了发作的玛露希尔，企图平息后者的怒火。\n“法琳也是！莱欧斯现在已经不正常了，你应该帮我劝劝他才对吧！”\n\n“但是确实挺好吃的不是吗，玛露希尔你在迷宫里也被森西的厨艺征服了吧？”\n“那是无可奈何的办法……!”\n\n玛露希尔见无法取得法琳的同意，于是站起来企图发动与会者。\n“现在我提议召开宫廷表决，反对莱欧斯吃陆地上的魔物！我先投反对票一张！“\n\n卡布尔投了反对票。\n齐尔察克抱着胳膊退到一边，选择弃权。\n伊津津美跑到厨房偷吃去了，所以算作弃权。\n森西投了赞成票，因为他还没尝试过料理这种新魔物。\n莱欧斯自然毫不意外地投赞成票。\n\n“法琳……!”玛露希尔现在把希望都放在她的学妹上。\n\n当然，希望落空了，没能注意到玛露希尔暗示的法琳举手投了赞成票。\n三比二，一票优势通过。\n\n“好耶！大家，准备出发！”莱欧斯高兴地站起来，发布了新的探索命令。"
  LOS.event.4.a: "于是这支冒险团队再次踏上了征途，唯一的区别就是这里不是迷宫"
  LOS.event.5.t: "只吃一口，只吃一口"
  LOS.event.5.d: "等法琳回过神来时，精灵宫廷魔法师已经和恶食王撕成一团，齐尔察克和森西两人正将二人拉开。\n\n“玛露希尔，冷静，冷静！”齐尔察克抱住玛露希尔的腿。\n“放开我！我要吃的是面包和正常的禽肉，我再也不想吃魔物了！你们也是，帮我一起拦住他啊！”\n\n“哎呀，玛露希尔，蛇尾鸡的味道其实也和鸡肉差不多嘛，你不是当时也吃的很开心吗……”森西拉住玛露希尔的手臂。\n“那能相提并论吗！他现在已经开始想吃那些长相奇特的怪物了！下一步想干什么，想吃人吗！莱欧斯的饮食倾向已经越来越奇怪了！”\n\n卡布尔捂着脸，不忍直视黄金国宫廷的这场“政坛动乱”。\n\n“那个……”法琳抬手示意。\n大家一致停下手头的动作。\n“不如还是按照在迷宫里的规则，亚人种和有灵种的不吃吧。”\n\n折中的方案，不过明显还是偏向莱欧斯的。\n\n“我同意，我同意，我也只是尝试一下，只吃一口试试”莱欧斯连忙摆手支持法琳的方案，“而且，你看，森西的厨艺你也很认可对吧？”\n“嗯……！”精灵依然表达着自己的不满，却又无法再次反驳。\n\n因为森西的厨艺确实很棒。\n\n“长得奇怪的东西也不行！”宫廷魔法师给出了自己的最后修正案。\n国王不敢反对，其他人更是赞同。"
  LOS.event.5.a: "当然，莱欧斯心中还是有一点小小的遗憾…"
  LOS.event.6.t: "探险动员演讲"
  LOS.event.6.d: "清晨，蒙蒙亮的天色和森林中的鸟鸣，与冒险者们的大型营地的动静形成了鲜明的对比。这些常年把脑袋别在裤腰带上的“寻金客”“雇佣兵”，如今将再一次踏上冒险的征途。诚然这一次的对手不再是像红龙与狂乱魔法师那样的棘手对手，但这仍是一场危险的冒险。\n\n很快，这群身经百战的冒险者们就集结起来，他们虽然没有正规军队那般的纪律性，但是单兵作战和灵活机动，他们是王牌中的王牌。\n现在，他们听着面前的领袖、雇主或者朋友—莱欧斯—做最后的讲话。\n\n“嘛……”莱欧斯挠了挠头，“老实说，我本人不太会讲什么场面上的话。”\n“我其实对大伙还是挺不好意思的，毕竟这场地下城探险是我自己主张的，结果让大家来到这样一个不毛之地。”\n“不过！”莱欧斯露出兴奋的神色，“如今我们已经有了一个方向，北方据说有着大量的魔物盘踞在那里，我们的专业技能在地面上也能有用武之地！”\n\n“别废话了国王大人，既然发现了魔物，那么我们下一顿吃什么！”台下的一个声音开始起哄。\n\n“是啊，吃什么！”响应者云云。\n\n“嘛，我是打算……”莱欧斯正欲畅言，但是看到台下一脸不悦的玛露希尔，顿时把自己的那些设想收了回去，“额，目前还没有想到，但是我保证，一定为大家准备丰盛的庆功宴！”\n\n“那还说什么，下命令吧老大！”\n“哦！出发！”\n“好嘞！”"
  LOS.event.6.a: "寻金客，或者寻肉客？难以分辨"
  LOS.event.7.t: "美食图鉴指南：碳烤丑鬼肉"
  LOS.event.7.d: "操作者：森西     记录者：莱欧斯\n\n核心材料：\n主料：丑鬼一只（不去皮，烤后皮会酥脆）\n腌料：盐、辣椒、蒜瓣捣碎成泥，均匀涂抹全身。\n刷酱：姜黄粉、咖喱粉混合十几种香料调成酱料，烤熟后刷上提香。\n蘸料：吃时配姜蒜汁或番茄酱。\n\n做法：\n首先，把头往案板上磕晕，用近沸腾的热水烫皮，钢丝球搓掉表层鳞片和苦皮，剖开去内脏，冲洗干净血污。炭烤不去皮，烤后皮会酥脆。\n然后，将丑鬼整只放烤架上，中火慢烤，不停翻面受热均匀。小型丑鬼烤5—8分钟，巨型丑鬼可能要45分钟，烤到水分收干、脊骨把头拽起来即熟透。\n快烤好时刷姜黄粉、咖喱粉加十几种香料调成的黄酱，也有香辣蘸酱，主要起调味提香作用。\n趁热剪成小段，蘸姜蒜汁、柠檬汁加胡椒盐，或配米饭当烤肉饭吃。\n\n然后就完成了！碳烤丑鬼肉！"
  LOS.event.7.a: "莱欧斯注：非常酥脆，非常好吃！"



