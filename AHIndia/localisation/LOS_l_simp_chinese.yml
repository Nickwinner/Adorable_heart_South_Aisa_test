#民族精神
LOS_autoconstruction: "魔物自动化畜牧业"
LOS_autoconstruction_desc: "在恶食王莱欧斯掌握了地下城的魔物生态循环后，黄金国彻底实现了魔物之间完美的繁衍生息与和谐共存，黄金国的人民可以随时享用各种由魔物所组成的美食，彻底摆脱了饥荒与食物种类匮乏的困境"
LOS_cookbook: "魔物烹饪食谱"
LOS_cookbook_desc: "在莱欧斯国王的地下冒险中，他所积累的关于各种魔物烹饪的丰富经验被汇编成册并广发于黄金国，如今，王国内的人人都是烹饪魔物的高手，这不光在民间效果极佳，在军队后勤方面也卓有成效，极大地解决了军队补给不足的问题"
LOS_dongeon_ace: "经验丰富的地下城冒险者军团"
LOS_dongeon_ace_desc: "虽然黄金国地下城的冒险已经告一段落，但是经过地下城磨练的冒险者团所积累的丰富战斗经验，和在黑暗环境的适应能力，将在陆地作战上发挥更大的作用"


