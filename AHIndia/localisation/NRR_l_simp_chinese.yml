  NRR_rebuild_category: "国家重建计划"
  NRR_rebuild_category_desc: "“无人是一座孤岛，在大海里独居”\n\n在重建国家的过程中，塔兹米需要友人与伙伴的§G帮助§!，但他同样明白，在某些时刻，自己独立的§R决断§!也许可以使得整个事态变得更为明朗，以更快地实现他的目标，诚然这可能会导致他和战友们的§g疏远§!...\n\n在重建委员会中，§P三人团§!会努力确保塔兹米不要走上偏激的道路以确保重建委员会运作在正确的道路上；只要§P三人团§!的建议被采纳并付诸实践，就将获得§G团结点§!\n\n反之，如果塔兹米决意乾纲独断，或者被某些目标而舍弃掉耐心与谨慎，那么在获得更显著的成效同时，还会获得§g专断点§!。\n\n两种点数有着各自的用途，两利相权取其重、两权相害取其轻，偏执一端可能对于全局§R并无益处§!...\n\n“因此,\n不要问丧钟为谁而鸣，\n丧钟为你而鸣。”\n\n\n我们现在有[?Root.NRR_rebuild_unity_point|+0]§G团结点§!\n我们现在有[?Root.NRR_rebuild_arbitrary_point|+0]§g专断点§!"
