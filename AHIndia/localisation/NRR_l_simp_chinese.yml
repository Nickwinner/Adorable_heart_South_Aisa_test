#开局介绍
  NRR_GATHERING_STORM_DESC: "自1904年的灾变后，这支千疮百孔的革命军在层层围堵中艰难存活、远走他乡、从头来过......意志、理想、恐惧......在各种各样的情绪下，来自恒河流域各处的人齐聚这块帝国无暇理睬的东部边陲，经过十余年的不懈努力，如今终于重新拥有了与帝国一战的实力。\n\n摆在他们面前的困境还有许多：差劣的装备、落后的军事组织、青黄不接的革命军内部。但是，只要这股革命之火仍然熊熊燃烧，那么一切皆有可能，直至黎明破晓，直至生命尽头。"


  NRR_start_game_text: "斩断这片土地的诅咒"
  NRR_his_page_01_title: "被激化的立宪者"
  NRR_his_page_02_title: "胜利中断"
  NRR_his_page_03_title: "枕戈待旦"


  NRR_Country_History_Page_01: "被帝国抛弃的§C立宪民主派§!、被圣杯背刺的§O共和主义者§!、被灾变屠戮的§R革命军§!，这支队伍可以说是输家中的输家，所剩的一切仅有外界可怜的同情和百不存一的追随者。\n\n当他们在1922年初到丹兑时，全军不足一万人，丛林丘陵交错，疫病横生，还面临着语言不同，交流困难的种种问题，这里反帝国的势力很多，但指挥混乱，各自为政，组织效率低下，多为羁縻统治的原始族群和零散的山林游击队。\n一切只能从头做起，他们先渗透入曼德勒、仰光这样的大城市，就如他们的先辈所做的那样，与当地底层民众接洽，建立各城市之间的联系。在这方面，作为领袖的§C娜洁希坦§!发挥了重要的贡献，她原先的帝国军联系为她在执行接洽过程中赢得了不少优势。\n\n总之，在短短5年的时间里，娜洁希坦所率领的革命军实现了死灰复燃，根据地再一次被成功的建立，也正由于帝国对东部边陲的影响力微乎其微，待到旧帝国方面开始意识到革命军东山再起之时，娜洁希坦的革命军及其支持者早已不复1922年时的窘迫，并在持续地囤积力量，甚至获取到了几具帝国遗落丢失的帝具。\n惊慌失措的旧帝国从安稳的美梦中惊醒，紧急开始组织人手开始清剿革命军，情急之下，他们无奈于1929年选择了最强大，军力也最为充足的将军——艾斯德斯——作为进攻革命军“狩人军团”的总司令，并赋予了艾斯德斯近乎独立王国一般的军事指挥权。虽革命军斗志昂扬，但苦于装备和科技代差，始终在与狩人军团的正面战争中陷入下风，两方在六年多的时间互有攻防，但总体态势保持僵持局势。"
  NRR_Country_History_Page_02: "尽管革命军在当前以革命胜利与革命火种的存续为第一要务，革命军上下大致也保持了基本的团结与组织性，但其中的组成却值得分析。\n\n§C娜洁希坦与民主共和党§!\n这是革命军中的老班底与主力军，娜洁希坦虽然是原帝国的将军，但她已经用十余年的功绩与忠诚，证明了其在革命军中无可争议的领导地位，尽管如此，娜洁希坦依然重视内部的分工合作，提拔原§C民主共和党§!成员成为指挥层与高级领导层的主干。诚然，§C民主共和党人§!常常因为鼓励充分讨论而使得议程进展明显放缓，但§C娜洁希坦§!在胶着时刻的乾纲独断又能使得二者的长处相得益彰。\n\n§R夜袭组织§!\n作为革命军最为锋利的刀刃与地下情报组织，娜洁希坦于1923年便开始着手这一秘密部门的组建。其中，除了加入最早的§C赤瞳§!和主动来到曼德勒加入夜袭组织的§C伯拉克§!外，组织内部的人员基本上都是如§R塔兹米§!、§R玛茵§!等加入不久的新鲜血液为主要组成部分，他们更为年轻，资历尚浅，但对于革命也更为热忱，除此之外，夜袭组织于帝国的地下组织据点的搭建也多依赖原§R社会党§!的协助，也有相当多的人来自于此。\n\n§g合作派§!\n正如前文所说，娜洁希坦凭借其身份拉拢了大量的摇摆分子和中立人士加入到革命事业当中，他们或许是城市中的商人、原帝国军的军官或者边远地区的农村代表，他们相信通过与革命军的合作可以真正的减少来自国家政府对他们的剥削和压榨，亦或者企图通过改换门庭来争得新政府的一席之地。随着革命军在仰光、曼德勒等地区的工作日益深入，这群人在革命军中的占比也日益上升，并有越来越多的人跻身高层之中。"
  NRR_Country_History_Page_03: "随着局势的推进，战争白热化的态势愈发明显，革命军也意识到，狩人军团亦在积蓄力量，通过集中一击，企图再次消灭革命军。\n\n革命军始终没有放弃在内外两个方面持续发力，内部的城市建设工作和军工生产线在数年的筹备和初步建设后尚需临门一脚；外交工作则显得更加困难，各国虽然开始接触革命军的代表，但对于承认其为唯一合法政府，以及进一步的合作尚欠缺互信的基础和可行性，有赖进一步的工作部署。\n\n娜洁希坦和革命军相信，总有一天，她们将回到家乡，将整个半岛再一次统一起来，将和平与新生带回她们的故乡，并确信这一天将很快到来。"


  NRR_Local_History_Title: "§Y南亚§!"
  NRR_loca_his_t_01: "热土冷铁"
  NRR_loca_his_t_02: "革命与灾变"
  NRR_loca_his_t_03: "新事态"

  NRR_Local_History_Page_01: "\n§Y兴衰迭起§!\n\n南亚作为一片肥沃的土地，因其季节明显，降水充沛，且土地平坦，在历史上，它始终长期保持着大量的人口和不错的收成。当然，这也预示着过多的力量与滋生的矛盾。\n这片土地因背靠高山，三面环海，仅有东西两处陆路连接着西亚与东南亚，所以南亚的纷争往往聚焦于内部，千年以来，历经了孔雀王国、贵霜帝国、笈多帝国、戒日王国等相对安定的时代，自7世纪后的数百年间，半岛始终维持着分裂割据的局面，文化断绝，政治混乱，曾经繁昌的文化中心成为了一片荒芜。\n\n§Y外敌与帝国§!\n\n转折点发生在13世纪，由西方而来的西亚帝国一度占据了半岛的整个北部，这股外来者势力深刻影响了半岛的历史，西亚地区的排他性神学信仰和戒律教规逐渐被北部地区所接受，而南方诸邦仍然坚守者原来的多元文化和较为开放的传统习俗，这导致鲜明的二元文化格局。然而在16世纪中叶，西亚帝国的腐朽与贵族叛乱摧毁了这个由外来者建立的帝国，随即以极快的速度，以军事或外交手段，整合了整个半岛，南亚又进入了一个相对稳定的统一时代。\n\n§Y腐坏、机遇与赌博§!\n\n海天之内，岂有长生不灭者？\n\n帝国的腐败是意料中事。曾经这个帝国的君主为了体现他们的伟大与不朽，直接废弃了国号与朝代之名，只需以“帝国”称呼即可，意为四海之内，无有二国。但令人啼笑皆非的是，帝国的皇室、总督和官员，官僚系统的腐朽和贪墨却比以往的任何时代就要更加严重和放肆。与此同时，走火入魔的帝国贵族们着迷于外国传入的源石技艺，但帝国自身客观上的工业水平和资源储量远不足以自行复现这项技术，于是，帝国形成了一个竭泽而渔又极其扭曲的科技体系。一方面，他们榨干了国家科研资源的一切用来打造帝国贵族眼中守卫国家的神器——“帝具”，另一方面，除了帝具外的一切科技陷入了严重的停滞，经济、文化也无法得到充分的均衡发展，官僚直接干预商业又使得大量的市民沦落为乞丐，于是，反抗的温床出现了。\n\n§Y失败的立宪§!\n\n起初，革命并未成为人们的共识。\n十八世纪，随着圣杯王国无可争议的全球殖民霸权的确立，帝国自然也被囊括在了圣杯的势力范围内。圣杯王国成功的立宪政体让广大的中底层看到了改变的希望，与此同时，始终保持开放态度和多元文化格局的半岛南端逐渐成为了备受外国青睐的贸易据点与驻留地，地理位置与文化因素的双重加成下，南亚的政治格局呈现出了鲜明的，一如历史所塑造的二元格局：§C南部§!开始普遍接受由欧洲传来的民主概念和解放人性的人文思潮，而处于帝国核心区域的§g北部§!仍然保持着高压统治和传统的专制主义主导。\n迫于国内改革呼声和圣杯王国的外部压力，帝国于十九世纪初叶被迫开始了仿照欧洲的议会制立宪改革，尽管这是一次不完全的立宪改革。起初是南方立宪派的高歌猛进，首先于地区公投中通过南部诸省和中部诸省的微弱优势，通过省份票挫败了帝国贵族的“多数代表制”提案，转为立宪派赞成的“比例代表制”，又以选举的方式在南方地区通过了小选区制度，确保了立宪派能在局部地区发挥优势。尽管在最终的1827年选举中，立宪派组成的§C民主立宪会§!在600席中仅夺得227席，未能战胜由帝国权贵和保守势力组成的§g帝国议政联盟§!，但成功使得§g帝国议政联盟§!未能获得超过三分之二的席位，使得立宪派仍然占据着一战之力。"
  NRR_Local_History_Page_02: "\n§Y欺骗与屠杀§!\n\n那么为什么要说是不完全的立宪呢？因为皇帝的独裁权并未受到制约，甚至连大臣们的任命权与行政权力都未能受到有效制约。虽然帝国仿照圣杯议会的体制，规定了重大议案必须获得2/3议席的赞成票，但帝国对于议会通过的立法与贵族大臣发布的行政命令之间的法律位次并未做出明确的规定。简而言之，当§g帝国议政联盟§!未能在议会通过他们想要的议案时，他们便直接转而使用行政命令强行执行，当§C民主立宪会§!支持的法案通过时，他们便立刻通过行政系统层层阻拦，最终使得立宪派的一切努力无功而返。\n§C立宪派§!立刻意识到了这是一场骗局，他们也一直试图通过渗透官僚系统来实现某种平衡，但官僚系统的整体腐烂已经无可救药，根本不存在任何的由内改变的可能。与此同时，圣杯王国的态度发生了微妙的转变，圣杯意识到与其费心扶植一个意识形态相近的在野党，不如直接收买笼络腐朽的执政帝国贵族，后者往往能给圣杯带来更直接的利益与更丰厚的优待。于是在失去内外力量的情况下，形单影只的§C民主立宪会§!一直苦苦支撑也未能有所作为。\n\n§R节点§!发生在1877年，圣杯王国借腐朽的官僚系统，强行在行政层面和立法层面通过了臭名昭著的《阿姆利则条约》。条约约定：圣杯王国将于马德拉斯城附近挑选一处港口，作为圣杯王国租界，租期99年，同时“确认圣杯王国于斯里兰卡、马尔代夫群岛及附属岛屿享有独特的权利”。这一条约无不被人们视作赤裸裸的卖国条约。在§C民主立宪会§!的支持下，班加罗尔、马德拉斯等南方大城市爆发大规模的游行示威和暴力活动，抗议反对帝国政府的这一行为。而悲剧也接踵而至，帝国政府在§g帝国议政联盟§!的默许下开始了血腥的武力镇压，许多§C民主立宪会§!的国会与地方议员也被逮捕。剩余的立宪派成员顿时遭到了保守势力与激进势力的双重诘难，大量的激进派从§C民主立宪会§!出走，企图通过立宪改革和平过渡至现代国家的美梦破灭了。\n\n§R革命§!\n\n事态的发展迅速走上快车道，在《阿姆利则条约》签订的第二年——1878年——§C民主立宪会§!宣布解散。反对派们意识到，若想成长成为一个能真正与执政的贵族联盟相抗衡，一个松散的大帐篷联合已不可持续，必须组建成一个具有纪律的政党。于是，以原§C民主立宪会§!为基底的§C民主党§!应运而生。同时，新兴的亦是更为激进的§O公民共和联盟§!与受欧洲影响的各色§R社会主义政党§!分别在1886年和十九世纪九十年代末应运而生。\n\n终于，§R革命§!的第一枪首先在受殖民影响最深，也是自由派的大本营马德拉斯打响，1896年，因新一轮的加税和层层盘剥，忍无可忍的马德拉斯市民发动罢工罢市，帝国警察的暴力镇压使事态迅速演变成街头暴力与武力对抗。声势愈发壮大的起义民众在占领了各处警察局后迅速武装起来，宣布马德拉斯独立，南方的迈索尔、班加罗尔等大城市在1897年与1898年前后响应支持革命，由南部籍士兵组成的数支军队也发生了大规模哗变，革命如同燎原之势点燃了半岛的南半部，§C民主党§!趁此机会与§O公民共和联盟§!正式联合，合并为§C民主共和党§!并在1900年迅速居中联系南方各省，将前线推进至果阿—安德拉一线。\n帝国一直强压事态，对外宣称无事发生，一面紧急调动军队企图强行镇压革命，但早已腐朽不堪的帝国军队完全无法抵挡革命军的进攻；而圣杯王国在观察到革命军的势如破竹后态度再次发生了改变，减少了对帝国的援助。惊慌失措的旧帝国一面以更加卑微的姿态，通过出卖更多国家利益来换取圣杯继续军援，一面开始疯狂推进“帝具”的开发力度，§R灾变§!由此发生。\n\n§R灾变§!\n\n1904年，整备完毕的革命军企图越过克里希纳河，预计一举拿下中部大都市海德拉巴，以奠定革命局势的彻底优势。万念俱灰的帝国贵族开始孤注一掷的快速推进“帝具”武装的新型迭代，并企图通过优势武器来抵挡革命军，但是，当革命军一路攻到海德拉巴城下时，一声巨响在海德拉巴城内响起，随后是滔天的城市大伙。\n起初，革命军以为是此前一直居于敌后的§R社会党§!按照计划于城内响应革命的信号，于是改变计划轻装前进抵近城墙，但是火势和爆炸声过猛，就在革命军刚刚起疑之时，数不尽的身形奇异的怪物从城内冲出，开始不分敌我的攻击革命军与帝国军士兵，整个海德拉巴战役陷入堪称恐怖的局势当中。\n事后各国多方的调查众说纷纭，支持革命军的分析认为是狗急跳墙的帝国分子在绝望中引爆了城中的大型帝具研究中心；也有观点认为是一场轻率的鲁莽实验导致了这场悲剧。但结果无可争议，这场史无前例的大爆炸导致某种连接其他世界的大门被炸通（故意说则认为是帝国派鱼死网破的某种仪式导致的主动连通），一群嗜血的怪物从通道中被放出（事后它们被命名为“丑鬼”），造成的伤亡以千万计数，海德拉巴方圆百余里几无人烟。"
  NRR_Local_History_Page_03: "\n局势的发展超出了所有人的预料，南亚半岛的中部几乎为一片赤土，帝国虽元气大伤，但他们不在乎中部的灾难与本计划舍弃的守备军队，反倒借灾难巩固了作为政治中心的北部地区。\n\n最大最直接的受害者是南方的革命势力。革命军中的主力精锐在这场灾变中殁尽，指挥体系和指挥层的绝大多数将官死亡或下落不明。圣杯王国抓住时机迅速在租界和斯里兰卡岛加派驻军，宣布“紧急事态使得内战各方无法继续稳定局势”，以“保护侨民的名义实控了斯里兰卡及马尔代夫诸岛，并且以直接军事人员援助和物资援助，成立了应对事态的”魔防队“，借机接管了陷入混乱与恐慌的南部各大城市，并明确宣布拒绝革命军进入接管地区，断绝一切形式的援助与支持。\n\n革命军前线死亡殆尽，后方失去根据地，一度陷入完全停滞和各自为战的状态。直到世界大战结束后，一位原属于帝国海德拉巴守军的将军——§C娜洁希坦§!——突然在1921年，率领一支残存的革命军杀出灾变的沦陷区，出现在果阿附近，召集残存的革命军和游击队，经革命残军与魔防队的多番讨价还价，革命军接受以接受圣杯对南方城市的行政接管现状，换取圣杯王国运输船只护送前往帝国统治力空虚的东部地区。至此，半岛的局势再次陷入僵持。"
  NRR_route_guide_desc: "如果你点开此页，那证明你需要一个清晰的结果，一个明确的方向。\n\n好极了。§P夜袭革命军§!同样渴求一个明晰的道路。\n\n\n\n在开局不久，一名§R夜袭团成员§!在执行任务的过程中，会意外地与总部失去联系，随后，他可能会、或可能不会给革命军总部带来一个令所有人震惊的消息：§G艾斯德斯渴望与革命军合作§!\n\n\n如果革命军总部从未得到过这个消息，那么固然前方战斗会更加艰难困苦，但是这也给了革命军更§C纯洁的革命高层构成§!，这将在革命胜利后的建国初期起到§P至关重要的作用§!，直接决定了娜洁希坦及其政府的改革成效。\n\n\n但是，如果革命军总部“§C幸§!§R运§!”（或者说不幸）地得到了这个消息，那么面对前方的强敌，和旧帝国政府迫在眉睫的与外国列强同流合污的风险，§C娜洁希坦§!会为了革命的胜利拼上一切，选择接受艾斯德斯的提议。\n\n\n这当然使得革命的进程大大加快了，事实上，在这一条件下，许多革命根据地的战前准备甚至成了不需要的东西（如果有就更好了）。但是，这会导致革命军高层加入了许多意志不坚定的§g合作派§!，或者说，帝国余孽。他们最终会在建国后对共和事业造成§R不可估量的恶果§!\n\n而此时，那位带回消息的§R夜袭成员§!会深感自己的行为带来的灾难性后果，决意§R赌上一切§!为了重建这个国家。\n\n\n在这一情况下，有三句建议：\n\n第一，相信他的§P战友们§!，他们是他§G坚定的支持者§!，只要§G团结在一起§!，便不会有坏的情况发生\n\n第二，§g乾纲独断§!并不总是坏事，它在某些事情是利大于弊，但请不要一直这样\n\n第三，即使你不想做到以上两条，也请务必听进这一条：不要接受某些§g诱人的§!§R提议§!，即使它看上去多么无害（毕竟我们曾经因为这样的一份提议而走到了今天的局面不是吗？）\n\n\n以上就是路线指南的全部，这片土地的命运总是反复无常，现在，其命运握在你的手里。"

#结语
  
  NRR_democratic_survived_end_title: "终于，恒河的§P民§!§C主§!得以幸存"
  NRR_democratic_survived_end_tip: "§C娜洁希坦§!没有辜负革命军与人民寄予她的厚望，以§r决心§!与§G智慧§!，她用理想与权术妥善地处理好了建国前后的诸多难题。\n\n在娜洁希坦与原夜袭诸多成员的努力下，恒河共和国的政治、经济与文化得到了快速的复苏，在清明政治和铁腕反腐的制度下，农村的饥荒与城市的贫困在娜洁希坦的第一任期得到了极大的改善\n\n大获全胜的§C民主共和党§!在娜洁希坦的第二任期内高歌猛进，在列强陷入世界大战的泥潭之时巧妙地采取了中立均势立场，待战事结束之际，恒河共和国已然成为了一个世界各国无法忽视的新兴大国，而娜洁希坦坚守了共和民主的初心，于任期结束之际宣布退出政坛，§P恒河共和之母§!自此成为恒河永久的传奇......"
  NRR_democratic_survived_end_tip_2: "§L感谢游玩钢铁萌心：喜马拉雅下的恒河§!\n§L感谢游玩夜袭革命军§!"
  NRR_democratic_survived_end_close_button: "共和万岁！民主万岁！革命万岁！"
  NRR_democratic_survived_end_close_button_TT: "对于§B恒河的人民§!而言，这无疑是最好的结局，当然，对于§g某些人§!来说并非如此...你想去§R看看§!吗"

  NRR_Tatsumi_perfecet_end_title: "至此，§Y[FROM.Getname]§!的§R理想§!得以实现"
  NRR_Tatsumi_perfecet_end_tip: "§R塔兹米§!没有背弃自己的§R诺言§!，一个伟大的§C民主§! §R共和国§!在坚毅的§G智慧§!与众人的§R团结努力§!中做到了最好的结果。\n\n在§R塔兹米§!、§P玛茵§!、§C赤瞳§!和§G拉伯克§!的共同努力下，一个致力于民族解放、统一与自由的独立南亚成为了世界受压迫地区的榜样，一个不同于强权压迫与强国对抗的多极化的新格局正在形成，而南亚将为新时代的§G和平§!贡献自己的力量。\n\n无人是一座孤岛，独自屹立在海洋中;人类的智慧莫过于§P等待§!与§R希望§!。但若要让§R夜袭团§!的成员们再加上一个词的话，想必那就是他们一直秉持的——§G团结§!"
  NRR_Tatsumi_perfecet_end_tip_2: "§L感谢游玩钢铁萌心：喜马拉雅下的恒河§!\n§L感谢游玩夜袭革命军§!"
  NRR_Tatsumi_perfecet_end_close_button: "致理想，致友情，致团结"
  NRR_Tatsumi_perfecet_end_close_button_TT: "感谢§R坚持理想§!的§R塔兹米§!，也感谢§C你§!"


  NRR_Tatsumi_normal_end_title: "至此，§Y[FROM.Getname]§!的§R希望§!得以延续..."
  NRR_Tatsumi_normal_end_tip: "§R塔兹米§!尽到了他所能做的一切，尽管取得了成绩，尽管拼尽全力，但他内心的§g踌躇§!与§G理智§!之间的搏击让他或多或少错过了一些机会，也许§G拉伯克§!会弥补这些过失，夜袭团的成员在彼此理解与支持上从未输给其他人。\n\n从谷底走上山峰，又从山峰走下，§R塔兹米§!或多或少都有些失魂落魄，也许，他能做得更好，也许，他应该更多听听§G朋友们的意见§!，兴许就能改变一些事情，兴许就能到达此前从未有人攀登成功过的山峦之巅。\n\n不过，这都是事后之念，握着§P玛茵§!的手，望着夕阳西下，微风与虫鸣让他失神。\n\n一切会好起来的，一切还会更好。他心里如是想着"
  NRR_Tatsumi_normal_end_tip_2: "§L感谢游玩钢铁萌心：喜马拉雅下的恒河§!\n§L感谢游玩夜袭革命军§!"
  NRR_Tatsumi_normal_end_close_button: "人类所有的智慧皆集中于此：§P等待§!与§R希望§!"
  NRR_Tatsumi_normal_end_close_button_TT: "不算最好，但也不坏，想看看最完美的结局吗？"


  NRR_Tatsumi_bad_end_title: "至此，§Y[FROM.Getname]§!的§g命运§!仍然等待转机..."
  NRR_Tatsumi_bad_end_tip: "§R塔兹米§!失败了。\n\n一个踌躇满志的§R革命者§!，一个曾为§R理想§!拼搏一生的青年，倒在了自己亲手埋下的恶果之中。\n\n到底是哪里做错了呢，到底是什么地方做错了呢？\n\n§R塔兹米§!没能想明白。\n\n他的§R祖国§!遗忘了他，反对者将他钉在罪人的耻辱柱上。\n\n他的§C人民§!遗忘了他，他成为了历史书中无足轻重的一页中的一个人名。\n\n他的§P挚友§!离开了他，他永生都将为此哭泣。\n\n到底是哪里做错了呢？\n\n多年以后，面临自己的§R死期§！，§R塔兹米§!会想起他邀请§P玛茵§!，一同为国家而努力的那个遥远的下午。"
  NRR_Tatsumi_bad_end_tip_2: "§L感谢游玩钢铁萌心：喜马拉雅下的恒河§!\n§L感谢游玩夜袭革命军§!"
  NRR_Tatsumi_bad_end_close_button: "§g届时，你便知道了我悲惨经历的全部§!"
  NRR_Tatsumi_bad_end_close_button_TT: "§Y退一万步想，这便是最坏的结局了，但还能差到哪里去呢？§!"
  
