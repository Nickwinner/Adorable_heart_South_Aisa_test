l_simp_chinese:

#国策   
  NRR_revolution_day: "革命日"
  NRR_revolution_day_desc: "革命军迎来了新的一年，许多人将预感到，从今年起，恒河悬而未决的命运，将迎来转机......"
  NRR_meeting: "高层决策会议"
  NRR_meeting_desc: "按照惯例，革命军的高层会在新年伊始开始一次简短的对去年革命工作的回顾和未来形势的展望。会议在娜洁希坦的主持下，会议简报将迅速发往各机构，当然，包括革命军的利刃——“夜袭”"
  NRR_purchase: "派遣塔兹米"
  NRR_purchase_desc: "对于革命军。尤其是深入敌后作战的夜袭而言，武器的获取尤为困难。为了解决这一短缺现状，有时就得用非常之人，行非常之事。也巧，夜袭组织中正有这样一位新人，尚未引起敌人的关注......"
  NRR_not_a_chance: "断然拒绝"
  NRR_not_a_chance_desc: "我们的观察员看到了狩人军团正在后撤......据传她们在提出某种停战谈判......见鬼去吧！这些卑劣的诡计可骗不了我们，这是敌人即将发起总攻的信号，全军准备！"
  NRR_cooperation: "必须让步"
  NRR_cooperation_desc: ""
  NRR_mobilization: "开始战争动员"
  NRR_mobilization_desc: "决战即将到来，这一事实已经不言自明，数年乃至十余年的准备，必须在此做一个了结了！后方的军工厂、城市、港口开始戒严，前线的岗哨开始实施双倍人数值班和乱序班次，一切军事准备都正按照最高的战备状态进行。"
  NRR_negotiate: "深度谈判"
  NRR_negotiate_desc: "我们的观察员看到了狩人军团正在后撤......为了验证她们提出谈判的真伪，娜洁希坦将军将力排众议，亲自前往谈判..."
  NRR_rliminate_heresy: "清除顽固异端"
  NRR_rliminate_heresy_desc: "我们开出了我们的价码，如果艾斯德斯想要证明合作的诚意，那首先就要将狩人军团中最顽固的帝国分子驱赶或清洗出去，这样，和平改编才成为一个可能的选项..."
  NRR_battle_ANR: "西征艾斯德斯"
  NRR_battle_ANR_desc: "就是今天！为了死去的人们，为了牺牲的烈士，让那群畜生瞧瞧，他们最害怕的革命军主动向他们冲锋而来了！"
  NRR_unite: "诡异的合作"
  NRR_unite_desc: "令士兵们和根据地的人民们费解，也令革命军领导层上上下下大部分的人感到费解的是，那个革命军刽子手，那个臭名昭著的战争贩子，艾斯德斯，今天向我们投降了——至少最高委员会是这么向人们说的，但是没有人看见战犯被处决，也没有狩人军团军官被审判的传闻，就好像这一切在做梦一样......"
  NRR_onslaught: "抓紧猛攻"
  NRR_onslaught_desc: "不要想着伤亡与疲惫！想想即将成立的伟大共和国！恒河的人民正盼望一场无与伦比的胜利！为了共和！"
  NRR_end_empire: "一举终结帝国"
  NRR_end_empire_desc: "“亲爱的姐姐，听说我们的胜利进军让革命军最高委员会宣布全国放假一天。我知道食物或许能让侄儿们更开心些。在这里，我们找到了被遗弃的帝国军仓库，里面装着各类补给物资。我们真是在吃着自己的战利品呢。这里有面包、鸡蛋，还有啤酒。一旦我们攻下德里，我会试着寄一些回家。”"

  NRR_ready_for_war: "做好战争准备"
  NRR_ready_for_war_desc: "“和平”不过是旧秩序抛给被压迫者的廉价诱饵。当反动势力的铁蹄在边境线上重重践踏，当那些旧帝国的高层在异国沙龙里策划着夺回枷锁，我们必须意识到，唯有钢铁与烈火才能守住黎明的果实。革命军总部已经下达了动员令：每一座被解放的工厂都要化作锻造雷霆的铁砧，每一位自由的公民都应成为捍卫旗帜的尖兵。\n高层委员会一致认为，与其等待敌人的绞索落下，不如在风暴降临前磨利我们的刺刀。这不是为了挑起杀戮，而是为了确保当反击的号角吹响时，我们手中紧握的是足以粉碎旧世界的铁拳，而非一张委曲求全的废纸。"
  NRR_rally_soldier: "征募地方民兵"
  NRR_rally_soldier_desc: "“枪杆子不仅要握在革命军手里，更要握在每一个翻身家庭的手里。”在高层委员会的号召下，伊洛瓦底江畔的沉静被彻底打破。从曼德勒那古老的城墙根到实皆省的丛林深处，从瑞波的农田到敏建的集市，成千上万的民众放下了锄头与渔网。他们或许没有笔挺的制服，手中只有锈迹斑斑的旧式步枪甚至长刀，但眼神中燃烧着守卫土地的赤诚。\n这些来自基层的力量正向指挥部汇集，在曼德勒的广场上宣誓效忠。他们比任何正规军都熟悉故乡的每一条小巷与每一片沼泽。革命军总部深知，当每一个村落都化作反抗的堡垒，当每一座城镇都筑起人民的防线，任何试图复辟旧秩序的企图都将在曼德勒城下撞得粉碎。"
  NRR_find_rifle: "集中游击队武装"
  NRR_find_rifle_desc: "“每一把枪都曾沾染过压迫者的硝烟，而现在，它们必须回到真正的主人手中。”在高层委员会的旧仓库里，那些从边境走私、战场缴获甚至作坊自制的武器被整齐地码放。这不再是各游击小组之间为了几杆步枪而争执不下的混乱局面，革命军总部正以一种前所未有的铁腕与效率，将有限的火力资源重新整合。\n从曼德勒的秘密据点到周边丛林的简易营地，一箱箱弹药被贴上“分配”的封条。我们不再允许珍贵的重武器在偏远的角落蒙尘，而是将其集中拨交给最有战斗经验的尖刀连队。虽然分到每个人手中的或许仍是带着缺口的刺刀，但高层委员会很清楚：当这些混杂着各国钢印的武器被统一调度，它们将不再是游击队的防身符，而是刺向反动政权心脏的集束利刃。"
  NRR_invite_military_advisor: "邀请军事顾问"
  NRR_invite_military_advisor_desc: "“革命不仅需要满腔的热诚，更需要科学的杀戮艺术。”尽管我们厌恶旧世界的阶级压迫，但不得不承认，那些老牌帝国在战争领域有着数个世纪的积淀。高层委员会经过彻夜辩论，最终决定向大洋彼岸的圣杯与隔海相望的幻想乡发出秘密邀请。我们需要圣杯那严谨的组织架构与阵地战经验，也需要幻想乡那富有浪漫色彩却极具杀伤力的机动学说。\n一批身份隐秘的“教官”正越过重重封锁抵达革命军总部。他们将脱下华丽的军礼服，换上我们的粗布军装，在曼德勒的临时讲堂里，将那些曾在世界大战中反复验证的战术传授给年轻的指挥员。虽然高层委员会时刻警惕着这些外来者的意识形态渗透，但为了让新生的政权不在敌人的装甲洪流下夭折，我们必须先学会如何像他们一样作战，然后再用这套本领彻底埋葬他们。"
  NRR_oldgun: "遵循旧军事理论"
  NRR_oldgun_desc: "“火炮在哀鸣，而真理只在射程之内。”尽管时代在变迁，但高层委员会中的老将们始终坚信，上次大战留给血肉之躯最深刻的教训便是：压制，无情且猛烈的火力压制。在革命军总部那张被烟草熏黄的地图上，红色的箭头总是标注在敌方防御最坚固的支撑点，而唯一的对策就是倾泻成吨的钢铁。\n我们不必去迷信那些所谓“机动突击”的空中楼阁，对于根基尚浅的革命政权而言，覆盖每一寸阵地的饱和式火网才是最坚实的护盾。高层委员会坚信，战争面前，炮弹的消耗不过是账面上的数字，而每一枚呼啸而出的榴弹，都是在为冲锋的战士扫清枷锁。只要火力的轰鸣声不停歇，地平线上的反动堡垒终将在硝烟中化为平地。"
  NRR_nightraid_lead: "发挥“夜袭团”优势"
  NRR_nightraid_lead_desc: "“黑暗并非我们的障碍，而是革命最忠诚的掩护。”与那些迷信阵地与口径的保守派不同，高层委员会中的激进将领们更看重人的主观能动性。在那群被誉为“夜袭团”的英雄们影响下，革命军总部开始全面推行一种更具进攻性的战术体系：放弃死板的火力对射，转而在夜幕的掩护下，发动如潮水般永不停歇的机动突击。\n我们不需要计算每一颗炮弹的落点，我们要计算的是敌人意志崩溃的临界点。当成千上万的战士在群星闪烁之时跨越铁丝网，当白刃战的呐喊声在每一个敌方营地同时响起，任何先进的火力防御都将沦为摆设。高层委员会坚信，革命的胜利不应寄托于昂贵的钢铁堆砌，而应建立在敌人对黑暗那无处不在的恐惧之上——当黎明升起时，我们的旗帜早已插在了对方还在梦呓的指挥部顶端。"
  NRR_learn_gun_design: "学习先进火炮设计"
  NRR_learn_gun_design_desc: "“革命的真理，往往是由炮弹的弧线勾勒出来的。”高层委员会深知，若要让旧世界的堡垒在怒火中颤抖，我们就不能满足于土工作坊里的劣质火药。革命军总部已经下令，派遣最聪明的学徒前往圣杯与幻想乡的军工厂，去窥探那些足以改变战争天平的工业秘密——从炮管的精密膛线到自动复进机的复杂结构，从高爆弹的配方到光学瞄准具的校准。\n随着图纸与样炮通过秘密渠道运抵曼德勒，我们的兵工厂正日夜不辍地模仿、改进并最终实现量产。我们追求的不是华而不实的技巧，而是极致的效率与毁灭。当这些融合了异国先进技术的新式火炮在阵地上一字排开，高层委员会将向全世界证明：革命的意志将化作饱和式的钢铁暴雨，将一切反动势力彻底埋葬在硝烟弥漫的弹坑之中。"
  NRR_recruit_more: "扩大征募规模"
  NRR_recruit_more_desc: "“革命的浪潮不应只是一道涟漪，而应是席卷旧世界的滔天巨浪。”在高层委员会的眼中，每一个曾被奴役的灵魂都是一颗足以炸裂枷锁的子弹。革命军总部决定撕毁那套温情脉脉的“自愿”面纱，将动员的触角延伸至每一处偏远的村落与每一间拥挤的棚户。我们不需要士兵掌握复杂的弹道学，我们只需要他们握紧长枪，并在冲锋号响起时展现出无畏牺牲的赤诚。\n从曼德勒的集市到边疆的丛林，一批批披着粗布军服的青年正在汇聚。虽然他们中的大多数人甚至还没来得及学会齐步走，但高层委员会坚信：在绝对的人数优势与排山倒海的机动突击面前，敌人的任何防御工事都将显得苍白无力。当千千万万个胸怀理想的躯体汇成洪流，任何试图阻挡历史车轮的反动势力，都将被这股势不可挡的人海彻底淹没。"
  NRR_hugecrowd: "发挥人数优势"
  NRR_hugecrowd_desc: "“我们的敌人计算的是子弹的存量，而我们计算的是觉醒灵魂的数量。”在高层委员会的战术蓝图里，任何精密的防御矩阵在排山倒海的血肉长城面前都将显得微不足道。革命军总部坚信，当成千上万名怀揣着对旧秩序深仇大恨的战士，以连绵不断的波次发起冲锋时，恐惧将比子弹更快地击碎敌人的战线。\n我们不再追求优雅的战术博弈，而是要用最原始、最壮烈的力量去冲垮一切阻碍。每一个倒下的战友后方，都有十个更加坚定的身影踏火而行。这种战术的精髓不在于消耗，而在于那种让任何钢铁防御都感到战栗的绝对意志——当漫山遍野的红旗如潮水般涌向敌方指挥部，旧世界的卫道士们终将明白，在觉醒的民众面前，他们引以为傲的火炮不过是迎接新纪元的礼炮。"
  NRR_ask_instructor: "邀请国外教官"
  NRR_ask_instructor_desc: "“仅有昂贵的钢管是不够的，我们需要的是能让这些钢铁‘开口说话’的人。”尽管先进的火炮已陆续运抵前线，但高层委员会发现，基层战士们仍在使用土法测距，这在现代战争中无异于自杀。革命军总部决定摒弃狭隘的排外心理，从圣杯与幻想乡聘请了一批退役的炮兵老兵。\n这些教官带着满身的硝烟味与严苛的操典，在曼德勒郊外的密林营地里，从最基础的弹道计算、气象修正到复杂的步炮协同逐一传授。他们或许对我们的信仰不屑一顾，但他们手中的计算尺和六分仪却是革命政权最急需的利刃。在高层委员会看来，这些教官不仅是在教导如何校准准星，更是在为年轻的革命军注入一种名为“专业主义”的冷酷灵魂，确保每一枚珍贵的炮弹都能精准地落在旧世界的枷锁之上。"
  NRR_nochoice_buthurry: "加急生产"
  NRR_nochoice_buthurry_desc: "“当敌人的刺刀已经抵住喉咙，我们没有时间去纠结枪栓的打磨是否光滑。”高层委员会下达了冷酷的指令：全面简化生产工艺。在曼德勒及其周边的地下工厂里，复杂的木质枪托被粗糙的冲压钢件取代，精密的火炮瞄准具被简易的标尺标尺替代。我们要的是数量，是足以覆盖地平线的钢铁洪流，而不是陈列在博物馆里的工艺品。\n革命军总部深知，在消耗战的绞肉机里，十支射击精度稍差的粗糙步枪，永远比一支完美的艺术品更具威慑力。兵工厂的炉火彻夜不熄，每一秒钟都有新的枪管滑下流水线。哪怕这些武器的寿命缩短了一半，哪怕它们的炸膛率有所上升，只要能让每一个走上战场的平民都能扣动扳机，高层委员会就认为这一切牺牲都是值得的。革命的胜利，将由这些廉价却致命的废铁堆砌而成。"
  NRR_transfer_officer: "下放夜袭组织军官"
  NRR_transfer_officer_desc: "“一支军队的灵魂不在于将领的披风，而在于战壕里那根挺直的脊梁。”为了将那股让敌人胆寒的韧性注入每一支常规部队，高层委员会下令，将“夜袭团”中那些历经百战的精锐军官与士官拆解，下放到各个新编的基层连队。这些满身伤痕的战士不再是孤傲的尖刀，而是化作一颗颗钉子，狠狠地钉在革命军最基础的组织架构中。\n从曼德勒的临时营房到前沿的散兵坑，这些夜袭团成员带去了最严苛的纪律与最实用的渗透技巧。他们教导新兵如何在火网下保持冷静，如何在黎明前发起致命的冲锋。革命军总部深知，虽然此举削弱了特种力量的集中性，但却换来了整支军队在组织度上的质变——现在的革命军不再是乌合之众，而是一个由百战老兵为骨干、意志如钢铁般统一的战争机器。"
  NRR_airplane: "研究飞机设计构架"
  NRR_airplane_desc: "“如果我们不能夺取天空，那么大地上的每一场胜利都将是暂时的。”高层委员会已经意识到，未来的战场不再仅仅是二维的泥沼，而是三维的立体绞杀。革命军总部设立了专门的航空研究局，尽管我们缺乏大型风洞和高级合金，但从圣杯流出的双翼机残骸和幻想乡的航空期刊，成为了我们工程师案头最珍贵的教科书。\n我们正在从最基础的机翼升力理论和机身结构力学抓起。这不是在制造昂贵的玩偶，而是在设计能够跨越崇山峻岭、将火种投向敌方后勤线的利箭。高层委员会坚信，通过对桁架结构与气动布局的深入钻研，我们终将能够制造出属于革命者自己的战鹰。当第一架涂着红色徽记的战机掠过曼德勒的上空，那标志着旧世界的防空网已不再稳固，而我们的理想将插上钢铁的翅膀。"
  NRR_strengthen_will: "强化战意"
  NRR_strengthen_will_desc: "“当旧帝国的阴影遮蔽了地平线，当那群被称为‘狩人军团’的刽子手擦亮了他们沾血的铁蹄，每一个革命者都必须在屈辱的生存与尊严的毁灭之间做出抉择。”高层委员会向全军发出了最后的政治动员。我们必须承认，敌人的旗帜多如繁星，他们的钢铁巨兽发出的轰鸣声足以震碎软弱者的胆魄。\n但革命军总部要告诉每一位战士：敌人的强大仅仅在于他们那冰冷的数量，而我们的力量源于不可熄灭的赤诚。纵使“狩人”们拥有最精良的武装与严酷的训练，他们也终究只是旧秩序垂死挣扎的猎犬。我们要让每一个守卫在战壕里的公民都明白，我们已无路可退——在这一场众寡悬殊的较量中，唯有抱定必死的决意，才能在旧帝国的尸骸上筑起自由的长城。"
  NRR_rifle_design: "专注步枪设计"
  NRR_rifle_design_desc: "“在排山倒海的冲锋中，每一名战士手中握着的，必须是能够信赖的真理。”高层委员会意识到，虽然我们追求数量，但绝不能让我们的战士拿着烧火棍去对抗旧帝国的精锐。革命军总部召集了曼德勒最顶尖的机械匠人，并参考了圣杯与幻想乡的经典步枪构型，致力于研发一种属于革命政权的“制式脊梁”。\n我们的目标不是追求复杂的工艺，而是极致的可靠性与易产性。这种新式步枪必须能在伊洛瓦底江的泥浆中照常击发，能在高强度的近距离肉搏中经受住枪托的撞击。高层委员会坚信，当每一支走下生产线的步枪都拥有精准的膛线与顺滑的拉机柄，哪怕面对的是不可一世的“狩人军团”，我们的战士也能在黑暗中冷静地扣动扳机，将革命的子弹送入旧帝国卫道士的心脏。"
  NRR_rebirth_army: "新生的革命军"
  NRR_rebirth_army_desc: "“曾经，我们只是一群渴望自由的乌合之众，而现在，我们是共和国最坚实的盾牌。”高层委员会站在曼德勒那古老的城砖上，俯瞰着整齐划一的灰绿色方阵。这些士兵的面孔上已褪去了初期的迷茫与狂热，取而代之的是一种独属于职业公民兵的沉稳。他们不为某种深奥的阶级理论而战，而是为了那面象征着民族独立、共和尊严与法制自由的旗帜。\n面对地平线上渐近的“狩人军团”，新生的革命军已经擦亮了刺刀。他们不再依赖盲目的冲锋，而是依靠战壕里的冷静对射与连队间的紧密配合。这是一支属于公民的军队，当他们齐声高呼共和时，整个旧帝国的腐朽根基都将在这种理性的意志面前颤抖。"
  NRR_strengthen_base: "加强根据地建设"
  NRR_strengthen_base_desc: "“共和的生命力不仅体现在前线的捷报，更扎根于后方轰鸣的工坊与翻垦的土地。”面对百废待兴的残局，高层委员会深知，若无稳固的后勤，新生政权不过是沙滩上的堡垒。我们必须在曼德勒的废墟上重建秩序，将旧帝国留下的破碎作坊整合为统一的军工体系，借助外部图纸让简陋的机床昼夜不停地吐出反抗的火种。\n与此同时，行政官员们深入民间，通过确立共和框架下的经济契约稳定人心，将涣散的民力转化为支撑战争的物资洪流。虽然根据地仍立足未稳，但随着第一批国产弹药下线，共和国已从单纯的军事组织转变为生机勃勃的政治实体。这种源自土地与工业的动力，将为我们对抗“狩人军团”提供最坚实的底气。"
  NRR_send_workingteam: "派遣地方工作小组"
  NRR_send_workingteam_desc: "“共和的旗帜不能只飘扬在曼德勒的城头，它必须插进每一寸泥土，扎进每一个公民的心里。”为了将根据地真正连成一片，高层委员会向偏远乡村与城镇派出了大批“地方工作小组”。这些小组由热忱的共和主义文官与负伤退役的夜袭团老兵组成，他们背着干粮与法典，徒步走进那些仍对旧帝国心存余悸的村落。\n工作小组的任务不仅是动员，更是重建。他们清算地方恶霸，重新分配灌溉水源，并建立起最基层的“共和议事会”，让民众第一次感受到自己是土地的主人而非帝国的家畜。通过这种深度的基层渗透，分散的村庄被紧紧维系在革命政府的行政网络中，源源不断的兵员与补给开始沿着乡间小径汇聚。这股从底层涌现的力量，正在将那些立足未稳的据点，转化为旧帝国与狩人军团永远无法攻克的共和汪洋。"
  NRR_ask_help: "寻求外交帮助"
  NRR_ask_help_desc: "“在旧帝国的铁幕之下，共和国绝不能成为一座孤岛。”高层委员会清醒地认识到，单凭曼德勒一隅的产出，难以在长期的消耗战中击败底蕴深厚的旧秩序。为此，多支秘密外交使团跨越国境，正式向圣杯、幻想乡、中国革命党甚至苏联寻求支持。我们不奢求这些立场迥异的力量能直接出兵，但我们需要他们成为这场共和革命背后的坚实支点。\n通过巧妙的博弈，根据地开始接收到来自四面八方的“特殊赠礼”：圣杯的精密零件、幻想乡的尖端构思，以及来自国民党与苏联的宝贵革命组织经验和军事援助。这些跨越意识形态的物资与技术，正绕过旧帝国的封锁线，源源不断地汇入我们的军械库。外交破局不仅为我们换回了战争红利，更在国际上构建了一个脆弱却致命的对帝国包围网，让“狩人军团”的屠刀在落下前不得不顾虑重重。"
  NRR_landreform: "助力土地改革"
  NRR_landreform_desc: "“若要战士在前线视死如归，必先让他们在后方脚踏实地。”高层委员会深知，旧帝国的统治根基在于那些依附于皇权的豪强地主，而共和国的根基必须深植于肥沃的黑土地。通过颁布《共和土地令》，我们正式废除了封建劳役与不合理的租佃契约，将土地的所有权与耕作权归还给那些世代流汗的农夫。\n这场改革不仅仅是财富的再分配，更是一场深刻的政治觉醒。当农民们亲手烧掉旧帝国的欠条，换上共和国盖章的土地证时，他们与新政权便成了血肉相连的命运共同体。每一块新分的田地都成了旧帝国的墓碑，而每一个获得土地的壮丁，都成了保护这份家园最坚定的预备役。这种来自土地的原始伟力，正转化为取之不竭的粮草与兵员，支撑着革命军去对抗那看似不可战胜的“狩人军团”。"
  NRR_strating_heavy_industry: "初步重工业建设"
  NRR_strating_heavy_industry_desc: "“共和的脊梁不能由木材和熟铁铸就，它必须是高炉中流淌出的沸腾钢水。”高层委员会意识到，小规模的作坊式生产已达到极限，若要在持久战中压倒旧帝国，我们必须拥有自己的重型工业心脏。在根据地的矿脉区，第一批结合了多方外援技术与本土改良设计的近代化高炉正拔地而起。\n这不再是敲敲打打的修理厂，而是涵盖了采矿、冶炼与大型构件铸造的工业雏形。粗糙的生铁在这里被炼成坚韧的钢材，不仅为步枪提供了更优质的枪管，更为后续研发大口径火炮与动力机械奠定了物质基础。虽然烟囱喷出的黑烟遮蔽了云霞，但在革命者眼中，那是共和国最耀眼的霓虹。这股不断扩张的金属洪流，将彻底终结“狩人军团”在火力上的垄断地位。"
  NRR_ask_ENG_FRA: "拜访西欧民主国家"
  NRR_ask_ENG_FRA_desc: "“真理需要大炮来维护，而外交则是大炮轰鸣前的引信。”为了打破旧帝国在国际孤立上的绞索，高层委员会派遣了由资深共和主义者组成的特使团，正式出访圣杯与幻想乡。这些国家作为西方民主秩序的旗帜，虽然对直接卷入冲突保持谨慎，但其民间舆论与自由派政要对这场推翻暴政的革命抱有天然的同情。在华丽的国事厅与密布的沙龙间，我们的使节不仅带去了友谊，更带去了合作的诚意。通过阐述共和国对自由贸易的尊重与法治的追求，我们迫切希望赢得这两个强国的默许与初步承认。虽然这种支持目前更多体现在口头的政府承认和实质的军火援助上，但它标志着共和国已正式跻身国际政治的棋盘。当圣杯与幻想乡的旗帜在曼德勒的外交公署升起，狩人军团将发现，他们面对的不再是一群叛乱者，而是一个拥有强大盟友支持的起义者。"
  NRR_prepare_airport: "修建机场"
  NRR_prepare_airport_desc: "“天空不再是旧帝国巨舰的禁区，它将成为共和国反击的跳板。”高层委员会意识到，面对狩人军团的高机动打击，仅靠地面防线已捉襟见肘。为了争夺那决定胜负的几百公尺高度，革命军总部下令在靠近前线的隐蔽平原处，强行开辟出一系列简易机场。\n这些机场并非宏伟的混凝土建筑，而是由砂砾与夯土铺就的长条跑道，掩映在伪装网与密林之下。通过此前拜访西欧民主国家带回的技术图纸，以及从民间征集的机械师，我们正试图在这里组装、维护那些虽然原始却致命的飞行器。哪怕目前这支空中力量尚处于萌芽阶段，前线机场的竣工也标志着革命军拥有了侦察敌情与定点突袭的能力。当发动机的轰鸣声打破黎明的寂静，旧帝国的将领们将不得不重新审视，这片他们自以为掌控的蓝天。"
  NRR_explore_resources: "开采资源"
  NRR_explore_resources_desc: "“没有钢铁，共和的意志便无从承载；没有橡胶，革命的齿轮将寸步难行。”高层委员会下达了资源总动员令，将触角伸向根据地深处的每一条矿脉与林场。为了支撑日益庞大的军工消耗，我们必须从大地的深处挖掘出反抗的本钱。\n在铁矿产区，成千上万的工人在新运达的钻探设备映衬下，正将整车整色的原矿送入高炉，转化为铸造枪炮的骨骼。而在丛林深处的橡胶园里，我们建立了严密的采集与初加工体系，确保那些能够密封气缸、加固轮毂的宝贵胶液能源源不断地送往工厂。虽然旧帝国的封锁切断了外部贸易，但通过这种对本土资源的掠夺式开发，革命军总部正在将根据地的原始积累推向巅峰。这些沉重的矿石与粘稠的乳胶，将最终化为狩人军团无法逾越的钢铁洪流。"
  NRR_relation_with_chi: "建立东亚联系"
  NRR_relation_with_chi_desc: "“革命的火种绝非孤立的星火，而是横跨亚洲大陆的燎原之势。”高层委员会深刻意识到，缅甸地区的抗争与北方的觉醒同频共振。为了打破地缘上的孤立，我们派遣代表团秘密北上，正式与中国国民党建立了形式上的战略合作。\n在密谈中，双方达成了“亚洲共和、守望相助”的共识。这些正致力于推翻腐朽封建王朝的同胞，为我们带来了宝贵的起义经验与城市暴动策应。通过滇缅边境纵横交错的秘密马帮，我们不仅获得了人员往来的掩护，更在这一跨国革命网络中共享情报，对抗旧帝国的特务渗透。这种基于“天下为公”理念的政治联结，让我们的斗争超越了地域限制，使曼德勒的共和之声与东亚的革命浪潮合而为一，共同构筑起反抗专制的东方阵线。"
  NRR_concentrate_scimanpower: "集中科研力量"
  NRR_concentrate_scimanpower_desc: "“在生死存亡的关头，天才的自由必须向生存的必然低头。”高层委员会清醒地意识到，涣散的学术讨论无法阻挡旧帝国的铁蹄。为了在短时间内弥补技术鸿沟，革命政府动用行政强制力，将分散在各地的机械匠人、归国学者以及圣杯与幻想乡的留学生统一征调，强行编入半军事化的“中央科研院”。\n我们不再允许昂贵的人才资源虚耗在民用或纯理论研究上。这些头脑被限制在铁丝网与岗哨守卫的研究所内，必须在高压下优先攻克冶金强化、弹道校准与引擎效能等急需课题。虽然这种近乎残酷的集中制扼杀了学术的闲适，但它却让有限的智慧像凸透镜下的阳光一样，聚焦成足以熔断帝国装甲的毁灭之光。这是对知识分子的战时动员，也是将智慧转化为战斗力最冷酷、最高效的手段。"
  NRR_new_city: "新城市"
  NRR_new_city_desc: "“曼德勒与仰光正焕发出令旧帝国胆寒的生机，它们不再是封建君王的行宫，而是未来共和国跳动的心脏。”随着根据地建设与工业动员的深入，这两座城市在硝烟中完成了惊人的蜕变。原本狭窄混乱的旧街道被规划整齐的共和大道取代，电线与水管如脉络般铺设开来，象征着近代化秩序的初步降临。"
  NRR_maybe_sov: "也许还能拜访苏联..."
  NRR_maybe_sov_desc: "“在生存的天平上，地缘利益往往重于意识形态的洁癖。”尽管革命政府的核心理念更倾向于西欧式的民主架构，但高层委员会清醒地意识到，来自北方的红色巨熊拥有最丰富的武装起义经验与重工业基础。于是，一支作风低调的代表团穿越中亚的荒原，抵达了红色的心脏，寻求这个意志如铁的政权的援助。\n正如预期，这场接触从一开始就充满了审视与权衡。苏联方面并不掩饰其通过援助在革命军内部培植亲社会主义力量、甚至最终将其引向不同路径的野图。然而，为了换取宝贵的莫辛-纳甘步枪图纸、爆破战术专家以及对帝国侧翼的政治牵制，我们必须选择尝试。尽管双方在议会制度与所有权问题上各怀鬼胎，但此刻，对付共同的宿敌——旧帝国与狩人军团的现实需求，压倒了真理的辩论，我们有望让大批带有红色标记的军援物资开始秘密启程。"
  NRR_Preliminary_reconstruction_conpleted: "重建初步完成"
  NRR_Preliminary_reconstruction_conpleted_desc: "“从焦土中崛起，在铁火中重塑。”随着最后一座近代化高炉喷吐出红热的铁水，以及第一批受过共和法律熏陶的公民走上岗位，根据地的初步重建宣告圆满完成。原本由于战乱而停滞的社会脉搏，在行政与工业的双重律动下，迸发出了前所未有的强韧生命力。曼德勒与仰光不再是旧帝国治下的沉闷属地，而是成为了两座灯火通明、昼夜不息的革命引擎。\n通过整合各方势力的援助，我们将支离破碎的资源与人才强制汇聚，建立起一套虽显冷酷却极度高效的战时体系。土地改革赢得了民心，重工业奠定了骨骼，外交上的合纵连横则为我们撑起了战略保护伞。尽管革命军尚未彻底推翻旧帝国的统治，但如今的我们已经拥有了成体系的军工产能与稳固的后方行政网络。共和国的雏形已在东南亚的雨林与城市间岿然屹立，我们不再是流亡的叛乱者，而是即将发起总攻的挑战者。"
  NRR_New_republic: "新生的革命共和国"
  NRR_New_republic_desc: "为新生的共和国，高呼万岁！万岁！万岁！" 

  #二阶段 命运十字路
  NRR_fate_crossroad: "命运十字路"
  NRR_the_consititution: "共和国宪法"
  NRR_the_consititution_desc: "战争结束了，各地的代表会聚旧帝国的古都，新共和国的心脏——德里——来见证一个新政权的诞生。他们或是兴奋、激动；或是各怀鬼胎、阴谋诡计。数百名代表坐落一厅，制宪会议即将开始......"
  NRR_old_man: "老功勋、老对手"
  NRR_old_man_desc: "现在，许多陪我们一路走来的老人，或者半途加入的人，亦或者刚刚投身其中的新人，都在等待着留给他们各自的位置......"
  NRR_we_need_to_choose: "做出抉择..."
  NRR_we_need_to_choose_desc: "以原革命军为基底的§C民主共和党§!在千难万险中毅然成立，但阴影中的反对者们也正在集结...民主共和党是否该坚定独行？或者另寻盟友？某些问题的答案在很久之前便已经注定。"
  NRR_the_fate_come: "命运裁决之时..."
  NRR_the_fate_come_desc: "§R许多事情该做个了结了§!......"
  NRR_anti_corruption: "反对贪腐..."
  NRR_anti_corruption_desc: "“我们承诺，将根除旧帝国荼毒千年的积弊：贪腐、内斗、落后、陈旧......”"
  NRR_lock_them_down: "打击犯罪..."
  NRR_lock_them_down_desc: "“...我们的初心，就是破除危害革命的一切，扫除一切企图篡夺胜利果实的窃贼，为着我们崭新的共和国..."
  NRR_of_the_people: "民治，民有..."
  NRR_of_the_people_desc: "“...最终，我们将秉持民主的理念与精神，以革命的决心，为恒河打造一个民治、民有、民享的民主共和国而努力！”"
  NRR_new_problem_comes: "困境浮现"
  NRR_new_problem_comes_desc: "民主共和党的核心成员从在野党的身份一跃而成为执政党，这一身份的转变使得某些对于革命事业抱有过多§R热情§!的人感到不适，他们也正企图在权力的角斗场寻找自己的位置..."
  NRR_replace_or_respect: "遵从？还是取代？"
  NRR_replace_or_respect_desc: "富有革新精神的§R社会党§!在我们现在最不愿意提及的传统和文化领域做起了文章，总统阁下，请您决断...！"
  NRR_cold_market: "市场震荡"
  NRR_cold_market_desc: "建国后百废待兴，我们必须想办法提出一项促进经济复苏的法案来赢得人心，我们预估这一步应当会进展顺利..."
  NRR_our_new_man: "政府新星"
  NRR_our_new_man_desc: "年轻人投入了新的战场..."
  NRR_little_train: "小小的交通"
  NRR_little_train_desc: "...这本应是一个良好的开端..."
  NRR_great_hope_down: "巨大的绝望"
  NRR_great_hope_down_desc: "...但也许形势发生了变化" 
  
  #娜洁希坦结局
  NRR_democracy_republic_survived: "民主得胜"
  NRR_preliminary_victory: "初步胜利"
  NRR_preliminary_victory_desc: "国民对我们的执政功绩颇为满意，总统阁下，恭喜您，我们的第一步成功了！"
  NRR_huge_economic_potential: "巨大的经济潜能"
  NRR_huge_economic_potential_desc: "此前的投资法案已经取得了一定的成效，各地传来的最新季度报表令人欣喜，短期收益很快就能体现在国家财政上。"
  NRR_adhere_to_neutrality: "坚守中立"
  NRR_adhere_to_neutrality_desc: "世界战云密布，各大列强摩拳擦掌，一场席卷世界的战争正在成为现实，独特的地缘位置使得我们得以在这浩劫之中找到保全羽翼的稳健策略，断绝一切使恒河陷入另一场灾难的可能。"
  NRR_uphold_the_constitution: "捍卫宪法"
  NRR_uphold_the_constitution_desc: "如果我们不能从自身做起，我们又该如何捍卫由国民的意志所编订的法律？也巧，现在就有一个值得公诸天下的判决书即将发布..."
  NRR_agricultural_recovery: "农业复苏"
  NRR_agricultural_recovery_desc: "我们此前在财政方面作出的微调为我们在全国范围开展农业农村改良开了个好头，各地的农村面貌得到了应有的改革成效，我们应当为此庆祝。"
  NRR_develops_diplomacy: "建立民主外交"
  NRR_develops_diplomacy_desc: "中立的姿态不代表消极避世，我们应当充分表明恒河共和国在变幻莫测的新时代下将有一幅全新的面貌，一个中立而稳定的平台，一个包容且开放的东道主。"
  NRR_one_country_one_army: "一国一军"
  NRR_one_country_one_army_desc: "在革命时期，革命军的体系因其灵活性而受益匪浅，但是时至今日，这样的组织架构会导致各种非程序化和无组织事件发生，除了潜在的巨大腐败空间外，更要紧的便是无法形成一个单纯且单一的指挥层。我们即将改变这一点。"
  NRR_have_a_glass: "喝一杯，睡一觉"
  NRR_have_a_glass_desc: "在做完了目前能做的一切后，娜洁希坦偷偷决定在自己的办公室开个小差，在上班的时间偷偷喝完一整瓶威士忌，并在烟酒的抚慰过后好好的补上一觉..."

  #塔兹米革命
  NRR_TZM_revolution: "第二次革命"
  NRR_neworder: "新的命令"
  NRR_neworder_desc: "新的命令已经下达，但不是来自前政府......而是来自国家重建委员会。"
  NRR_rebuild_declearation: "重建纲领"
  NRR_rebuild_declearation_desc: "重建委员会正在向全国发出他们的声音，他们要更改所有的错误，拯救这个国家"
  NRR_dismiss_senate: "解散参议院"
  NRR_dismiss_senate_desc: "腐败分子的老巢，罪犯的保护伞和庇护所，现在，它该被扔进垃圾桶了！"
  NRR_wait_calls: "等待来电"
  NRR_wait_calls_desc: "前事已毕，现在，塔兹米需要等待回应，为了他的事业，也为了他自己......"
  NRR_theheart: "友人"
  NRR_theheart_desc: "首先，是他最亲密的朋友..."
  NRR_thewarrior: "军人"
  NRR_thewarrior_desc: "...然后，是他最坚定的战友..."
  NRR_thecareerist: "野心之人"
  NRR_thecareerist_desc: "最后，是他最忌惮的恶魔..."
  NRR_thecurtain_rises: "拉开帷幕"
  NRR_thecurtain_rises_desc: "现在，属于他一人的戏剧开幕了......"
  NRR_thecivil_servant_system: "官僚"
  NRR_thecivil_servant_system_desc: "官僚系统的失败是前政府失败并导致各层级机构低效失能的重要原因。国家重建委员会也承诺将此作为重要的改革对象，但如何改革这具庞大的机器，重建委员会的内部正在召开会议..."
  NRR_the_education: "教育"
  NRR_the_education_desc: "塔兹米和玛茵等人正在参加一场与教育部官员举行的教育发展报告会议，根据这份报告，重建委员会将决定接下来的教育改革方针..."
  NRR_the_parties: "党派"
  NRR_the_parties_desc: "党派问题一直是导致恒河政治混乱的病根，塔兹米正准备对其进行大刀阔斧的改革，此时，拉伯克受邀参加了和塔兹米关于党派的小型会议..."
  NRR_the_economy: "经济"
  NRR_the_economy_desc: "如果不能解决恒河的经济发展问题，重建委员会的努力就无法直观地体现在数据上，但混乱的经济体系也让重建委员会感到头疼，因而寻求财政部和统计署的专业报告..."
  NRR_the_people: "民生"
  NRR_the_people_desc: "饥饿、贫困和灾荒仍然在这片土地肆虐，城市与乡村，永远的资源困境，加法与减法，重建委员会需要做出决定..."
  NRR_scalpel: "手术刀式修剪"
  NRR_scalpel_desc: "确实，官僚体系并不需要一场政治风暴，重建委员会拟定了几个重点部门作为腐败的打击对象，并希望以此做到杀一儆百的效果，是改革遏止顽劣风气的开始"
  NRR_broadsword: "大刀阔斧"
  NRR_broadsword_desc: "确实，整个官僚体系是一座复杂庞大的迷宫，所有企图改变它的人都最终陷入这迷宫无从逃生，但这正是我们重塑它的必要性。"
  NRR_Republican_morality: "共和之美德"
  NRR_Republican_morality_desc: "共和的精神，就是共存、和平与坚毅，它是伟大的博爱，是所有自由之人应当向往并追随的伟大精神，我们的孩子应当是这一伟大理念的追随者。"
  NRR_Revolutionary_morality: "革命之美德"
  NRR_Revolutionary_morality_desc: "共和建立在无畏的革命精神之上，是勇气、热情与团结，它是至上的意志，是所有保卫革命之人应当牢记的伟大精神，我们的孩子应当是这一无畏精神的接班人。"
  NRR_Partisan_politics: "党同伐异"
  NRR_Partisan_politics_desc: "重建委员会不能独自于政治中前行，我们有着可以信任或者值得拉拢的盟友，就让我们用他们最熟悉的那一套对付他们......"
  NRR_The_Banality_of_Evil: "平庸之恶"
  NRR_The_Banality_of_Evil_desc: "不论是哪个党派，它们对前政府的最终失败都负有不可推卸的责任！一旦我们对其中一个睁一只眼闭一只眼，那么一切的努力就会付诸东流！"
  NRR_Local_autonomous_economy: "地方自治经济"
  NRR_Local_autonomous_economy_desc: "财政部的结论是清晰准确的，面对如此庞大的一个国家，我们应当给予地区更多的自主规划权，确保每个地区都能因地制宜地发展。"
  NRR_Centralized_economy: "中央统制经济"
  NRR_Centralized_economy_desc: "财政部的结论方便了他们自己，降低了他们的工作量......现在的恒河需要更加集中，更加直接的经济部署，确保全国都能在统一规划下推进经济发展。"
  NRR_As_steady_as_usual: "一如往日"
  NRR_As_steady_as_usual_desc: "我们向所有的人民保证，一切不会改变！没有的会有，而已经有的只会更好！"
  NRR_Temporary_patience: "必要的忍耐"
  NRR_Temporary_patience_desc: "城市的粮食供给已经冗余，我们将采取强制措施，迫使那些粮食商人离开销售配额已满的城市，转头去那些急需粮食的乡镇集散地..."
  NRR_National_Supervision_Law: "国家监察法"
  NRR_National_Supervision_Law_desc: "各部门对贪腐程度、检查力度和惩处力度的不一，造成了各部门之间或低效、或上下其手。一套成熟的法律将把这一切统一起来，让那群"
  NRR_Independent_system: "双独立系统"
  NRR_Independent_system_desc: "重建委员会将下达一份重大的政府内部改组计划，意图将具有执行权和监督权的部门分离开来，让两者之间的共同利益消失，剩下的只有监督、检举和检查。"
  NRR_government_sponsored_teacher: "公派教师"
  NRR_government_sponsored_teacher_desc: "稳妥起见，我们应当从财政中拨出专款，扩大教师队伍的培训规模，尽早形成一整个合格的公立教师体系，支撑我国的教育系统。"
  NRR_commissar_transfers_to_school: "军官转业"
  NRR_commissar_transfers_to_school_desc: "出于军队和教育两个系统的共同诉求，将素质合格、服从政策的文职军官经培训后转业成学校的教师，在重建委员会看来，这是一个可行的方向。"
  NRR_reorganize_DR: "重组民共党"
  NRR_reorganize_DR_desc: "拉伯克的建议是对的，我们不应该如此鲁莽地对我们曾经的同伴痛下杀手。重建委员会决定由拉伯克负责对民主共和党内部的重新整理，借此也可以巩固拉伯克在其党内的地位。"
  NRR_liquidate_DR: "清算民共党"
  NRR_liquidate_DR_desc: "民主共和党的败类不应当高高拿起轻轻放下！我们将命令监察机关对这些吸附在国家皮肉上的败类一扫而空，即使他们有的人曾经对共和革命忠诚过，但现在他们已经是叛徒。"
  NRR_Withdraw_from_light_industry: "从轻工业撤退"
  NRR_Withdraw_from_light_industry_desc: "根据之前的决策，我们将逐步收缩财政资金以应对新政策可能的其它开支，至于轻工业，我们将它们交给市场自主调节，等待我们能再次有余力扶助轻工业时再行规划。"
  NRR_Centralized_development_plan: "统一发展规划"
  NRR_Centralized_development_plan_desc: "只重视某一行业，恒河将如一个瘸腿走路的人一般行走于世界，这是我们绝不能接受的。同时，持续维持对各行业的管控也有助于我们形成一整套统一的产业结构链，但这样的开支将是巨大的。"
  NRR_Social_Insurance_Law: "社会保险法"
  NRR_Social_Insurance_Law_desc: "光有口头承诺还不足为人民所信，我们当持续推进关乎民生的法律，一部关乎全社会的法律将让全国知晓我们的决心。"
  NRR_Food_rationing_system: "食物营养配给制"
  NRR_Food_rationing_system_desc: "重建委员会关于配给制的争论从没停止过，这个短期计划的成效是显著的，但这将对恒河目前的行政动员能力和持续执行能力提出了巨大的考验......"
  NRR_Subsidy_Amendment: "公务津贴"
  NRR_Subsidy_Amendment_desc: "一个巴掌一颗枣，这是分化治理永恒的秘诀，通过在薪资财政上的合理放松，我们有望引导居中观望的大部分官僚支持新规，在我们的新规章下办事。"
  NRR_Ombudsman: "监察专员"
  NRR_Ombudsman_desc: "一个巴掌拍不响！仅仅是设立部门还远远不够，对于重度涉及钱权的部门，我们应当专事专办，按需求设立岗位，为了一个廉洁高效的政府，这样的扩员成本微不足道。"
  NRR_Textbook_Management_Law: "国家教材管理法"
  NRR_Textbook_Management_Law_desc: "重建委员会对于国家学校的所有制性质不予强求，但是我们将通过一套关于各等级、各年级学校的教材内容、指引方向和包含的价值观进行法律层面的宏观管制，确保公私学校都能在我们制定的方案内制定、选购教材。"
  NRR_Statutes_of_public_institutions: "国家院校公有令"
  NRR_Statutes_of_public_institutions_desc: "重建委员会将命令政府在全国范围内推行院校公有化的决议，任何教育性质的机构必须由国家教育部所支持的教育财政委员会绝对或者相对控股，确保所有的学校服从于我们的政府指令。"
  NRR_Political_donation_management_law: "政治献金法"
  NRR_Political_donation_management_law_desc: "既然政党之间的资金募集无法根绝，那我们只好将通过一部关于政治献金的白名单法律，规定少数合法的募集渠道，在打击政党腐败的同时，也为政党格局保留一丝缓和的空间。"
  NRR_Anti_Bribery_Election_Law: "反贿选法"
  NRR_Anti_Bribery_Election_Law_desc: "政党的黑金政治绝对不能被容忍！即使冒着被他们反对的风险，我们也要强行执行这部法律，国民大会无法通过的话，我们就以行政命令的方式推行，必须把这群蠹虫一个一个清除出恒河的政坛！"
  NRR_Medium_Enterprise_Promotion_Act: "中小企业发展促进法"
  NRR_Medium_Enterprise_Promotion_Act_desc: "我们在宏观层面的管控间接让大型企业不断壮大，这可能会危害到各地的中小型企业的发展，重建委员会将出台专门的经济补贴法规，稳定各地的就业和发展情况。"
  NRR_Bureau_of_Commercial_Security: "商业安全局"
  NRR_Bureau_of_Commercial_Security_desc: "与其帮扶中小企业，设立一个专门“服务”于大型企业的，擅长反商业欺诈、反市场操控的商业安全局更为直接，毕竟，在统一透明的管理下，诚信经营的中小企业也会成长壮大，而弄虚作假的大企业也会轰然倒塌。"
  NRR_Autonomous_funding_allocation_system: "地方经费自治制"
  NRR_Autonomous_funding_allocation_system_desc: "与其又我们统筹规划，将这部分资金的调配权下放到地方也许效果会更好，毕竟，强龙怎会比地头蛇更了解哪个地方有洞穴呢？"
  NRR_Bureau_of_Public_Welfare_Planning: "民生福利计划局"
  NRR_Bureau_of_Public_Welfare_Planning_desc: "中央的贪腐尚在清扫，地方只怕有增无减，为了每一分民生资金能用在实处，我们必须用同一套体系，同一套人马，将权力放在这样一批我们能直接控制的机构中，我们才能放心地制定民生福利内容。"
  NRR_Mandalay_Declaration: "曼德勒宣言"
  NRR_Mandalay_Declaration_desc: "一晚，塔兹米苦于起草一份文件......"
  NRR_League_of_the_Just: "第二正义者同盟"
  NRR_League_of_the_Just_desc: "现在，是时候向世界发出我们的声音了！"
  NRR_Proceed_south: "向南进发"
  NRR_Proceed_south_desc: "重建委员会决定立刻开启南亚的再统一大业。我们的第一站似乎非常顺利，但这不代表我们面对的第二个就会那么好摆平了..."
  NRR_return_home_in_glory: "荣归故里"
  NRR_return_home_in_glory_desc: "谈判成功，他们得到了他们想要的，我们得到了我们想要的，皆大欢喜，皆大欢喜。"
  NRR_return_home_in_battle: "夺回故土"
  NRR_return_home_in_battle_desc: "谈判失败......我们的家乡......我们战场上见"
  NRR_Harmony_brings_wealth: "和气生财"
  NRR_Harmony_brings_wealth_desc: "我们当然能在战场上拿回来，但是既然我们双方都愿意坐下来谈谈，那么以和平促统一自然是更好的选择，除非他们并无诚意......"
  NRR_not_to_be_interfered: "不容染指"
  NRR_not_to_be_interfered_desc: "战场上拿不到的，谈判桌上也拿不回来！圣杯人还想对我们的统一事业指手画脚，那么我们就会在他们手忙脚乱之际给予雷霆一击...！"
  NRR_South_Asian_Unification: "宣布南亚统一"
  NRR_South_Asian_Unification_desc: "我们做到了，尽管我们还有可以完善的余地，但我们终究做到了！一个完整的南亚不再是梦想，它成为了指引我们的灯塔，成为了世界瞩目的荣光！"
  NRR_to_the_world: "致世界"
  NRR_to_the_world_desc: "现在，南亚人民团结在一起，向世界发出同一个声音...为自由、为独立、为繁荣的声音。"
  NRR_Discipline_Inspection_Department: "部门开张"
  NRR_Discipline_Inspection_Department_desc: "官僚体系的改革告一段落，我们期待他们能给我们一个好结果，祝他们好运。"
  NRR_School_Opening_Day_Speech: "开学演讲"
  NRR_School_Opening_Day_Speech_desc: "就在我们的教育改革暂时停歇的同时，一所学校即将开学，这给了我们一次向学生演讲的机会..."
  NRR_Multi_party_joint_meeting: "多党联席会议"
  NRR_Multi_party_joint_meeting_desc: "我们在党派整顿的问题上可以暂且休兵歇战，现在，我们将约见各党派的领袖，向他们传达我们的态度..."
  NRR_Quarterly_Financial_Report: "季度财报"
  NRR_Quarterly_Financial_Report_desc: "拉伯克拿着上季度的财报敲开了塔兹米的办公室，希望是好消息......"
  NRR_Famine_Relief_Act: "反饥荒法"
  NRR_Famine_Relief_Act_desc: "最为民生工程的最后，我们以法案的形式，标志着一套成熟民生救灾体系的建立，重建委员会相信，这部法案会毫无疑问地被通过。"
  NRR_Dissolve_the_SNRC: "解散重建委员会"
  NRR_Dissolve_the_SNRC_desc: "重建委员会的使命结束了，至少在委员会看来，国家重新走上了正轨，现在，塔兹米要兑现他的诺言了......"
  NRR_New_election: "新的大选"
  NRR_New_election_desc: "新大选的消息席卷全国，全国的人民和各党派摩拳擦掌，为了新的时代而选择自己的追随者......"
  NRR_Farewell_Speech: "告别演讲"
  NRR_Farewell_Speech_desc: "塔兹米向德里市公安局申请报备了一场在广场的演讲，以一名普通公民的身份......"
  NRR_back_to_normal_life: "回归日常"
  NRR_back_to_normal_life_desc: "现在，完成最后一天的工作，我们的任务就完成了......"
  NRR_dream_comes_ture: "美梦成真"
  NRR_dream_comes_ture_desc: "美好的日子就在眼前，美好的生活就在眼前，是我们的成功，是所有人的胜利！"
  NRR_War_Department: "陆军部"
  NRR_War_Department_desc: "重建计划虽然以内政为主，但我们的军事依然是重点，在赤瞳的主导下，我们的军队改革和现代化也必须提上日程了..."
  NRR_Air_Force_Department: "空军部"
  NRR_Air_Force_Department_desc: "我们的空军也是真正意义上的“白手起家”，这需要我们想尽一切办法，借鉴国外、开拓本国产业，双管齐下，但空军目前尚不能成为一个完全的独立军种，它必须在两端做出选择..."
  NRR_Admiralty: "海军部"
  NRR_Admiralty_desc: "我们的海军只能算得上是一些近岸舰艇和运输船的集合。要想捍卫一个具有如此漫长的海岸线的共和国，我们的海军必须向前。"
  NRR_new_night_raid: "新夜袭团"
  NRR_new_night_raid_desc: "尽管老夜袭团随着共和国的建立而解散，但是训练方法和各种体系仍然存在，在赤瞳的指挥下，一个更加庞大、系统化的新情报组织将为我们国家的安全服务，而不再从事于刺杀行动。"
  NRR_Army_air_force_integration: "陆空结合优先"
  NRR_Army_air_force_integration_desc: "重建委员会认为应当进一步发挥我们在陆战方面的优势，这将是最快提升我军直接战斗力的方法，也决定了我军空军的发展方向。"
  NRR_navy_air_force_Integration: "海空结合优先"
  NRR_navy_air_force_Integration_desc: "从长远考虑，一片安全的海洋和强劲的制海权争夺力将是我国军力的重要保障，为了今后可能的远洋投送作战，我们决定更改空军的发展重点。"
  NRR_The_Sea_Power_Theory: "海权论"
  NRR_The_Sea_Power_Theory_desc: "我们的海军军官缺乏系统的理论学习，我们只能从头开始，建设我们的海军基础，和军官素质。"
  NRR_Weapon_Modernization: "制式装备现代化"
  NRR_Weapon_Modernization_desc: "欲先攻其事、必先利其器。在革命战争时期，我们的装备落后是迫不得已，现在，我们要尽全力弥补这一点。"
  NRR_Devolution_of_support_powers: "空军支援权下放"
  NRR_Devolution_of_support_powers_desc: "以往，决定空军支援的权利在团部的手里，这大大降低了空军支援的时效性，现在，我们尝试将这一权利下放到营，甚至是连。"
  NRR_improve_CAS: "改进近地支援机"
  NRR_improve_CAS_desc: "作为陆军战斗中最青睐的机型，空军部门决定以此为首要研究方向。"
  NRR_company_core: "以连队为核心"
  NRR_company_core_desc: "革命军能够取得战争胜利的原因，就在于各部队的灵活作战和独立协调能力。现在，我们将以这一经验为核心，打造一套“全能连队”理念下的连队配置，这花费巨大，但绝对值得。"
  NRR_Improve_air_defense_weapons: "改进防空武器"
  NRR_Improve_air_defense_weapons_desc: "磨好了矛，我们也要锻造我们自己的盾，这样也能为我们自己的军队提供更好的保护。"
  NRR_Systematic_dive_bombing: "系统训练俯冲投弹"
  NRR_Systematic_dive_bombing_desc: "相比于老式的轰炸技巧，俯冲投弹更加危险，但也更加高效精准，这将是我军飞行员的训练重点项目。"
  NRR_National_Aviation_Military_Academy: "国立航空学院"
  NRR_National_Aviation_Military_Academy_desc: "一名飞行员的价值胜过一架新战机，这是全世界的共识，国家将为此拨款建立一所综合空军学校，从飞行员到指挥军官，为一个强大的空军而服务。"
  NRR_improve_Naval_bomber: "改进海军轰炸机"
  NRR_improve_Naval_bomber_desc: "在海战当中，一群空中战士的身影足以让所有人胆寒...尤其是他们携带着击沉战舰的炸弹时。"
  NRR_Drawing_on_foreign_airframes: "借鉴先进机体"
  NRR_Drawing_on_foreign_airframes_desc: "承认研究进度的落后不是难事，这也给了我们交流借鉴的动力，不论是正式，或者非正式......"
  NRR_Improved_shipborne_radar: "改进舰载雷达"
  NRR_Improved_shipborne_radar_desc: "我们的军队还在使用着旧式的雷达，这远不能支撑现在的战争需要，尤其是海军，这给了我们研发雷达技术的理由。"
  NRR_unorthodox_approach: "剑走偏锋"
  NRR_unorthodox_approach_desc: "比起传统的战列舰技术和庞大的投产作业量，我国更加青睐于战争理论的革新以及新式战争下的海军配置，毕竟，我们无法在短期拉近与主要大国之间的海军底蕴差距。"
  NRR_Sea_Eagle: "海上雄鹰"
  NRR_Sea_Eagle_desc: "无畏的飞行员、成熟的海上空军作业体系、陆基搭配...我们还需要什么呢，一群海上雄鹰守护着我们的海洋。"
  NRR_Focus_on_submarine: "集中研制潜艇"
  NRR_Focus_on_submarine_desc: "一艘无畏舰可能需要数年才能造好，但是一发鱼雷就可以使其殉爆，这也是我们为什么选择此道的原因，何等划算的决策。"
  NRR_From_green_to_blue: "从绿水到蓝海"
  NRR_From_green_to_blue_desc: "百年海军之路我们才刚刚开始，但总有一天，我们的舰队可以傲然航行于海洋之上，成为我国的海上堡垒。"
  NRR_our_Army_world_army: "我国之军,世界之军"
  NRR_our_Army_world_army_desc: "恒河的军队不仅仅是一支职业军队，在重建委员会的塑造下，它将为一切受压迫、受殖民的国家和民族而战，这一任务随着国内战争的告一段落，它得以再一次被提出，并被执行。"
  NRR_Courtesy_before_force: "先礼后兵"
  NRR_Courtesy_before_force_desc: "一个民族的觉醒，必须先是本民族内部的觉醒，鸡蛋从外面打破是蛋液，而从内部打破则是生命。"
  NRR_preemptive_strike: "先发制人"
  NRR_preemptive_strike_desc: "我们再也不能坐视其他地方的人民饱受苦难，难道还得先让那里的剥削者做好准备，增添更多伤亡吗？我们必须抢占先手！"
  NRR_Conquer_the_West: "西部攻略"
  NRR_Conquer_the_West_desc: "我国西边的国家饱受封建制度和分裂战乱残害，我们将彻底结束这一切..."
  NRR_Conquer_the_North: "北部攻略"
  NRR_Conquer_the_North_desc: "西北方的草原被各方势力干涉，无穷无尽的分裂撕扯着这片土地，作为离这里最近的国家，我们有责任结束这一切。"
  NRR_Conquer_the_East: "东部攻略"
  NRR_Conquer_the_East_desc: "东南亚的丛林遍布着革命党、反动军阀、买办政府和殖民者，如今，我们也要在这里展现我们的立场。"
  NRR_from_river_to_the_sea: "从河流到海边"
  NRR_from_river_to_the_sea_desc: "凭借我们的努力，我们有望打通到地中海的通路，从而与欧洲、非洲的革命势力联系在一起，为抵御世界共同的威胁而战。"
  NRR_Dances_with_Bears: "与熊共舞"
  NRR_Dances_with_Bears_desc: "北方的巨熊是一个巨大的麻烦，它有可能是我们的盟友，也可能是我们的劲敌，凭借运气和实力，我们也必须面对这一庞然大物......"
  NRR_Red_Island_Chain: "红色岛链"
  NRR_Red_Island_Chain_desc: "东南亚的革命不应当止步于此，如果我们可以锻造一条革命者的锁链同盟，整个世界的经济命脉将握在独立人民的手里。"

 #加尔各答危机
  NRR_kolkata_crisis: "加尔各答危机"
  NRR_total_crisis: "完全的灾难"
  NRR_total_crisis_desc: "......不......为什么，为什么在这个时候......为什么！"
  NRR_tough_decision: "艰难决定"
  NRR_tough_decision_desc: "会议的结论令人沮丧......"
  NRR_worst_plan: "最坏的方案"
  NRR_worst_plan_desc: "难道这就是最后的安排了吗......"
  NRR_loading_shells: "...装填炮弹"
  NRR_loading_shells_desc: "下达命令吧，我们已经别无选择..."
  NRR_the_endgame: "终局之战"
  NRR_the_endgame_desc: "除了一个人之外，没人想要这场战争..."
  NRR_wait_a_second: "等一等！"
  NRR_wait_a_second_desc: "......他会带来什么消息呢？"
  NRR_the_enemy_of_my_enemy: "同敌之友"
  NRR_the_enemy_of_my_enemy_desc: "我们的耕耘没有白费！成功的努力让敌人阵营的得力干将倒向了我们！"
  NRR_pyrrhic_victory: "名为胜利的失败"
  NRR_pyrrhic_victory_desc: "这也能叫胜利吗.....如果这也能称之为胜利的话..."
  NRR_quick_and_clean: "干净利落"
  NRR_quick_and_clean_desc: "快速、迅速，这就是真正的凯旋。"
  NRR_loyalty_and_friendship: "忠诚与友谊"
  NRR_loyalty_and_friendship_desc: "曾经我们是敌人，但现在，我的朋友，我们的友谊永不褪色..."
  NRR_back_to_home: "欢迎回家"
  NRR_back_to_home_desc: "她在等着他回家，他承诺过会很快回来。"
  NRR_a_tough_woman: "麻烦事、麻烦人"
  NRR_a_tough_woman_desc: "现在，该想好如何安置这个最麻烦的人了..."
  NRR_the_real_goodbye: "真正的告别"
  NRR_the_real_goodbye_desc: "这次可就是真的告别了，没有意外，也不可能再有意外了。"
  NRR_chains_forever: "永远的锁链"
  NRR_chains_forever_desc: "多么精心设计的完美牢笼，这个犯人将在这里待到老死..."
  NRR_have_a_nice_day: "早安、午安、晚安"
  NRR_have_a_nice_day_desc: "就这样，一切完美地结束了，如果我们此后未能再见，那我祝大家早安、午安、晚安！"
  NRR_determined_to_win: "胜券在握"
  NRR_determined_to_win_desc: "万事俱备，我们只需要去收取完美的胜利。"
  NRR_bury_the_enemy: "埋葬敌人..."
  NRR_bury_the_enemy_desc: "战争结束了，犯人死亡了......"
  NRR_nothing_left: "§R空无一物§!"
  NRR_nothing_left_desc: "§R什么都没有了......§!"
  NRR_and_our_people: "...和我们的人民"
  NRR_and_our_people_desc: "但无辜的平民也......"
  NRR_appalling_the_nation: "震惊全国"
  NRR_appalling_the_nation_desc: "战争的后果让曾经沉溺于美梦的国家和人民惊醒：他们仍活在一个残酷的世界里。"
  NRR_safe_return: "安全返回"
  NRR_safe_return_desc: "她在等着他回家，他承诺过会回来......"
  NRR_weak_trust: "脆弱的信任"
  NRR_weak_trust_desc: "这一次也许胜利了，但下一次呢...?"
  NRR_victorious_but_defeated: "虽胜犹败"
  NRR_victorious_but_defeated_desc: "成功？也许吧，但他认为他输掉了一切。"
  NRR_nothing_to_reply: "无言以对"
  NRR_nothing_to_reply_desc: "老友的告别往往欢声笑语或热泪盈眶，但这次，唯有沉默，就如同那天的娜洁希坦一样。"
  NRR_my_dear: "§R我的挚爱...§!"
  NRR_my_dear_desc: "§R她不会回来了......§!"
  NRR_my_dream: "§R我的梦想...§!"
  NRR_my_dream_desc: "§R我心目中的国家也是......§!"
  NRR_all_of_them_broken: "全部破灭了"
  NRR_all_of_them_broken_desc: "§R......§!"

#事件
  NRR.event.askforhelp.t: "南亚的革命军向我们寻求帮助"
  NRR.event.askforhelp.d: "一群来自南亚的自称革命军的外交团体找到了我们的外交部，声称他们正在进行一场与腐朽帝国的斗争，现在，他们正面临巨大的危机，请求我们进行武器方面的资助"
  NRR.event.askforhelp.1.a: "一个可能的民主盟友，这是一笔值得的投资"
  NRR.event.askforhelp.1.b: "什么游击队也敢来找我们"

  NRR.event.1.t: "革命军高层会议结果"
  NRR.event.1.d: "革命军战略会议的结果，现简报整理如下：\n\n进行1935年冬季反进攻战役的战后巩固，补充兵员，加强西部前线。\n\n“夜袭”组织的渗透工作得到了革命军高层的肯定，希望再接再厉，为革命军立下新功劳。\n\n军事物资的采购工作难题仍需要得到解决，会议决定从两个方面入手：外交采购、援助途径，和根据地工业建设，并希望“夜袭”组织的渗透工作清单中列入此项。\n\n根据新情报，狩人军团将在1937年夏秋之际发动新攻势，艾斯德斯本人将亲临前线，战争动员规模将远比1935年庞大，会议对于先发制人还是采取守势尚未达成统一。\n\n高层会议对于建立统一的军事指挥部尚未达成统一。\n\n现有根据地的工作组计划清单得到了高层会议的批准。\n\n高层会议对于外交的重点国家尚未达成统一。\n\n高层会议对于未来的共和国建国方案尚未达成统一。"
  NRR.event.1.a: "夜袭总部收到"
  NRR.event.2.t: "采购日"
  NRR.event.2.d: "据与塔兹米同行的雷欧奈和伯拉克返回总部的报告，潜伏渗透狩人军团驻地进行的军火采购任务起初非常顺利，因为塔兹米本人尚未被帝国军通缉，任务本身并不危险。但是，当日恰巧遇上了艾斯德斯举办的比武大会，一切交易活动被迫暂停。\n\n在看到大赛有丰厚的奖金后，塔兹米临时提议个人参加比赛，将奖金用于采购活动。因塔兹米本人身份安全，雷欧奈和伯拉克并未表示反对。比赛本身起初也非常顺利，塔兹米本人顺利取得比赛的胜利，但难以预料的意外突然发生，从大赛开始一直枯坐在观赏台的艾斯德斯突然走下场地，在对塔兹米说了一番话后，直接用锁链将塔兹米本人锁上，随后敲晕带走……\n\n大赛会场一片哗然，事态发展得太快以至于雷欧奈和伯拉克呆在观众席尚未作出反应，艾斯德斯和昏迷的塔兹米两人便消失不见。二人见事态已无法挽回，便决定先行返回总部进行汇报，再进一步计划能否救出塔兹米。"
  NRR.event.2.a: "啊……啊？"
  NRR.event.3.t: "魔鬼的交易"
  NRR.event.3.d: "“蠢货！”\n\n月夜，艾斯德斯的卧室，塔兹米正坐在那张宽大而柔软的贵族床榻之上，而与那声呵斥相伴的，是塔兹米脸颊上那还没得及泛红的巴掌印。\n\n“你这是在做什么，劝诱一名帝国的将军吗？”全然没有白天充满喜爱和欣悦的表情，一脸愠怒的艾斯德斯直起身子，居高临下地看着被她捆起来的塔兹米，在此之前，塔兹米决然地暴露了自己革命军的身份，他本以为，这突如其来的与狩人军团最高指挥官共处一室的机会让他看到了可能性…也许，更多的鲜血没有必要继续流淌，这场必然而又荒谬的战争也许可以迅速地结束…直到耳光将这理论中的可能性彻底抹杀。\n\n“那…那我也多说无益，酷刑抑或处决，悉听尊便！”意识到仅凭话语已经不能达成目的，自曝身份的塔兹米看向眼前的冰之魔女就如迎接自己的死神一般，咬紧牙关却浑身战栗，将头别向一边试图让自己在死前能保持最后的冷静。\n\n啊，何等的勇敢，又使人怜爱……艾斯德斯俯视着难掩颤抖的敌人，心中扭曲的爱恋使她不自觉地想着。\n\n突然，仿佛历史的另一个时钟在此刻开始摆动一般，一个从未有过的冲动闯进了艾斯德斯的脑中，她贴近塔兹米，用几乎快亲上的距离贴近塔兹米的耳畔。\n\n“我可以答应你的条件。”\n\n“诶？”刚处于死亡走马灯的恍惚中的塔兹米一时未能理解刚听见的话语，他的大脑在死亡与可能幻听的错觉中快速切换，已然无法处理刚听到的，那诱人的提案。\n\n“但这是有条件的……”\n\n那双清澈、锐利、冷酷的蓝色眼瞳，紧紧地与他对视，视线仿佛要刺穿他一样。"
  NRR.event.3.a: "我不能放弃这个机会…"
  NRR.event.3.b: "我不能答应这个魔鬼…"
  NRR.event.4.t: "塔兹米带回了一个提议"
  NRR.event.4.d: "昨天，塔兹米顺利回到夜袭总部，而伴随他一同回来的，是来自狩人军团元帅艾斯德斯的一份提议。\n\n艾斯德斯的提议在革命军指挥部引起了一场地震，塔兹米本人简要地叙述了他和艾斯德斯的个人会谈过程（情报部门认为这份供述并不完全真实，至少可能存在部分隐藏），并带回了艾斯德斯本人向革命军的合作意向。\n\n狩人军团将不会在革命战争中支持帝国，她们不仅会保持必要的协助，同时将为革命军让出必要的控制区以协助革命军通过。这份协议起初被当成狩人军团愚弄革命军的一场把戏，或者诱骗革命军信任的一场阴谋，但从狩人军团总部传来的消息，以及前线观察所观测到狩人军团正在让出一块长达三十公里的空白区，证明这并非假情报：她正在等着我们的到场。\n\n最终，革命军的实力派将领，同时也是夜袭团的首长娜洁希坦将军决定派人进行试验性的会谈，并呼吁军队高层不要对会谈抱有过高期望。"
  NRR.event.4.a: "总之，我们只能试一试…"
  NRR.event.5.t: "塔兹米平安返回"
  NRR.event.5.d: "昨日，塔兹米顺利回到夜袭总部，塔兹米本人并未受到严刑或拷问。\n\n塔兹米如实向总部陈述了他与艾斯德斯共处时间发生的经历，包括他劝诱艾斯德斯但遭到失败的过程，革命军高层起初对于这场会谈充满怀疑，但是在娜洁希坦将军的担保下，最终塔兹米被解除嫌疑，并获得重新参加工作的许可。\n\n最后，狩人军团的进攻计划以及部署方案被证实是可信的信息，革命军高层决定先发制人，计划在艾斯德斯做好准备之前率先发动奇袭。"
  NRR.event.5.a: "战争的步伐逼近了"
  NRR.event.6.t: "魔鬼的交易·回忆"
  NRR.event.6.d: "“你的观点我不会认同，这世间本就是弱肉强食的。”\n\n“那你为何……?”塔兹米还没有完全回过神来，他只能发出简单的疑问来平息刚刚的恐慌和错愕。\n\n“因为现在的皇帝太弱了嘛，“艾斯德斯眯起眼睛，鄙夷地说着，“那个小孩子被身边的大臣像玩具一样玩弄在手心，恶心。”\n\n“你身上有我喜欢的东西，”艾斯德斯指着塔兹米，“所以我的条件很简单，既然你要让我背弃帝国，那塔兹米，你就要让我做新的王。”\n\n“开什么玩笑，我加入革命军怎么可能是为了这种事情…!”\n\n“所以我给你时间，”艾斯德斯微笑着打断塔兹米，“我倒要看看你所理想的那个世界究竟会不会到来，如果不能……”\n\n“你为了你的理想，需要力量，而我就是新的王。你会需要我的，塔兹米，我也需要你作为工具。”\n\n“见证我力量的工具，这就是我的条件……”\n\n难以入睡的塔兹米双手紧握，如同回忆中的他一般，他正感觉到从未有过的迷茫，黑暗在推着他往前。"
  NRR.event.6.a: "而这永远不会停下"
  NRR.event.7.t: "旧朋友，旧对手"
  NRR.event.7.d: "“我没有想到我们还能重逢，娜洁。”骑在马上的艾斯德斯风采依旧，就如同她们年轻时相遇的那一天。\n\n“我更没有想到我们会以这种方式见面，艾德。”同样骑在马上的娜洁希坦的表情比艾斯德斯沉重的多，她比年轻时沧桑了许多，多年以来革命军的诸多工作，以及高层之间的相互攻讦耗尽了她的精力。\n\n两人相继无言，骑马同行了一段时间后，艾斯德斯率先打破了沉默。\n\n“看来，新的国家，你的位置无人可撼动了。”艾斯德斯指了指自己，意指与自己媾和让娜洁希坦身价大涨。事实也确实如此，革命军高层视她为唾手可得的胜利的第一功臣，旧帝国的投诚分子也将她视作合作派的代表人物。\n\n“哼……”娜洁希坦望向前方，沉默不语。眼见这场谈话已然无疾而终，艾斯德斯放弃了进一步交谈，两人就这样同行了很久，直到到达谈判的地点。"
  NRR.event.7.a: "骑马同行，却早已分道扬镳"
  NRR.event.8.t: "明天，还是昨天？"
  NRR.event.8.d: "“塔兹米？塔兹米！”\n\n同伴的声音将塔兹米从思绪中拉回，轰鸣作响的卡车车队正向加德满都和巴特纳进发，夜袭团的总部也将从后方迁移至新的前线。\n\n“你最近到底怎么了，魂不守舍的……”坐在旁边的玛茵维护着她的“浪漫炮台”，一脸疑惑地看着塔兹米。\n\n“玛茵……”\n\n“嗯？”\n\n“你觉得，我们一定会赢吗？”\n\n“这不是当然的嘛！”玛茵得意地看着她的帝具，“本来以为还要在这里苦战的，没想到突然间也不知道为什么狩人这群蠢货突然向我们投降，省得我们费力气了，现在可以一口气打进帝都！”\n\n战友兼同伴并未理解塔兹米的真正问题，他的报告除了娜洁希坦和少数高层之外，没有任何人知情，即使是他最亲近的战友玛茵，也只是知道他曾短暂地被艾斯德斯抓住。\n\n艾斯德斯不可能平白无故开出这个匪夷所思的条件，她必然有胜算，但胜算在哪里？塔兹米深埋着头，故去的大哥，同村的好友，以及无数革命军战友的面庞一一在塔兹米脑海中浮现。这样的理想不可能失败，塔兹米一直如此坚信，但自从和艾斯德斯的那一天之后，他想不明白，也不敢去想那个即将浮现的答案。"
  NRR.event.8.a: "这辆卡车到底是在开向未来，还是开向过去？"
  NRR.event.9.t: "伟大的胜利"
  NRR.event.9.dec: "万岁！当我们的军队在帝都皇宫的上方插起革命战旗的那一刻，腐朽的旧帝国轰然倒塌，它的心脏正如踩在脚下的帝国旗帜一般停止了跳动。\n\n次日，后续到达的革命军在旧帝都大道整齐进军，为全城的市民上演了一场属于新生共和国的民主阅兵。\n\n革命时期争论不断的高层委员会议在一个议题上出奇的达成了一致：将旧帝都定为共和国的新首都，以象征共和国继承了旧帝国的法统与外交地位。现在，为了更好地宣称我们在世界之林的新地位，我们迫切需要与旧帝国分庭抗礼，起一个新的国号，鉴于现疆域基本都由恒河流经，且恒河作为民族的母亲河，象征着包容和平等，因而将恒河作为国号主体得到了一致通过，但也有相当多数的主体认为应当使得国号更具有民主色彩或者革命色彩。"
  NRR.event.9.a: "就叫恒河共和国吧"
  NRR.event.9.b: "恒河民主共和国"
  NRR.event.9.c: "恒河革命共和国"
  NRR.event.9.d: "恒河工农共和国"
  NRR.event.10.t: "恒河共和国宪法"
  NRR.event.10.d: "“经过数十年的艰苦斗争，共和国革命军带领广大的恒河人民推翻了旧帝国和腐朽皇室的堕落统治，开启了恒河人民的共和国新时代，共和国各地的国民代表相聚在这里，为国家、政府与全体国民制定本部宪法：\n\n第一条 恒河共和国国体永不变更，一切恒河公民都有维护、捍卫共和政体的义务。任何个人、组织和机关不得以任何方式、以任何形式提议复辟君主制。\n……\n第三条 恒河共和国的权力机关为国民议会，一切行政机关由国民议会产生，对国民议会负责，受国民议会监督，在各地区设立地方议会，上级议会依法领导下级议会行使立法权，展开地方立法，依法授权立法。\n第四条 最高法院院长由国家总统提名，国民议会批准任命，最高法院其他成员由最高法院院长提名……司法机关依法行使相对独立司法权，依法享有宪法解释权。\n……\n第七条 共和国总统任期为五年，不得连任超过两届。\n……\n第十三条 兼具司法职能和行政职能的国家机关，由专章法律另行规定\n……\n第十八条 国家一切军事力量受国家军事委员会领导，国家总统担任委员长和国家军队的最高统帅。国家总统依法领导加尔各答特区的军事力量。\n……\n第一百零四条 恒河共和国国旗为共和战旗，恒河共和国首都为德里。"
  NRR.event.10.a: "恒河共和国第一届国民议会表决通过"
  
  NRR.event.11.t: "旧敌旧臣"
  NRR.event.11.d: "现在，一个棘手的问题摆在了我们面前。\n\n我们曾向民众承诺，将铲除一切旧帝国的腐朽统治和腐败分子。但是，如今不论是初创的各种国家机关，上至首都，下至地方，就连军队的若干岗位上，都充斥着此前或是投诚、或是见风使舵的旧帝国分子，如今虽然他们都已经被高层以“合作派”的定性暂时相安无事，但如果我们不想背叛自身在革命伊始对国民的承诺，我们就必须花费大力气将他们调离要害的实权岗位，现在国民大会仍在进行，您作为共和国的总统，可以直接提出一项处置旧帝国分子的议案，我们相信这个议案的通过压力并不大，并以此将他们明升暗降，或秋后算账……\n\n总统阁下，将合作派和旧帝国的残余“请”出我们的政府将是一件极具魄力的事情，鉴于我们之前的抉择，我们此时也许大有可为，抑或是别无选择，但请记住，总统阁下，这是在共和国诞生之前，§R我们早该想到的情况。§!"
  NRR.event.11.a: "我们必须拔除这群阻碍祖国新生的残渣…!"
  NRR.event.11.b: "选择吗？我想我恐怕没有选择……"

  NRR.event.12.t: "保守派的天堂？"
  NRR.event.12.d: "正在进行的国民大会出现了令我们始料未及的事情。\n\n以合作派分子和保守派组成的恒河人民党，联合我们党的右翼议员对正在审议的国民大会制度提出了修正案，他们要求修改建国初提出的一院制方案，主张仿照圣杯的议会制度，在国民大会之上设置国民参议院，并要求从当前的政府组成人员和军队老人选取（我们核实了名单，大多数人来自合作派和一些保守的军队功勋），并且要求赋予参议院实权，一般议案须经两院均过半数赞同方得通过，如果是重大议案，则也与国民大会一样，须三分之二赞成。不仅如此，五年任期的参议院选举无需公投直选，而是由政党根据自身的比例票数直接推举。\n\n总统阁下，倘若按照这样的议会制度，虽然民主共和党有信心在两年后的中期选举中占据优势，但如果按照目前的议席比例，人民党将在参议院占据关键性的可观席位，这极不利于推进共和国迫切需要的各项改革和建设法案，也间接保护了很多罪大恶极之人不被革命清算……宪法和国会都赋予了您直接否决该议案的权利，但请注意，如果我们真的动用了行政否决权，人民党会利用我们§R曾经的妥协历史§!大肆进攻我们（如果它真的存在的话），我们在政党中的保守派盟友也会对我们感到愤怒，这份议案真的会是阁下想要的吗？"
  NRR.event.12.a: "战斗的民主共和党不会妥协！"
  NRR.event.12.b: "我们曾经妥协过，如今也只能再次妥协……"

  NRR.event.13.t: "新麻烦"
  NRR.event.13.d: "自革命时期以来，在革命军的中下层当中，始终存在着一个号称为“理想派”的激进分子，与我们收编旧帝国投诚分子形成的“合作派”分庭抗礼，两者的存在深深撕裂了革命军内部的团结。\n\n在共和国建立以后，一些人分离了出去，成立了左翼的社会党，也有相当多的人留在了民共党内，标志着民共党的左派势力，他们在国民大会中也占据着一定的席位，更为要紧的是，他们在宣传方面更能感染基层选民的情绪。"
  NRR.event.13.a: "希望这对于我们是一件好事情……"

  NRR.event.14.t: "推倒神像？还是修修补补？"
  NRR.event.14.d: "今天的国民大会议程依然并不顺利，尽管我们在胜利伊始就承诺建立一个信仰自由的政教分离国家，但左翼分子显然认为这远远不够。社会党对国民大会正在审议的《宗教法》提出了让人棘手的修正条款，他们要求宗教势力全面退出科学、政府、教育以及主流文化领域，甚至提出对于教育人员、政府骨干和科研人员的宗教信仰进行全面的调查，并勒令其中的信教者放弃宗教信仰。\n\n这些修正案直接触及到了许多在职官僚的利益，虽然此前人民党已经明确表示会反对该项法案，但社会党的出现让我们连与人民党谈判的可能性都没有，并且，我们还必须认真考虑社会党的议案，毕竟我们如今只能依赖他们才能使得票数过半。总统阁下，§R如果人民党手中没有我们的把柄§!的话，我相信我们可以对社会党做出部分妥协换取他们的支持，只要妥协的部分能在可控的范围之内……"
  NRR.event.14.a: "告诉社会党，他们可以在教育部获胜，但其他的部门就先别想了"
  NRR.event.14.b: "我恐怕无能为力……"

  NRR.event.15.t: "市场，还是饭碗？"
  NRR.event.15.d: "社会党并未偃旗息鼓，他们的攻势还在继续。此前我们已经与人民党在经济议案上达成了合作，只要我们将财政预算的一定份额投入到刺激市场和资本运作中去，他们就会赞成通过我们的财政预算报告。\n\n但社会党并不赞成，他们的代表在国民大会的发言得到了舆论的关注。社会党发言人指出现在共和国的边陲和很多地区正在陷入战后恢复和战争导致的农业生产中断，以及随之而来的严重程度不等的饥荒。他们批评政府的财政预算在赈灾和民生方面的占比“贫瘠到令人发指，简直就是旧帝国的做派！”\n\n总统阁下，按照我们与人民党的协议，即使社会党反对我们，我们仍然有充分的把握通过预算案，但是如果不做出丝毫回应和改变，这将在舆论上对我们很不利，我们是否应当做出调整？"
  NRR.event.15.a: "民生问题始终是民主共和党的首要考量！"
  NRR.event.15.b: "我们此刻必须加强与人民党的关系，而不是激怒他们……"

  NRR.event.16.t: "《清白先生法案》"
  NRR.event.16.d: "现在，轮到我们民主共和党进攻了，秉持着革命时期的革命军理念和建国后的政党宣言，我们必须兑现我们的诺言。《反腐败监察法案》——也被舆论称为“清白先生法案”——已经被我们正式提出。这一套体系旨在多方位的体系化清除腐败在官僚系统的生存土壤，将原本分散在立法、行政与司法各系统的监察部门统合提拔为直接隶属国家中央政府的监察部，只对国会与总统本人负责，以剥离一切阻挠反腐事业的盘根错节的关系网。\n\n法案的提出直接引起了以人民党为首的右派势力的强烈反对，但这些“侍奉两朝”的老油条深谙反对掣肘之道，他们反对的理由是这一法案违背了建国与宪法中的分权制衡精神，也阻挠了司法与行政互不干涉的原则，会导致行政权极度膨胀。这一精巧的反击让许多不受民主共和党控制的骑墙派议员摇摆不定。总统阁下，我们必须想办法说服这一法案的通过，民共党的初战必须旗开得胜！"
  NRR.event.16.a: "我们当然应当赌上一切！"
  NRR.event.16.b: "我所能做的只有闭眼祈祷……"

  NRR.event.17.t: "国民大会通过了《清白先生法案》！"
  NRR.event.17.d: "恭喜，我们的首部重要法案得到了议会的半数赞成，现在，我们终于可以大展拳脚，配合我们的行政改革进行我们的下一步有力行动了！"
  NRR.event.17.a: "民主不容任何腐败插手"

  NRR.event.18.t: "国民参议院否决了法案！"
  NRR.event.18.d: "虽然我们拼尽全力，在国民大会获得了过半数的支持，但是新设立的参议院显然比国民大会的议员更加保守和顽固，合作派的人自不必多说，共和派的保守分子居然也因为人民党的舆论攻势而对我们的法案感到疑惑，最终，我们以参议院数票的劣势输掉了这一局。现在，我们只能希望通过行政方面的改革来扳回一局了……"
  NRR.event.18.a: "我们只能寄希望于……"

  NRR.event.19.t: "“除鼠计划”"
  NRR.event.19.d: "不论我们在上一阶段的议会表现如何，接下来我们都需要全力以赴了，朋友们，目前行政系统掌握在我们民共党手中，优势在我等之手。\n\n根据宪法第13条的规定——兼具司法职能和行政职能的国家机关，由专章法律另行规定——我们有机会说服国民大会给予政府立法授权，允许我们制定一部专门授权警察部门打击重点贪腐犯罪和捣毁犯罪集团的特别行动许可的行政法规，一旦我们取得了授权，那么我们将拥有先发制人的优势，这将沉重打击不法政党活动，维护议会和政府的风气，破坏一切腐化官员的不法企图。\n\n但是，问题就在立法授权环节上，我们仍然需要和议会打交道，如果在任一环节上我们未能通过，那我们的一切行动将直接流产……"
  NRR.event.19.a: "但愿命运站在我们这一边……"
  NRR.event.19.b: "但愿命运站在我们这一边……"

  NRR.event.20.t: "除鼠计划正式实施！"
  NRR.event.20.d: "总统阁下，国民大会通过了我们的立法授权！我们的行政部门已经摩拳擦掌，将精锐的骨干力量投入到我们的犯罪打击计划之中，我们相信很快就将展现非凡的成效，请静候佳音……"
  NRR.event.20.a: "干杯！为了猎手，也为了死去的老鼠！"

  NRR.event.21.t: "除鼠计划胎死腹中！"
  NRR.event.21.d: "参议院！又是该死的参议院！什么“为了防止行政权力膨胀”，什么“不能违反伟大的建国精神和共和理念”！参议院完全成为了阻挠改革的白手套和一切犯罪行为的遮羞布！我们该如何回应选民的期待，我们该如何面对国民的期盼……"
  NRR.event.21.a: "都是因为我，都是我的罪过……"

  NRR.event.22.t: "GBC特别访谈节目：新生的恒河（节选）"
  NRR.event.22.d: "“今天我们将开启一个特别的访谈节目，我们有幸邀请到了长期驻守在GBC南亚分部的布里斯先生，欢迎你！”\n“谢谢主持人，我也很荣幸在这儿接受你的访谈。”\n\n“让我们直入话题吧，布里斯，从曼德勒时期开始，你一直就在持续观察并报道这支与众不同的革命军是吗？”\n“是的，我在过去的十年间，我很有幸见证了这支民主革命军从游击队到根据地势力，最终成功推翻旧政府建立共和国的历程。”\n\n“但是，布里斯，我想很多的圣杯人都在关注着我们即将提出的问题：他们能否成功？我们即将迎来世界民主国家的一位新盟友，还是一个披着共和外皮的旧军阀？”\n“现在谈这一点还为时尚早，先生，但是我确实在最近已经看到了相当多的变化：新政府正在行动，议会和法院正在配合政府进行一场从上到下的大革新，旧式的国家机器已经不复存在，我有信心说：我们即将见到一个新生的共和国的到来。”\n\n“这真是一番别样的论断，我相信很多观察家听到你的话恐怕要睡不着觉了，那么我们换一个角度，你在那儿的时光，有没有什么足以让你印象深刻的事情呢？我是说，一些细节之类的。”\n“当然了，主持人先生，我记得是我刚刚抵达曼德勒的时候……”"
  NRR.event.22.a: "旁观者清"

  NRR.event.23.t: "GBC特别访谈节目：恒河（节选）"
  NRR.event.23.d: "“今天我们将开启一个特别的访谈节目，我们有幸邀请到了长期驻守在GBC南亚分部的布里斯先生，欢迎你！”\n“谢谢主持人，我也很荣幸在这儿接受你的访谈。”\n\n“让我们直入话题吧，布里斯，从曼德勒时期开始，你一直就在持续观察并报道这支与众不同的革命军是吗？”\n“是的，我在过去的十年间，我很有幸见证了这支民主革命军从游击队到根据地势力，最终成功推翻旧政府建立共和国的历程。”\n\n“但是，布里斯，我想很多的圣杯人都在关注着我们即将提出的问题：他们能否成功？我们即将迎来世界民主国家的一位新盟友，还是一个披着共和外皮的旧军阀？”\n“现在谈这一点还为时尚早，先生，但是我想曼德勒政府现在已正在面临作为执政党而非在野党的诸多困境：诸多党派相互攻讦、新政府许多大刀阔斧的改革在各色国家机关中步履维艰，官僚体系亟需政府提出更加灵活的改革方案，但是，我有信心说：这将不会持续太久。”\n\n“这真是一番别样的论断，我相信很多观察家听到你的话恐怕要睡不着觉了，那么我们换一个角度，你在那儿的时光，有没有什么足以让你印象深刻的事情呢？我是说，一些细节之类的。”\n“当然了，主持人先生，我记得是我刚刚抵达曼德勒的时候……”"
  NRR.event.23.a: "旁观者清"

  NRR.event.24.t: "暂别"
  NRR.event.24.d: "“为我们的新铁路‘大臣’，塔兹米大人干杯！“\n“干杯！“\n\n时间回到胜利的第二周。数个酒杯碰撞在一起，自战争开始以来，负责潜伏于阴影处的夜袭主要成员们很少能够像今天这样在军队酒吧中开怀畅饮。共和国建立之后，作为夜袭组织的领袖和建立共和的头号功臣，娜洁希坦总统自然不再管理夜袭组织的具体事务和军队的组织管理当中，夜袭组织也将在不久后作为国家情报组织的主干与基底重新出现在世人面前，但娜洁希坦尊重昔日属下的选择，让他们自择去留。\n“少揶揄我，尊敬的炮兵‘司令’，玛茵元帅。”退出军队，转到交通部门担任铁路司处长的塔兹米豪爽地将啤酒一饮而尽，今日的酒会并非所有人都到齐，娜洁希坦忙于政务，赤瞳还在远处的某支军队执行任务，切尔茜作为情报专业人员转入了外交部，即将前往圣杯担任参赞。\n\n“喂喂，各位官老爷，到时候高升了可不要忘了民妇哟！”自由散漫惯了的雷欧奈无心政治或军务，向娜洁希坦讨了一个地质勘探局的挂职闲差，计划到全国各地好好旅游，“尤其是你，拉伯克大少爷，什么时候能给我的旅游经费批点款子来用用啊？”\n“起诉你挪用公款哦！”出身贵族的拉伯克追随娜洁希坦的脚步，加入到民主共和党新组建的财政部审计署担任处长，“不过玛茵，你不是一直想回老家看看吗，怎么还是选择去了炮兵部队？”\n\n“嗯……是想回去啦，但是老大拜托我去那里了，那也没办法嘛，”新到任的炮兵参谋玛茵一时望向天空，随即眼珠一转，一脸坏笑地望向塔兹米，“差点让你们带偏了题，今天大伙可要把塔兹米灌醉了，让他手底下的火车司机们看看，醉醺醺的铁路大臣上任的样子！”\n“干杯！”"
  NRR.event.24.a: "各奔东西，暂时……"

  NRR.event.25.t: "小火车，大货物"
  NRR.event.25.d: "“处长……”铁路司的秘书小心翼翼地走进处长办公室，手中拿着一张表格，“我是来……”\n“又是高层特殊计划列车，是吗？”埋首批阅文件的塔兹米没有从堆积如山的表格中抬头，因为这个月已经是他的秘书第七次向他汇报同样的事情，而这个月仅仅过去了十天。\n“是的，您看，能不能再调整一下火车的班次部署，把这个的优先级也提一提……”深谙人事的秘书察觉到了长官情绪细微的变化，指着手中的这张列表，语气变得更加卑微。\n\n塔兹米从秘书手中接过了那张洁白的表格，随着他缓慢地浏览，塔兹米的眉头锁得更紧，握纸的手青筋开始隆起，秘书紧张地咽下了口水，生怕一场雷霆将突然到来。\n“这种事情，”塔兹米的语气仍然平静地批阅着文件，“审计署和反贪局的人不会查吗？”\n“处长，这事儿，我之前也说过，”秘书谨小慎微地提醒，“这个，目前在交通局的暂行章程里，可以算作国家特殊物资，就能绕过审计部门的人处理，咱们部的部长已经打了招呼，不会有人找咱们的麻烦。”\n\n见塔兹米不吭声，秘书接着说：“而且，这事儿，要真查起来，也只能查部长和他背后的那群人，这路人在旧帝国的时候就各路吃得开，我们这些跑流程的，真追究起来，也只是执行命令，查不到我们……”\n“行了，表格我今晚就会签字，明天你来拿，就这样。“\n秘书听闻如蒙大赦，他答应了一声之后飞也似地逃出了塔兹米的办公室。\n\n几分钟后，在没有旁人的办公室里，传出了文件堆被推翻在地上的响声，声响很大，但没有其他人听见。"
  NRR.event.25.a: "他开始意识到事情不对劲了起来"

  NRR.event.26.t: "XX月第4批普通C种货物清单"
  NRR.event.26.d: "执行部门：交通部\n出发地：仰光\n目的地：德里\n货物清单如下：\n\n神州产陶土原料（塔兹米字迹：瓷器）制品████公斤，单独存放，需填入填充物；\n共和国A种特殊民用物资（塔兹米字迹：私人黄金）█████.██吨，需披上黑布，密封，妥善搬运；\n圣杯非洲产D类普通货物（塔兹米字迹：钻石）████件，需每件单独存放；\n幻想乡进口民用衣物（塔兹米字迹：女士高级定制礼服）███████箱，需存放至列车干燥处。\n\n上述货物需尽快送达，执行标准参照《恒河共和国交通部暂行国家特殊物资运输章程》执行，责成交通部尽快送达，送达后无需交通部保存，将交由有关部门处理。\n（塔兹米字迹：为此，一列运送粮食的列车比原计划晚了一周才到达了早该抵达的目的地）"
  NRR.event.26.a: "在此期间，那里又饿死了上百人"

  #BOP
  NRR.event.27.t: "炒面店的清晨"
  NRR.event.27.d: "德里贫民区闹市街头的清晨总是人来人往，大多数人的生计并未因恒河共和国的建立而出现过多的变化，除了称谓从“臣民”变成“公民”外，力工们仍然得早早地起来，吃些便宜且油腥味重的东西，以应付一整天的重体力活。\n大街东侧的一家炒面店总是生意兴隆。摊位前的长椅坐得满坑满谷，因为他家的炒面油总是放得很重，价格又较便宜，总能让老主顾们时常光顾，当然，大多出于囊中羞涩的缘由。\n\n“你说，这新总统上来了，咱们这生意会有变化嘛？”常年在店面跑腿的店小二乘着送餐的间隙，有一搭没一搭地跟老板聊着。\n“活儿别停！把这碗送过去！”店老板大声呵斥着，把刚出锅的一碗油腻腻的炒面递了出去，“再来十个新总统，你的工钱还是那么多！”\n“什么共和啦，总统啦，嗨！顶个屁用啊！”店老板接过话茬，手中的锅铲却没听，“怎么着？上来个什么总统，什么部长，咱这炒面店就不开了？开玩笑！”\n“打我爷爷那辈子，圣杯人来了，打我爸爸那辈子，圣杯人又走了，什么租界的、帝国的、游击队的，来来回回，就我们这三代人，变了多少趟！”老板一边颠勺，一面抱怨，“可咱这锅，几十年没坏过，咱这店，几十年没关过！咱们的人爱吃，圣杯人也爱吃，这才是真的！”\n\n“照您这意思，就是没变化呗！”一位食客突然应了一声。\n“嗨！你这才是实话，”老板又往锅里抓了一把面，“咱们街头那兔崽子，之前是流氓，现在呢，还是流氓；隔壁街那个谁，之前帮着那些大臣夫人倒卖衣服珍宝，现在呢？帮着那群部长夫人干同样的差事！哼……”"
  NRR.event.27.a: "见微知著"

  NRR.event.28.t: "永不停止的华尔兹"
  NRR.event.28.d: "今晚才刚刚入夜，交通部的办公楼内基本上已经陷入一片黑暗，主要是因为交通本人部长和他的一帮拥趸以“餐叙会”的名义，在德里的一家豪华饭店宴请部内的绝大多数部员参加。\n\n当然，并不是部长本人掏腰包。\n\n是绝大多数而非全部，这并非是因为部内排挤或者派系斗争，有部分人是因为出外勤无法参加，也有家住的远而无法赴宴的。\n当然，铁路司处长塔兹米确实算得上是一个例外，他亲口拒绝参加这种宴会。\n\n在交通部，塔兹米是唯一一个转业人员，也就是唯一的曾经真正投身于战场的人，刚过二十岁生日的他，居然也被部门年长的同事称之为“老兵”，每想到这儿都会令他唏嘘不已。\n然而，他也是这所有人之中，最深知公款来之不易的人，在战场和秘密任务中，每一次的行动经费，整备武器的每一件材料——有的还只能从欧洲进口——都出自根据地群众的一分一厘，这也正是塔兹米及他的战友们普遍保持勤俭的生活作风，纵使花钱，也基本自掏腰包。\n而在这儿，一个月几次全单位规模的聚会只是各种公款花销的一环，某些时候，就连审计署的驻派人员也会参加这等会餐……"
  NRR.event.28.a: "意料之外，情理之中"

  NRR.event.29.t: "致玛茵"
  NRR.event.29.d: "见字如面，我过得并不太好。\n上次你来信的时候，我正在为几个列车班次冲突的事情忙得焦头烂额。一辆运送货物的列车被要求排到所有原定计划的货列和客列之前，乘客们的车票要更换，目的地的各个工厂要寄去晚点的通知，某些地方的救济粮要延迟发放。\n\n（浅色铅笔：第四批货车，详情我写在了信的背面，用我们在“夜袭”时惯用的暗号，你知道的）\n\n铁路司的工作大多是让我很快乐的，我们付出了这么多，终于换来了旧帝国的灭亡和新生共和国的建立，百废待兴，很多事情大有可为，德里就像共和国的心脏一样，每天有源源不断的货物、旅客从各地涌来，又有源源不断的货物、旅客从这里出发，我总是自豪于能协调这种工作量庞大而又有意义的工作。\n但是正如我给你写信的缘故，某些事情正在起变化……\n\n等你看信的背面你就知道了。"
  NRR.event.29.a: "你的战友，塔兹米，祝你快乐"

  NRR.event.30.t: "魔鬼的交易·成交"
  NRR.event.30.d: "腐败、欺骗、背叛。\n\n塔兹米没能忘记他第一天到达帝都时，在贵族地牢里，他的两个同乡绝望的眼神。\n这支撑着他加入革命军，挺身于革命的最前线——“夜袭”，在目睹了无数战友、敌人的死去后，他终于侥幸存活，等到了胜利的朝阳。\n\n但阳光没有照到他和他热爱的人们身上。\n\n几个月以来，塔兹米经手了许多秘密，在忍耐和观察中，他看到的不是欣欣向荣，而是混乱和狼藉。旧帝国的腐败分子没有消失，他们正在和被胜利和荣华腐蚀了意志的人联手，趴在新生的共和国身上敲骨吸髓，意图将这来之不易的胜利，变成贵族们一场新名目下的酒肉盛宴。\n\n他曾相信他昔日的老大，现在共和国的第一任总统，将会力挽狂澜，领导国家驶出风浪，但他只能在报纸上看到民共党在节节败退，他也曾旁听了一次娜洁希坦出席的国会听证会，他没有看到当初那个意气风发的将军，而是一个受困于诸多事务与风波，被压得抬不起头的憔悴之人。\n\n一切希望的出口都被堵死了，塔兹米想到了那个夜晚，艾斯德斯和他定下的那场交易。正如历史上许多重大决定往往只在须臾间作出一般，塔兹米拨通了电话：\n“加尔各答军区吗？接你们的司令…什么理由？你告诉她，我来兑现那场交易了。”"
  NRR.event.30.a: "他必须捍卫这场革命，不论用何种方法……"

  #命运十字路
  NRR.event.31.t: "雨夜·办公室"
  NRR.event.31.d: "德里今晚正在下雨，是一场已经连续一天一夜的瓢泼大雨。\n虽然恒河向来有雨季，但是此次的暴雨不仅降水量反常，而且到来的时候来得过于异常了。议会正在争吵，人民党声称是现任政府的许多激进改革惹怒了上天，而社会党声称是工业规划的过于集中和不均衡导致的气候异常。交通部办公楼今晚只有铁路司的办公室的灯是亮的，许多人因为昨天的大雨告假而没有来上班，就连交通部长本人也仅仅在今早到办公大楼巡视了一下。塔兹米的秘书刚刚从大门走入，身上的雨衣被大颗的雨水打得皱皱巴巴，高筒的雨靴也未能防住水，每一步走起来都像是在水洼中一样。\n\n“处长？您找我？”尽管秘书牢骚满腹，但他仍然在打开门的瞬间显现出殷切和勤勉的神情。\n“你把这批货车的优先级提到最前，这是刚刚下给我的命令，你立刻去安排，清空这个时间段的德里火车站，全部的轨道都给这批货车班次使用。”塔兹米的神色一如往常般保持着在军伍中的严肃，只不过近日来，他似乎又多了一丝焦虑和紧张。\n\n秘书接过排版单，一辆从加尔各答开往德里的货车？秘书心中打鼓。加尔各答军区设立以来，鲜有往外运输货物的先例，要么就是德里送往加尔各答的军粮或是武器，反过来的可简直是太少见了。\n“这是国防部刚刚发来的调令，”塔兹米看出了秘书的顾虑，“加尔各答军区的粮食上个月算多了，要把这部分多余的军粮变成赈济粮发往边区，字我已经签了，部长早上已经同意了。\n\n见到上司如此确定，秘书不敢再多话，他确认了一遍排班表上的签名，点了点头，就走出办公室准备让火车站执行最新的排班表了。毕竟，大人物之间的事情，他一个小小的秘书又管的上什么呢？"
  NRR.event.31.a: "小扳手拧开了大机器"

  NRR.event.32.t: "雨夜·突变"
  NRR.event.32.d: "今夜的大雨势头丝毫没有减弱的倾向，反而相比昨夜，闪电和雷声反而更多了，对于乡村地区的人而言，这可能会让庄稼里的害虫更少一些，但是对于德里城市的市民而言，那就是彻头彻尾的灾难了。\n晚八点的德里火车站职员格外的少，一是因为连续两天的暴雨让缺勤率奇高，二是因为交通部下来的排班表，今晚只有一趟来自外地，于深夜抵达的货车，据排班表上说，是一列满载粮食的货车，所以没有手忙脚乱的引导旅客流程，如此暴雨，装卸货物的工作至少也得等到明天才能开始，所以许多老油条便借机脚底抹油，早早下班离开，只有一个按照规定必须守在值班室的保卫科老头，和一个负责和货车司机交接工作，签署排版准点单的年轻职员。\n\n职员穿着厚厚的雨衣，躲在候车室的铁棚下，举着一盏煤油灯，抱怨着这鬼天气和他倒霉运，偏偏是他负责等这趟无关紧要的列车。突然，远处的黑幕出现了一丝亮光，随后是圆形的白色火车灯，和远处传来的汽笛声。职员喜出望外，这列货车居然出奇的准点到达，以往这种准点也只有某些高级别的列车和军列才能做到。他将签字单护在雨衣内，手举煤油灯示意列车停止，待其停稳后，职员走到货车中部的一届车厢，重重地敲了敲门。若是能早些签字，他也就不用受这等罪，可以早早回家休息了。\n这样的大雨，粮食会发霉吗？在沉重的货车车门拉开时，职员心中不禁浮现这种念头，但当货车车门被完全拉开，职员一览无余地看到车厢内的光景时，这等思绪立刻烟消云散。\n\n因为他没有看见粮食，一粒也没有。"
  NRR.event.32.a: "这是一列满载着士兵的车厢"

  NRR.event.33.t: "无线电广播·惊雷"
  NRR.event.33.d: "“观众朋友们，时间即将来到午夜十二点，在节目的最后，我们通过一首古典乐，作为陪伴您结束今天的伴奏……”\n“您即将听到的这首是来自欧洲奥地利作曲家，施特劳斯所谱的《蝙蝠序曲》，它是——”\n\n（无线电滋扰声）\n\n“恒河国家广播，恒河国家广播，紧急调频237.5，向你播报——”\n“就在刚刚，德里发生紧急情况，德里发生紧急情况，恒河国家广播下发国防部最新指令，宣布德里进入戒严，级别为全面戒严，请听到广播的恒河公民，不要前往德里，正在德里的公民，请不要外出，不要——”\n\n（无线电中断的声音）\n根据无线电广播的记录，大约在三十分钟后，恒河无线电才终于从全频段杂音恢复，许多因紧急广播而无法入睡的人在等到无线电恢复的第一时间，得到了新的广播通知：\n\n“这里是恒河国家广播，恒河国家广播，紧急调频237.5，向你播报——”\n“戒严令已经被撤销，重复，戒严令已经被撤销，刚才的戒严令已经被最高国家重建委员会宣布无效，重复，刚才的戒严令已经被最高国家重建委员会宣布无效。”\n“最高国家重建委员会宣布，鉴于目前国家的形势，委员会有必要暂时中止国民议会的职能与解散本届政府，新的安排将于后续作出……”\n\n一道闪电划过天幕，随即便是一声惊雷。"
  NRR.event.33.a: "“请所有公民，恢复正常生活”"

  NRR.event.34.t: "晨曦·变革"
  NRR.event.34.d: "连续两天三夜的雨在凌晨六点终于彻底停了，德里的天蒙蒙的亮，一辆政府用车缓缓行驶在无人的街道，昔日的商店如今门头紧闭，人们躲在窗户下和床底，静待新的变化到来。车最终在德里的拉西纳山缓缓停下，那儿坐落着过去旧帝国的摄政大臣，奥内斯特的豪华私邸，自革命胜利，奥内斯特被处死后，这里经过简易重修，称为了共和国的总统官邸。\n侧门打开，现任共和国总统，娜洁希坦移步下车，总统府邸的警卫、看守早已被更换成加尔各答军区，亦或者说，狩人军团的精锐。“艾斯德斯将军正在等您，总统阁下，”副官威尔敬了一个标准的军礼，周围士兵持枪肃立。\n\n至少，这群混蛋的军姿确实站得比那些守卫标准。娜洁希坦想着，走进了总统府邸。\n\n往日只需十分钟便能走完的楼梯和走廊，在今日却变得格外漫长。娜洁希坦回顾着自己的执政生涯。到底是哪一步走错了？或许，就在她为了促成谈判成功，而放任合作派做大的那一刻，她就已经走错了，接下来的一步步只不过是深渊中的踱步罢了。她如是想着。\n她的办公室就在眼前，威尔站在她身后，为了给这位总统最后的一丝体面，他没有帮她开门。娜洁希坦轻轻叹了一口气后，拧开了办公室大门的把手。\n\n装潢陈设如故，而人却不如往昔，对于娜洁希坦而言，意料中事参半，意料之外参半，前者便是她的老朋友、她的老对手——艾斯德斯——背身而对，正望着窗外的德里。\n而后者，便是坐在办公室座位上，直视着她眼眸之人。"
  NRR.event.34.a: "她的老部下，塔兹米"

  NRR.event.35.t: "日出·新朋友，新对手"
  NRR.event.35.d: "“也许我们当初就不该相信你带回来的提议…”娜洁希坦坐在过去待客的沙发上，平静地注视着眼前的二人，“塔兹米，我需要一个理由。”\n“你猜错了，娜洁，”艾斯德斯一如既往地保持常胜将军的姿态，“我不是今晚的主角。”\n“那么我就更加需要一个理由。”\n\n沉默在办公室蔓延，两分钟后，塔兹米打破了沉默，他拿着一张列车货物清单，走到娜洁希坦的面前。\n\n《XX月第4批普通C种货物清单》\n\n“我在铁路司的几个月，这样的清单，我能见到一百份以上。”塔兹米淡淡地说着。\n沉默，还是沉默，只有娜洁希坦翻看清单的纸张翻动声，和她点烟的声音。\n\n“休息一会吧，老大，”约莫二十分钟后，塔兹米看着放下清单的娜洁希坦，“我知道你已经尽力了。”\n\n又是五分钟的无言。\n\n娜洁希坦吸完了烟盒中的最后一支烟，吐出一口长长的尾烟，她最后环顾这间办公室，随后，坐到了她往常坐着的办公椅上，用她常用的钢笔，在办公桌上躺着的辞职令上，签上了她的名字。\n\n“希望你们是对的。”娜洁希坦盖上笔盖，头也不回地走出了办公室。"
  NRR.event.35.a: "因为她除了希望也已经别无他法"

  NRR.event.36.t: "尾声：恒河·大事记"
  NRR.event.36.d: "1950年，娜洁希坦宣布退出政坛，不再参与民主共和党的一切事物，告别演讲全国直播。\n1951年，民主共和党再度胜选，拉伯克成为恒河共和国第二任总统。\n1952年，国民议会提议授予娜洁希坦“荣誉议员”称号，被娜洁希坦拒绝；同年秋，国民议会再次通过该决议，再次被娜洁希坦拒绝。\n1954年，恒河共和国发表《半岛宣言》，提议以联邦方式实现半岛统一，与黄金国的谈判统一进程正式开始。\n1959年，结婚十周年的塔兹米与玛茵在喜马拉雅山脉下的大吉岭补办了婚礼，前夜袭组织的成员都参加了婚礼，据传娜洁希坦亦在出席人员之列。\n1961年，赤瞳因诅咒不治病逝，娜洁希坦及前夜袭组织成员为其主持葬礼，其被葬于喜马拉雅山脉下一处烈士公墓。\n1964年，半岛统一谈判取得成功，恒河共和国与黄金国成立恒河联邦。\n1968年，恒河联邦宣布具备核武器研制能力，并已于南印度洋成功实验。\n1970年，恒河联邦与圣杯王国展开主权领土谈判，最终以恒河联邦加入世贸为条件，承认了恒河对魔防队所辖行政领域、圣杯租界及斯里兰卡岛之主权。\n1972年，娜洁希坦病逝，恒河联邦为她举行了国葬，葬于喜马拉雅山脉的烈士公墓；同年，联邦议会第三次通过决议，授予了她生前一直拒绝的“荣誉议员“称号。\n1977年，交接过渡期结束，恒河联邦对整个半岛恢复行使主权，宣布半岛的完全统一。\n1979年，中东爆发战争，圣杯王国、苏联等各方势力干涉其中，世界面临再次爆发大战的危险。\n1980年，恒河联邦发表《告兄弟国宣言》，呼吁世界的所有中小国家团结起来，为反对战争、反对饥荒、反对殖民主义而斗争。同年，由恒河联邦主导的“南方世界”论坛成立，主题是促进中小国家的经济合作与政治独立。\n1982年，塔兹米寿终正寝，同年，玛茵开始撰写夜袭组织回忆录。\n1991年，恒河联邦GDP超越圣杯王国，成为世界第四大经济体\n1992年，玛茵撰写，内含大量解密文件与娜洁希坦等人日记的《夜袭组织回忆录》出版，彼时全国才知道在革命时期存在着这样一个秘密的机动组织。年末，玛茵病逝。\n\n当21世纪的第一次日出来临之时，恒河已经作为无可争议的经济大国与多极格局的一端，屹立于世，各国专家分析其将于21世纪的第一个十年超越计划经济的苏联，成为第三大经济体。"
  NRR.event.36.a: "皆是后话"




  NRR.event.40.t: "审判"
  NRR.event.40.d: "审理机关：恒河德里国家高级法院\n\n公诉人：恒河德里市检察院\n\nA被告人XXXX·XXX，男，1896年9月17日出生于马德拉斯市，中学文化，原交通部长，因涉嫌犯走私罪、贪污罪、受贿罪、挪用公款罪于1941年4月24日被讯问，同年6月14日被刑事拘留，同月26日被逮捕。现羁押于德里第一看守所。\n\n恒河德里市检察院以德里〔1942〕015号起诉书指控A被告人犯受贿罪，于1941年2月12日向本院提起公诉。本院依法适用普通程序公开开庭审理了本案。A被告人、B被告人及其辩护人到庭参加诉讼。现已审理终结。\n\n经审理查明，自曼德勒革命根据地时期起，A被告人利用其在革命军后勤部职务之便，伙同他人侵吞国家公共财物、虚报物资数目，对抗军队监察部门审查，多次向有关人员行贿。侵吞、骗取公款共计76万圣杯盾；利用国家交通系统组织走私黄金、白银等贵重物品及珠宝、名贵衣物等奢侈品，共计2963万圣杯盾。\n上述各证据之间能够相互印证，形成了完整的证据锁链，对上述证据的真实性、合法性、关联性和证明力本院均予以确认，作为本案的定案依据。\n\n本院认为，A被告人身为国家工作人员，与他人合谋，利用职务上的便利，侵吞、窃取、骗取公共财物76万元，数额巨大；利用国家交通网络，伙同他人组织大额货物走私2963万圣杯盾，其行为触犯了《恒河共和国刑法》构成走私罪、贪污罪、受贿罪、挪用公款罪。公诉机关指控A被告人犯走私罪、贪污罪、受贿罪、挪用公款罪事实清楚，证据确实、充分，适用法律正确，本院予以支持。\n\n综上，为维护国家工作人员职务行为的廉洁性以及国家的廉政建设制度，保护公私财产所有权，本院结合A被告人犯罪的事实、犯罪的性质、情节和悔罪表现、社会的危害程度以及辩护人的辩护意见进行综合考量，经审判委员会讨论决定，依照《恒河共和国刑法》、《恒河共和国刑事诉讼法》判决如下：\nA被告人犯走私罪、贪污罪、受贿罪、挪用公款罪，判处无期徒刑，终身监禁，不得减刑、假释，并处没收全部财产，剥夺选举权、被选举权、自由出版权十五年。\n\n如不服本判决，可在接到判决书的第二日起十日内，通过本院或者直接向恒河最高法院提出上诉。书面上诉的，应当提交上诉状正本一份，副本二份。"
  NRR.event.40.a: "感谢交通部的某位司长提供的情报"

  NRR.event.41.t: "开小差"
  NRR.event.41.d: "批完了最后一份关于加尔各答港区的工业园建设文件，娜洁希坦靠坐在办公椅上，看向对面墙壁那张崭新的世界地图，恒河共和国的法理疆域在民主共和党的主导下，被定为“南亚次大陆全境”，并将其写入了后续即将在国民大会提出的《半岛统一和平过渡宣言》当中。\n\n圣杯确实是个难缠的对手，尤其是在租界和谈判统一问题上。娜洁希坦从没有将其寄托于国际舆论的压力或者某种他人慷慨的“良心”上。恒河想要实现真正的自主话语权，首先就得证明世界离不开恒河共和国，这也是娜洁希坦目前精心策划的头一等的规划项目。世界大战已经无法避免，这是民主共和党的内部共识，欧洲、美洲，包括东边的东北亚地区，战火很快就会在世界范围内蔓延。娜洁希坦无意让刚刚从战火中走出的共和国投入另一场浩劫当中。但这并不代表她对此毫无准备。赤瞳作为军队体系改革的主导者得到了民共党的一致支持；同时，各地港区的建设将和内地的工业腹地相衔接。依托极可能爆发的大规模战争和随之而来的大量来自海外的工业品需求，处于中立一端的恒河将以此为契机完成向工业国的转变，源源不断的外汇将投入恒河需要的方方面面。\n\n邻国地缘同样重要。娜洁希坦拿起一份昨天批准的前往黄金国的使团名单的回文。那股自称“黄金国”的武装力量的领导人似乎不存在任何领土主权的主张，甚至他们此前进军的目的也同样令人费解。但这起码不是一个坏开局，比起半岛中南部的广大故土，些许代价不值一提。\n\n问题很多、麻烦很多、计划很多。她看了看桌边日程表中今日行程的最后一栏“出席一场德里城市公园的奠基仪式”。些许的思索后，娜洁希坦拿出钢笔，将这一行划掉。随后拿出抽屉里一瓶上个月刚买来的威士忌，拧开瓶盖。\n\n至少今天的计划是他妈的来上一杯，然后好好补个午觉，娜洁希坦想着。"
  NRR.event.41.a: "小小的违规，但也不坏"

  NRR.event.42.t: "天气预报"
  NRR.event.42.d: "今天的德里灰蒙蒙的，看样子此前预报的暴雨即将来临"
  NRR.event.42.a: "希望一切平安"
  NRR.event.42.b: "希望一切平安"

  NRR.event.43.t: "香烟工厂？"
  NRR.event.43.d: "今天到来一位举止奇异的访客，她穿着随意，同时，咳咳咳，总是烟不离手，根据她头上的兽耳来看，她应当是从非洲的某个国家来到恒河。\n\n这位自称尼古喵喵的兽耳人说她是搭载一块浮板从印度洋飘过来的（这让我们感到非常可疑，但无从查证）。据她所说，她对于香烟非常痴迷，同时对于如何种植、生产、销售香烟非常有心得，只要，咳咳咳，我们能够给她一些小小的支持，她有信心很快搭建起一套香烟生产体系，并大量增加我国的财政收入。"
  NRR.event.43.a: "听起来还挺划算的"
  NRR.event.43.b: "到底什么烟能这么好抽？给我来一根"
  NRR.event.43.c: "办公室禁止吸烟！"

  NRR.event.44.t: "国家重建委员会宣言（节选一）"
  NRR.event.44.d: "国家重建委员会告恒河共和国全体公民：\n\n恒河共和国自成立之日起，就应当，也必然是一个伟大的国家，它建成在千百年君主统治的废墟之上，共和国的地基是由无数奴隶、农奴、民主斗士和革命烈士的鲜血与尸体组成的。这片饱经风霜的土地，在腐败的统治者们制造了无数的尸山血海后，终于因革命者数十年的不懈奋斗而终得解放。\n\n我们在期待和欢喜中见证了共和国第一届政府的成立，人民本应认为，这届政府将是引领国家走向新时代的起点，是走向富足与彻底独立统一的开始。但是我们看到了什么？本应运送救济粮的火车，被腐败的官僚拿来运送自己的奢侈品和黄金；受到人们推举的议员们，公然接受不法商人的宴请；许多恶贯满盈的罪犯，摇身一变成为了共和国身份显赫的委员、会长、甚至是参议员。\n\n我们的忍耐已经到达了尽头，如果我们的共和国终有一日会被灭亡，那么我们至少不应让它死在腐烂的污泥和堕落的秩序当中，一个因战斗而崛起的国家，绝不应当因和平而腐朽。\n\n因此，在共同的意志下，最高国家重建委员会被组建起来，以应对这一绝无仅有且十分危急的情况……"
  NRR.event.44.a: "注：调是不是起的有点高了？\n答：一点也不"

  NRR.event.45.t: "国家重建委员会宣言（节选二）"
  NRR.event.45.d: "最高国家重建委员会的纲领和目标是明确的。\n\n重建委员会从未企图成为国家的最高权力机关，重建委员会将始终拥护国民大会作为恒河最高权力机关的地位不受侵犯和篡改。但重建委员会认为，当今混乱的选举与肮脏的地下交易正在摧毁我们国家自革命时期以来便拥护的纯粹的理念——一个人人平等，为自由，为独立的伟大的民众之国。\n\n我们的官僚系统未能纠正帝国时代的臃肿混乱，反而披着共和国的外衣大行其道，贪腐与低效并肩而行；\n我们的教育系统承接了殖民者带来的自相矛盾，肮脏的封建余毒和无头苍蝇般的自由冒进混杂在体制纷杂的国立与民营学校之间；\n我们的党派秩序并没有比帝国的虚假议会好上太多，尾大不掉的执政党和勾心斗角的在野党如同相互撕咬的疯狗，只要是其一党，不论罪与非罪都百般庇护；只要非其一党，不论贤与非贤皆百般攻击；\n我们的经济群龙无首，大量的税收浪费在中央和地方之间的流转和停滞中，国家财政陷入各色行业的补助与控制无法脱身；\n我们的民生停滞不前，饥荒、疾病仍在广大的乡村蔓延，城市人群之间的不均衡已经到了一个令人发指的程度。\n\n上述人们无法忍受的情况，将是重建委员会整肃国家、重建国家的基本方针、宗旨和目标……"
  NRR.event.45.a: "注：我还是觉得措辞太过犀利\n答：要的就是力量感"

  NRR.event.46.t: "国家重建委员会宣言（节选三）"
  NRR.event.46.d: "作为一切重建的开始，重建委员会将解散并无限期中止参议院的运作，所有参议员在没有得到重建委员会或法院的明确通知之前，不得进入国会、不得出席任何政治活动。\n\n结合前任政府成立以来的一系列失败和挫折，重建委员会认为，参议院成为了犯罪的保护伞，它未能发挥修正案的提出者所说的“尽到一个立法机关应有的审慎姿态，稳定的推进国家的进步”，情况恰恰相反，它在频繁地干预政府所作出的一切改善政局、改革体制的措施，参议院已经沦为反对共和理念和民主精神的阻挠者们的天堂。\n\n基于此，国家重建委员会将通过特别程序，提交国民大会再次审查此前关于设立参议院的修正案的合法性，在国民大会作出决议之前，参议院的运作将被中止，以停止他们对国家立法活动和改革重建的破坏性行为。\n\n重建委员会注意到，在第一届参议院的参议员推举名单中存在重大问题。一些正在被审查其政治立场的，态度不明的前帝国支持者未经国民大会特别审核便进入了名单，并以此为由终止了对他们的政治审查，使得许多极有可能被定罪的人获得了参议员特赦。\n\n同时，仅凭借公开媒体等途径，我们发现了某些参议员大量的针对共和制度的怀疑和针砭，并间接地为君主制张目，许多都采用研究圣杯王国制度的方式，含沙射影地对共和制提出不符合实际情况，和恒河历史事实的敌视论断。\n\n重建委员会认为，这毫无疑问是叛国行为，这不仅仅违反了议员应尽到的义务，更违反了作为一名公民应尽到的义务。\n\n鉴于此，重建委员会将采取特别措施。"
  NRR.event.46.a: "注：这倒是真的\n答：有时候充满力量感的措辞并非仅是夸张"

  NRR.event.47.t: "今夜无人入睡"
  NRR.event.47.d: "是夜，德里300公里外，瓜廖尔，恒河共和军首都团第四炮兵营驻地。\n\n“要德里指挥部。”玛茵在营部驻地帐篷里来回踱步，今晚的德里总部没有按时发来次日的安全代号，这让她感到一丝不安。\n“要不通。”通讯兵反复插拔电台的各个通路接口，向各个通讯线路发送相同的密文。\n“要不通就接着要！一直到通为止！”平时开朗的炮兵中校罕见地冲着下属发起了火，把站在一旁的通讯连长吓了一跳。\n\n数台电报机的密集敲击声继续响起，一脸严肃的营参谋打开门走了进来。\n“驻地阿格拉的一营刚刚来人传来口信，德里城内有枪声，”参谋低声将最新情报告诉给这支炮兵营的指挥官，“这份情报的真假无法判断，但是一营说从德里跑过来的人说看到了加尔各答军区的人。”\n“什么？”玛茵一时无法理解这突如其来的流言，“你是说，狩人军团的人在德里？”\n“真假不明。”参谋点了点头。\n\n玛茵快步来到指挥所中央铺着地图的指挥桌上。瓜廖尔距离德里，乘坐火车只要半天的路程，即使算上重炮渡河的时间，一天的时间足以到达。\n\n“通知全营，现在起实行战时体制，一连二连先行出发，三连整备炮械，最后出发。”短暂的思索让这位年轻的老兵作出了下意识的指挥决定。\n“我们还没有拿到国防部的命令，这样的调动也会引起河对岸友军的误会……”参谋开始紧张起来，他意识到长官并不是在询问他的意见，而是直接的命令。\n“赤瞳总长在卡拉奇视察边防，她得到情报的速度只会比我们更慢，德里的指挥部一直要不通，一切责任我来承担，现在，执行命令。”\n\n参谋点了点头，就在这时，一名坐在电报机的通讯兵猛地站了起来。\n\n“营长，德里方面有回电了！”\n玛茵和参谋的身形一时顿住。\n“念。”\n\n通讯兵拿着眼前的电文纸，他顿时有点疑惑，但是出于服从命令的本能，他迅速念出了电文原文：\n“国家…国家重建委员会…告恒河共和国全体公民……”\n\n惊喜抑或是惊吓接踵而来，指挥所的内线电话突然响了起来，参谋熟练地接起电话。\n“这里是首都团炮营，报出你部的番号。”\n指挥所的沉默持续了几秒钟，参谋头上沁出难以察觉的细汗，并将话筒递给了玛茵。\n“营长，对面的人要求找你”"
  NRR.event.47.a: "“他说，他是你的朋友”"

  NRR.event.48.t: "公无渡河，公竟渡河"
  NRR.event.48.d: "拉西纳山，总统府邸，一楼会客室。\n\n“根据你之前通话的要求，我方允许你携带武器进来。”狩人军团的副手威尔伫立在会客室内的墙边，注视着玛茵腰间的佩枪。\n“所以我来了。”站在门口的玛茵直直地盯着坐在桌后，与她面对面的，她的夜袭团后辈、她的战友、她的友人，塔兹米。\n“现在你还有什么要求吗？”\n“我现在的要求是你给我滚出去，军团的杂碎。”玛茵冷眼一瞥威尔，手瞬间摸到了枪把上。威尔看向塔兹米，在塔兹米微微点了点头后，叹了口气，侧身直接从玛茵身旁走出会客室，随手带上了门。\n\n短暂的沉默。\n\n塔兹米起身走出办公桌，对上了玛茵的眼神，但对方的眼神让他意识到今天上演的并不是一出老友重逢的戏码。\n“不如我们坐下谈吧。”塔兹米停下了脚步，指了指二人旁边的会客用沙发。\n“老大现在在哪里？”玛茵的神色没有变化。\n“在她自己的家里，没有人监禁她。”\n\n“所以我该怎么称呼你，或者说，怎么称呼您？”握枪的手愈发颤抖，似要将枪把捏碎，“交通大臣？狩人军团的新团长？还是新帝国的皇帝？”\n“我只是塔兹米，仅此而已。”老友平静地看着她。\n“你不是他！不！你不是他！我认识的塔兹米不会和这些畜生混在一起！”怒气、苦恼和悲伤让玛茵无法再控制自己，“在我见到你之前，我设想过无数的情况，我猜你被狩人军团绑架给我打了这通电话，我猜是艾斯德斯的阴谋，我猜是旧帝国份子的动乱，我想过无数的情况，我甚至想用我自己来交换你出去！”\n\n“我从没有想过是你……”突然的歇斯底里和巨大的打击抽干了中校的力量，她力竭地跪在地上，泪水浸湿了地毯。\n\n也许现在并不是一个适合拥抱的场合，塔兹米想着，缓缓伸出双手按住玛茵颤抖的肩头。\n\n玛茵没有推开它们。"
  NRR.event.48.a: "那把枪里其实只有一发子弹，那是留给她自己的"

  NRR.event.49.t: "渡河而死，当奈公何"
  NRR.event.49.d: "接下来的两个小时，塔兹米毫无保留地给玛茵讲了很多。\n\n从革命时期他那次被俘，再到艾斯德斯提出的诡异的交易，到共和国的建立，到他们分道扬镳后，在交通部见到的一切。\n\n他看到的，听到的，想到的。\n过去、现在、将来。\n\n宴会、美酒、珠宝。\n在那座囚禁、折磨伊耶亚斯和莎悠的贵族府邸里依然如故。\n\n富态的人，饥饿的人，贪婪的人，失望的人。\n一个个人变成了数字，在他阅过的无数文件中。\n\n腐烂、腐烂、腐烂。\n他两位惨死的同乡在梦中看着他，两张脸不断腐烂、脱皮，直到变成他们死前的样子。\n\n玛茵全程没有说话，她静静地听着一切。\n\n“所以，我做了这一切，”宛如走马灯的回忆让塔兹米的语气始终平淡，没有过多的起伏，“我不知道除了这种办法，还能如何来弥补这一切。我很后悔那天将艾斯德斯的事情告诉老大，我曾经以为这只是她企图改旗易帜的话术，我从没有想到会变成今天这个样子，如果，如果我们当时战斗到底的话……”\n\n塔兹米意识到这是毫无意义的后悔，他停止了懊悔。\n“所以我必须抓住这次机会，我需要你的帮助，玛茵，我已经走出这一步，我必须补救这一切，我从不怜惜我的名誉，乃至我的生命。这就是我要说的所有话。”\n\n玛茵的眼睛的红肿已然消退。\n“我…我不知道…我需要回趟家……”许久，玛茵望着地毯，缓缓说出这句话，长时间的坐姿让她的身体僵硬，她以一种不协调的方式站了起来，往门口走去。\n\n“我等你的电话。”\n在玛茵开门的那一刻，塔兹米望着她的背影，淡淡地说着。\n“嗯。”\n门被轻轻地关上。"
  NRR.event.49.a: "那一天，塔兹米一个人在会客室呆着，直到第二天天亮"

  NRR.event.50.t: "扔骰子"
  NRR.event.50.d: "清脆的鼓掌声在拉西纳山二楼的办公室响起。\n\n“了不起，了不起，不愧是我中意的人，”艾斯德斯惬意地坐在办公椅上转着圈，“我还以为马上就要和首都团的打一仗呢，没想到你打个电话就解决了，我还指望和首都团在阿格拉真刀真枪地来一场呢……你是怎么做到的？”\n\n“这是我的私事。”站在窗边的塔兹米望着窗外的朝阳，不愿意将这个话题进行下去。\n\n“所以，你是要留在这里？”太阳刚刚升起发出的刺眼阳光让他恍惚了一阵，不经意间问出了他最关心的话题，“如果是的话，新政府将会给你留出一个你希望的位置。”\n\n如果艾斯德斯留在德里，希望直接干预中枢系统，她和她的军队诚然是个麻烦，但这成功创造出了她和加尔各答军区之间的空隙。她和留驻在德里的少量军队不会是共和军的对手，而她不在的加尔各答老巢也可以寻找机会慢慢击破……\n\n“不，我会回军区。”\n令人意外的回答。塔兹米看向艾斯德斯，他一时无法猜到艾斯德斯的意图。\n\n“不仅是我，这次我带来的一个营的部队也会随我回去，”艾斯德斯将双腿翘在办公桌上，脸上依旧是冰山美人般的微笑，“万幸这次只死了几个不长眼的倒霉蛋，即使追究具体的责任，我想这次我也能全身而退。”\n\n“为什么？”\n“这不是理所当然的嘛，”艾斯德斯疑惑地看着塔兹米，“因为你的老朋友们都不喜欢我嘛，而且我相信这个国家的大多数人也不希望在这里看到我……”\n“啊……我明白了，”艾斯德斯仿佛后知后觉地意识到塔兹米真正的问题，脸上的笑容变得愈发意味深长，“你是在问，我为什么还没有挑选我心怡的对价……”\n\n塔兹米没有接话，这场交易最终来到了结算的阶段，塔兹米得到了他想要的，但他还不知道艾斯德斯的真正目的。\n“一个在这里的位置？呵呵，别开玩笑了，我的力量难道还需要这样无关紧要的东西来证明吗，我真正想要的是……”\n\n就在此时，不合时宜的电话响了起来，打断了真正野心的浮现进程。\n“哼，比我更坐不住的家伙来了，你先聊。”艾斯德斯嘲笑般地作出一个“请”的手势。"
  NRR.event.50.a: "赌徒等着揭开盖子的那一刻，即使那一刻他便会输光"

  NRR.event.51.t: "二子乘舟，泛泛其景"
  NRR.event.51.d: "拉西纳山，总统府邸，二楼办公室。\n\n敲门声响起。\n“请进。”塔兹米站起身，昨天玛茵打来电话，她今天会来。\n\n门被打开，玛茵不再像上次那样穿着军装，而是她那套喜欢的常服，在过去的岁月里，作为夜戏团成员，她常常穿着这套衣服参加各种潜伏敌后和作战任务。\n\n“我……”二人同时开口，又同时默契地收声。也许是上次见面后，他们各自装着想说的话希望尽快的告诉对方，也有可能仅是二人共同的尴尬让这次谈话的开端莫名其妙地中断。最终，塔兹米抬了抬手，示意让玛茵先说。\n\n“我…我想过了，”站在塔兹米面前的玛茵仍会偶尔躲闪目光，但是比起上次，她内心的决心更加坚定，“老大现在已经不可能再出面，上一届政府的很多人因为你的这次举动，也不会再进入政府。”\n“现在军队内部也是一片混乱，主张与你敌对的和主张按兵不动静待变化的两拨人谁也没能占据主导，”玛茵捏紧了衣角，“幸亏在赤瞳的命令下，共和军暂时还不会采取什么措施，但留给你的时间不多了。”\n\n“换…换而言之，”这次，玛茵的双眼对上了塔兹米的眼睛，“你不仅会邀请我，你也只能通过邀请我，才可以在组织政府的同时拉拢军方…”\n\n漂亮的反击。塔兹米一时找不到回答的话语，尽管那时候他并未想到那么多，但是玛茵所说的内容也确实是他无法反驳的主张。\n\n“所以我来了，”玛茵的语气不容辩驳，“如果你真的放不下这个国家的命运，那如你一样，我也无法放下你。我绝不能看着我的战友、我的后辈、我的朋友走向不归之路。我也必须时刻看住你，只要你表现出一点点和你的诺言相违背的事情，那我就要制止你……嘿！你干什么啦！”\n\n没等玛茵把话说完，塔兹米一步上来将玛茵紧紧抱在怀里。\n“谢谢你，玛茵，谢谢你……”"
  NRR.event.51.a: "愿言思子，中心养养"

  NRR.event.52.t: "讷言的盟友"
  NRR.event.52.d: "拉西纳山，总统府邸，二楼办公室。\n电话铃突然响起，塔兹米下意识地拿起话筒。\n\n“请讲。”\n“我是赤瞳，”话筒另一头传来老友熟悉的声音，“是塔兹米吗？”\n“是我。”\n\n“初步的情况我从国防部和玛茵那里得到了差异巨大的两份情报，所以我选择直接打电话来问你，”赤瞳的言辞依旧简短直接，“老大和德里政府的人都怎么样了，自从联络被切断后，我无法判断首都的具体情况。”\n\n“老大现在在自己的家里，没有危险，”塔兹米平静地回答着，“前任政府的人，除了一些人民党成员被监禁之外，其余人都回到了自己的家中。根据艾斯德斯给我的信息，德里城中只有零星交火，伤亡人数在二十人以内。”\n\n电话那头没有新的问题传来，也没有肯定的答复，塔兹米必须主动出击。\n\n“赤瞳，我想知道你的态度，或者说，共和军的态度。”\n又是一阵沉默，直到赤瞳的咳嗽声响起。\n\n“目前共和军知道大致全貌的只有我。国防部初步判断这是艾斯德斯主导的军事突袭，好吧，现在看来也确实是一场军事突袭，但至少不是全面战争，”赤瞳略微停顿了一下，“塔兹米，你的目的是什么，简短回答我，国防部留给我的时间也并不多。”\n\n“组建一个新政府，做到老大没能做到的事情。”\n\n又是沉默。\n\n“如果是这样，”赤瞳又咳嗽了一阵，“国防部会保持中立，但也仅仅是中立。同时，艾斯德斯的军队必须离开德里，这是底线。”\n“这一点我向你保证。”\n“那我就没有别的问题了，德里见。”\n\n电话被挂断。"
  NRR.event.52.a: "依旧那么可靠，那么寡言"

  NRR.event.53.t: "野心的对价"
  NRR.event.53.d: "拉西纳山，总统府邸，一楼会客室。\n艾斯德斯约定的撤军日期到了。\n\n“所以，”艾斯德斯一如既往的翘腿睨视，端起一杯尚温的大吉岭红茶一饮而尽，“赤瞳允许我安全离开？”\n“只要你如约离开，”塔兹米拿起茶壶往两人茶杯续茶水，“这是国防部给的底线，在此基础上，他们保证回程火车的安全。”\n\n“那我以后还能再来做客？”\n“只要你提前报备。”\n“那么我就没有别的问题了。”\n\n话语一时停顿，两人都默默饮尽杯中红茶，茶香在室内弥漫。\n\n“我有问题。”塔兹米放下茶杯，看向艾斯德斯。\n“你还没有告诉我你的价码。”\n\n与那天相同的，冷冷的微笑，出现在艾斯德斯的脸上。\n“这对你很重要吗？”“当然。”\n就如同彩票开奖前故作神秘的主持人一样，艾斯德斯缓缓放下茶杯，仰靠在真皮沙发上。\n“战争。我的条件是战争。”\n塔兹米吃惊地看着对方,斟茶的手险些没有拿稳。\n\n“不必这样看着我。赤瞳的军队不会明面反对你，但也肯定做不到服从你的所有指令。至于为什么会有战争嘛……就当是我一个热爱战争的人的预感罢了。总之，你会需要我们的帮助的……”艾斯德斯站起身来，往门口走去，“差不多了，我要去火车站了。”\n\n“……为什么你会喜欢战争？”\n艾斯德斯仿佛听到了一个很奇怪的问题，她转过身来，露出一幅愉悦的神情。\n“杀戮和鲜血，不正是最美妙之事吗？”"
  NRR.event.53.a: "魔鬼成功了第一次，她会成功第二次吗？"

  NRR.event.54.t: "GBC专访节目：与新恒河对话（节选）"
  NRR.event.54.d: "采访者为GBC国外特派员 丁布尔比。受访者为最高国家重建委员会主席 塔兹米。\n\n丁布尔比：塔兹米先生，恒河是否正在变为一个军阀独裁的专制国家？\n塔兹米：我无法理解你的问题。\n\n丁布尔比：这是众所周知的事情，你借助军队强行解散了前任民选政府，关闭了参议院，没有遵循法律就在国民大会通过了你主导的《国家重建法》。这难道不是一个独裁者才能做出来的事情吗？\n塔兹米：如果我们都能认同前任政府是一届由腐败、无能、黑金和内斗组成的政府，那么解散它，并弥补它所犯下的错误正是一个国家和爱国的民众应做和应支持的事情。\n\n丁布尔比：也许吧，前政府在某些事情上可能犯了错误。但是难道不能通过民主的程序做到这一点吗？你没有意识到你这样的政变者给这个国家的民主体制带来了沉重的不可治愈的伤痕吗？\n塔兹米：如果按照宪法，国民大会5年一选，按照修正案，国民参议院7年一选。按照你的说法，也许等到那些人在这五年七年间将国家腐蚀殆尽，再来改正他们的错误？\n\n丁布尔比：我并没有这么说，我只是认为一个国家应当温和地转变。\n塔兹米：我想这可能是我们不同国家之间的差异。恒河共和国是建立在革命的胜利之上的，我认为这样的一个伟大的国家，不应当容许我们上述谈到的事情长久地存在，这一点和你们圣杯人对腐败的豁达态度似乎确实有差异（两人的笑声）。同时，恒河也没有等待的余裕，我们必须立刻做出改变。\n\n丁布尔比：在你的口中，民主共和党政府似乎失败透顶。我接下来的问题是，难道你不会步其后尘吗？没有了民主系统的支持，你又该如何保证你的成功呢？\n塔兹米：我想我应当重申，国家重建委员会并不会成为常设机构，国民大会仍然是这个国家的至高者，重建委员会的法律也必须得到国会的通过，这一点我可以保证，当国家的弊病得到明显改善之际，重建委员会也就结束了它的任务。"
  NRR.event.54.a: "我想时间会告诉我们一切的，塔兹米先生"

  NRR.event.55.t: "三人密约（上）"
  NRR.event.55.d: "德里市区，午夜，某公寓。\n拉伯克戴着兜帽，按照约定的步骤，在公寓门口有节奏地敲了敲门，随后，他听见门内门锁被打开的声音。\n拉伯克打开门走进，并将门关上。此刻他才发现，除了邀请他的人之外，还有一位他未曾想到的客人。\n\n“赤瞳！？”拉伯克惊讶地看着现在的共和军最高长官坐在他的面前，根据他的消息，赤瞳现在应该在从西部返回德里的火车上，直到明天中午才会回到德里召开国防部紧急会议，“如果我的信息没错的话，你现在应该在火车上…？”\n“昨晚的火车需要时间补充煤，所以我换了辆军车开了回来，”赤瞳的脸上仍然有着日夜煎熬的缺乏休息的疲惫。她顿了顿，咳嗽了两声，看向这场密探的邀请人——玛茵，“玛茵，看来我们可以开始了。”\n\n玛茵点了点头，从口袋中拿起一封信交给拉伯克：“我前段时间偷偷去见了老大，她给了我一份名单，上面写着对国家和政府最为忠心可靠的一批人。你是我们当中唯一在民共党的人，你看看现在他们是否有用？”\n拉伯克还沉浸在刚刚的惊讶中，他快速地浏览名单，确实是娜洁希坦的字迹，上面的人也几乎是当初前任政府中坚持改革和推动“除鼠计划”的赞成者。\n\n“是的，名单上的人几乎都是可靠的人选，”拉伯克将信件交还给玛茵，“但是我还是不明白……？”\n\n“我已经和塔兹米见过面了，目前可以确认的是，塔兹米没有加入狩人军团，这是一场他自主的行动，但是获得了艾斯德斯的支持，艾斯德斯的动机尚不明，”玛茵看向赤瞳，赤瞳默默地点了点头，“所以我们要行动起来。我认为塔兹米没有我们想象中的‘变了’，但他的情绪和想法很不稳定，仅凭借我一个人的力量，我不能保证能劝住他的某些想法。“"
  NRR.event.55.a: "疑惑、疑云、疑点"

  NRR.event.56.t: "三人密约（下）"
  NRR.event.56.d: "“你能确定你的观点是正确的吗…“赤瞳依然保持冷静，丝毫没有因为分析对象是她的老友而产生动摇，“国防部至今都无法摸清他和艾斯德斯是如何保持紧密联系的…”\n“如今我们也很难确保他的所谓‘重建’会不会走向另一种极端…“拉伯克咬着指甲低头思索。三人陷入沉思。变化过于剧烈的局势让所有人的头脑都很难保持绝对的理性，冷静也许仅仅是无法看清局势的犹豫伪装而成。\n\n“所以我需要你们的帮助，夜袭团的大家，“玛茵站起来，望向二人，“如果放任塔兹米独自决断，事态也许会更加无法挽救，但是我们可以阻止这发生。”\n“赤瞳，你是军方的代表，拉伯克，现在老大隐退之后，你是民共党名义上的代表。我们都能在不同的方向保证各方的大致稳定。”\n\n“共和军这边也是纷争不断，”赤瞳微微摇了摇头，“即使我能够保证不会出现哗变和公开抗命，但是我也很难强迫国防部内部会服从塔兹米那边发出的一切指令，毕竟，塔兹米并非是通过正常渠道组建的新政府，许多革命军时代的老成员不一定能认同他。”\n\n“这样的情况在民共党内部也是一样，”拉伯克抱着胳膊，“单单解散参议院这一件事，就已经和民共党的右翼彻底决裂了。鉴于塔兹米曾经和社会党的密切联系，民共党的左翼和中坚力量虽然支持改革，但是对于塔兹米的社会党立场持警惕的态度。总的来说，除非塔兹米确实能做出成绩，否则我的动员能力也很有限。”\n\n“至少我们应当试一试，”玛茵紧盯着二人，“事态已然无法回溯，但弥补错误的可能性还在。即使我们不是革命军的骨干，作为他的战友和朋友，我们也应当尽力争取不是吗？”\n\n两个人对视了一眼，几秒后，他们望向玛茵。"
  NRR.event.56.a: "“当然”"

  NRR.event.57.t: "开始工作"
  NRR.event.57.d: "德里市 国民大会 议会厅。\n\n“感谢议长，允许我在国民大会召开前进行一段简短的发言，”站在发言台后的塔兹米稍微欠了欠身，向议长和国民大会的议员们致意，“感谢各位能允许我发言。”\n\n“如今，我可以明确地告诉在座的诸位，和恒河的所有公民，”塔兹米清了清嗓子，“德里的秩序已经恢复如初，一切军事戒严已经被解除，加尔各答的军队已经于昨日离开，这一点已经得到了共和军和国防部的确认。”\n台下，受邀列席的陆军总长赤瞳不动神色，继续听着塔兹米的发言。\n\n“诸位，现在恒河已经到了不容踟蹰的关头！”塔兹米握紧拳头，“谁也无法想到，一个非法的宪法修正案，一届低效的政府，对我们的国家造成了如此沉重的恶果！”\n“在我的手边，就有着一叠记录着参议员们受贿、官僚走私和国库贪墨的证据，”塔兹米举起一叠文件又将它放下，厚重的撞击声在议会厅响起了一阵阵回声，“娜洁希坦总统是一位杰出的领袖和卓越的战士，但即使是这样优秀的领袖，也被这些腐蚀国家的蛀虫逼入无能为力的局面！”\n\n“现在，是时候做出改变了！”塔兹米尽力克制自己的声音，但难以完全压制颤抖的声音，“国家重建委员会在国会的授权下，将对恒河的各领域展开一系列有力的改革重整措施，确保我们的国家能够延续革命时期的光荣传统，和共和战士们不朽的建国精神！\n“不是明天，也不是哪一个计划中的日子，“塔兹米扫视议会的每一处，”就是现在，就是今天，重建工作已经开始！我以我的一切向恒河宣誓，我们将为恒河带来新生和希望，“\n\n“黎明将至，胜利在即！“\n\n坐在国会左侧的社会党掌声雷动，中间的民主共和党发出零星的掌声，右侧大量空座的人民党一片死寂。"
  NRR.event.57.a: "好戏开始了"

  NRR.event.58.t: "你好，再见"
  NRR.event.58.d: "德里火车站。\n\n作为加尔各答军队撤离的善后负责人，副官威尔是唯一一个还没有离开德里的人。他整了整自己的衣衫，等待着即将到来的驶向加尔各答的列车。\n\n“威尔上校。“\n一声呼唤让威尔停下了手中的动作，转过身，塔兹米正向他快步走来。\n“塔兹米先生，“威尔露出了礼貌的微笑，“何劳你亲自来送我？”\n“当然应该，”塔兹米笑了笑，“如果不是你在这次行动中确保加尔各答的士兵保持绝对的克制与冷静，恐怕我们都很难站在这里如此轻松的说话了。”\n\n短暂的寒暄结束，两人站在候车室，静静地等了一会。\n\n“威尔上校？”\n“请说。”\n“如果我记得没错的话，狩人军团和平改编之后，就是你实际主持了加尔各答的主要工作？”\n“哪里哪里，艾斯德斯元帅依然是军队的绝对领导，”威尔摇了摇头，“我只不过是辅助办理一些日常琐碎的行政工作罢了。”\n\n“这正是我想听到的消息。”\n“哦？”威尔略感意外地侧头看向塔兹米。\n“国家的重建工作，自然也包含加尔各答军区，”塔兹米看着铁轨轻微的震动，“如果可以的话，我希望和你保持良好的关系，即使我们曾经是敌人。”\n\n这是什么？有意的拉拢？威尔的军人思维使他警惕，但面前这个和他年纪相近的，又同为军人的客人让他莫名产生了些许的好感。\n“当然，塔兹米先生，”威尔依然保持礼貌，“作为地方，我自然会积极相应德里的号召，如果确实有利于这个国家，作为我个人而言，我当然愿意加尔各答与德里保持一致，只要……”\n\n尖锐的汽笛响起，火车匆匆驶来，在二人面前缓缓停下。\n“很好，祝你一路顺风，威尔上校。”“谢谢，塔兹米先生。”\n两人短暂握手，随后威尔踏上了归途。"
  NRR.event.58.a: "“只要你的努力能使我信服”"

  NRR.event.59.t: "加班夜"
  NRR.event.59.d: "拉西纳山，总统府邸，二楼办公室，二十时。\n\n“怀着难以自已的心情…”塔兹米咬着笔帽，桌前是一张只写了一行字不到的白色稿纸，这是他将要起草的一份重要的文件，但也许是紧张的神经尚未平复，又或者是昨晚的轻度失眠，让他一时难以想到合适的措辞来表达他的企图。\n\n这时，红茶的香味突然在办公室弥漫开来，一杯冒着热气的红茶放到了他的稿纸前方。\n\n“玛茵？哦，谢谢，”塔兹米接过茶杯抿了一口，脸上的神色放松了不少，“怎么还没有回家？我记得今天你那边的公文应该不多啊？”\n“没事，下午花了点时间给雷欧奈和切尔茜写信，刚刚才看完文件，”玛茵吹了吹热茶，走到塔兹米身边，“在写发言稿？”\n\n“不完全是，”塔兹米站起身伸了个懒腰，“上周我和南方的黄金国派来的代表谈了一会，他们对于加入恒河没有太多的异议。我想是时候开始南亚的统一，展现我们恒河在这个世界的新姿态了。”\n\n“这么轻松？”玛茵惊讶地看了一眼，“没有什么条件？”\n“有倒是有…”塔兹米思索了一阵，“但是奇怪的是没有我料想中的政治待遇或者区域特权，对方的统治者似乎对美食和养殖颇感兴趣，说是要承认他们‘探索美食和烹饪’的权利。”\n“真是个怪人…”“我也是这么想的。”\n\n“更南方的势力有什么回应？”玛茵望向办公室墙上挂着的南亚地图，望向半岛的最南端。\n“暂时还没有，”塔兹米同样看向地图，“也许等到我们接壤的那一刻，磋商才会正式开始，但是就目前他们的态度而言，对于完全加入估计持反对态度。”\n“所以我才苦恼于这份宣言的措辞，也许可以让很多对恒河持警惕态度的势力能稍有缓和……”\n\n玛茵看了一会稿纸。\n“怀着难以自已的心情…”玛茵喃喃地自语起来，顿了一会，“南亚的人民认为应当作出如下宣言，以表达…以表达南亚人民和一切追求进步与自由之人的立场和态度…”\n塔兹米眼前一亮。"
  NRR.event.59.a: "“好思路。“"

  NRR.event.60.t: "《曼德勒宣言》"
  NRR.event.60.d: "怀着难以自已的情感，南亚的人民认为应当作出如下宣言，以表达南亚人民和一切追求进步与自由之人的立场和态度：\n\n在漫长的历史中，南亚曾经享受过交流与和平的繁荣，但随着这一交流的频繁，随之而来的军事、经济的入侵与政治的干涉也愈发地威胁到南亚的稳定与统一。北方的游牧民族、和来自西方的宗教国家曾经长期地分裂、奴役南亚的土地和人民，给南亚带来了沉重的无法估量的损失和伤痛。\n在南亚驱赶了这些侵略者后，新的麻烦接踵而至。虽然在随后的历史中，南亚剥削者的腐朽统治是导致南亚人民陷入灾难的主要原因，但无可否认的是，来自更加遥远的西方殖民国家在其中起到了重要的推波助澜的作用，直至今日，他们仍然在试图将属于南亚人民的土地占为己有。\n\n在过去的百年以来，世界的所有被压迫的人民都在为寻求解放和自由而不懈探索着，南亚人民亦是如此，我们曾尝试在内部采取改良主义而逐渐各处弊病、曾试图学习西欧的理念而试图取得他们的认可、我们也曾试图用温和的方式逐步改善我们的国家。但上述依靠他人、照搬他人的尝试无一例外全部以失败告终。\n\n社会主义者们提出了很好的观点，但他们认为这一阶段的革命不适用于生产力与生产关系极其落后的农业国家、乃至奴隶制国家。北方苏联人的革命是值得敬佩的，但他们也只是将这一论断突破了一半。在我们的东方，也有一群人处于与我们相似的境地，也试图突破这一论断，我们衷心祝愿他们能取得成功。\n\n但南亚人民无法等待，难道为了等待这一理论的突破和被证实，南亚和世界上一切的落后地区就要继续忍受腐烂和无助吗？我们绝不能再忍受这一懦弱的观点。\n\n因此，我们在此郑重宣告，南亚人民将采取一切正当的、光荣的手段，为统一、繁荣和永久和平友好的世界而不懈努力。如果世界上还没有人能成功证明这一点，那就先在我们的土地和我们的海洋之上实现吧！我们呼吁所有致力于为解放、为自主的国家和人民，团结起来,人人皆兄弟姊妹！"
  NRR.event.60.a: "这个名字曾经被短暂使用过，如今它再次出世"

  NRR.event.61.t: "“饕餮“盛宴"
  NRR.event.61.d: "拉西纳山，总统府邸，一楼餐厅。\n\n“嗯…！嗯…！囔囔囔囔…!“\n照往常来说，在官邸举办的宴会往往都是觥筹交错和古典乐，以及没完没了的交谈声和致意声。但是今日的宴会显然与众不同，奇怪的来客在餐桌的一端大快朵颐，招待的主人和来客的随行者都一脸尴尬地看着进餐的“饕餮“。\n\n“嗯！请再来一碗，“嘴边全是咖喱酱的莱欧斯又吃完了一份，将空碗递给一旁的官邸秘书，”真是太好吃了，这种浓郁的咸度又不至于感到齁与腻，玛露希尔，卡布尔，你们也快吃啊！啊，谢谢你们的款待，这种味道的咖喱到底是怎么做到的？“\n\n“只是在一般的咖喱上多加了些黄油和椰浆改善了些口感，还有牛奶，”坐在塔兹米身旁的玛茵用餐巾擦了擦嘴，“洋葱和其他配菜也需要炒到焦糖化，这样才能在浓郁的同时增加甜味。”\n“哦！好主意！”得知了配方后的莱欧斯脸上浮现难以掩饰的惊讶。\n\n“咳咳。”\n坐在莱欧斯一侧的卡布尔清了清嗓子，示意开口发言。\n“塔兹米主席，玛茵委员，”卡布尔保持着作为外交使节和黄金国外长的冷静与克制，“此前我方的提案已经得到了双方的认可，借着这个机会，我希望和你们二位再次确认一遍。”\n\n“莱欧斯先生将会保留他的国王称号，当然，不具备实际意义；黄金国地下城将成为莱欧斯的私人财产受恒河共和国保护，”塔兹米简要地总结着黄金国的条件，“以及中部高原的约一千顷牧场作为莱欧斯先生名下的公司资产继续运营，黄金国的士兵将接受整编并受领原水平薪水，莱欧斯原王室成员将享有‘探险者’般的探索自由和烹饪研究自由，只要不违反军事管制和法律。”\n\n“我们全部接受这些条件。”玛茵点点头。\n“那么，我就没有更多要说的了，”卡布尔和玛露希尔站起身，高举酒杯，“为今夜干杯。”\n“谢谢你们。”作为主人的塔兹米与玛茵也站起身举杯致意，只有莱欧斯坐在位置上，将盘中美食吃进肚子。\n\n“再来一碗！”"
  NRR.event.61.a: "干杯（饭）！"

  NRR.event.62.t: "第二块拼图"
  NRR.event.62.d: "拉西纳山，总统府邸，三楼会议室。\n\n“现在，南亚统一面前的最后一个问题，魔防队，“会议室长桌的正中央摆着放大版的南亚地图，地图上，数十个颜色各异的兵旗插在各地，象征着多方的军队，”拉伯克，你觉得呢？“\n“马德拉斯和一众南方城市是民共党的起源地，我们之间的关系匪浅这是公认的，”拉伯克，“棘手的是，和她们关系匪浅的不止是我们，圣杯人的帮助是这一些城市在几十年前的灾变中能存活的重要助力，某种意义上而言，与其说是亲密，不如说是重度的依赖。”\n\n“有任何避免军事冲突和武力统一的可能性吗？”赤瞳面无表情地看着地图上的军旗。\n“以我和民共党内部人士的联系，开辟一条谈判通道不算困难，”拉伯克摸着下巴，“但是，能够预想的到，即使魔防队愿意开启谈判，她们也不会主动地提供条件，我们才是举牌的一方。”\n\n“我们的条件吗……”塔兹米思索了一阵，“玛茵，你觉得他们的底线是什么？”\n“应该是统一的南亚下的合众联邦制吧，”玛茵翻了翻关于魔防队的情报，“特区自治，保留军队，总之，他们现阶段想要一个国中之国。”\n\n“拉伯克？”\n\n“这一些条件符合我的预期，”拉伯克看了看手表，“民共党的内部成员也赞成缓慢地行政统一，对于武力统一的担忧除了对家乡城市的破坏外，还有未来对圣杯开展外交的不利开局的困扰，毕竟，他们不会高兴看到他们的长期支持者被我们单方面解决。”\n\n“但是无论如何，决定权在你，塔兹米。”"
  NRR.event.62.a: "我支持缓和现状，拉伯克，看你的了"
  NRR.event.62.b: "如果我们不迅速解决事态，圣杯的渗透就会更加深入！"

  NRR.event.63.t: "光荣和平"
  NRR.event.63.d: "拉西纳山，总统府邸，二楼办公室。\n\n“圣杯看来对于我们在魔防队的处理问题上很满意，关于归还租借地问题的态度也缓和了不少。”刚刚会见完圣杯大使的玛茵推门走进。\n\n“《蓝变红：恒河的下一战会是哪里？》，哎，评价确实‘挺高’，”塔兹米放下《泰晤士报》国际刊的头版，“看来在他们眼里只要不乖乖当殖民地那就是侵略者和土匪。”\n“那是自然，圣杯保守党的报纸能对我们有好话吗？”\n\n“《民主的谋杀者！圣杯在世界自由问题的退让！》，哪家的报纸都一样。”塔兹米叹了口气，指了指桌上已经被翻看过的《镜报》。\n\n“好吧…至少《晨星报》能有所缓和？”\n“晨星报压根提都没提。”\n“行吧，我放弃了，”玛茵在圣杯报纸的问题上举手投降，她将手中的协议草案放到塔兹米的桌上，“这是外交部和圣杯特使洽谈的初版方案，你看看吧。”\n\n“托管补偿金、行政损耗金、督管资助费、治安损失赔偿金…”塔兹米皱着眉头看着草案上名目繁多的各种款项，“他们想干嘛，谈判还是敲竹杠？”\n“这就是圣杯人的做派，”玛茵叹了口气，“你要知道，他们刚刚坐下来的时候，开出的价码是现在草案的三倍多。”\n\n“钱倒还能慢慢付，”塔兹米看向了草案简报的背面，“为什么不归还马尔代夫？”\n“他们说鉴于目前的欧洲局势，必须保留马尔代夫作为远洋运输的中转港，要求我们继续履行九十九年租约。同时在圣杯未来可能的大战中至少保持中立。”\n\n“她们的意思是要等到几十年后才还给我们？”\n“如果我们想签字的话。”"
  NRR.event.63.a: "行吧，至少我们得到了里子—一个完整的南亚"
  NRR.event.63.b: "就算是圣杯的《每日邮报》称呼我为刽子手我也不签！"

  NRR.event.64.t: "致世界"
  NRR.event.64.d: "南亚人民在此致全世界各洲各国的人民：\n\n就在此时此刻，南亚人民骄傲地向世界宣告，在南亚人民的不懈努力下，南亚终于不再是一个受他国势力干涉的，任殖民者宰割的养殖场的代名词，它成为了一座象征独立和统一的纪念碑。\n\n南亚人民集一切智慧、力量与美德，通过武装革命、和平谈判和平等磋商，为的是一个独立的，不受他人侵犯的统一国度，为的是再一次实现国家的统一，也是为第一次实现在国民意志和国家使命结合下的第一次真正的统一。\n\n今天，南亚人民自豪地向世界宣告，我们做到了，尽管它来之不易，尽管它尚不完美，但我们已经做到，我们终将做到。\n\n现在，全世界各地的人们，已经不用再将目光放在南亚这里，看看你们自己！\n\n是否还在被他国统治？是否还在受他人的压迫？是否尚未实现自立独立的成功？\n认识你自己！了解你自己！武装你自己！\n\n南亚的胜利不会是历史的第一次胜利，也不会是历史的最后一次胜利，全世界的人们，只要你们认识到自己的力量，了解了自身的立场，武装起来，南亚将是你们的榜样和盟友。\n\n这是正义者同盟致世界的一封信，为所有在解放事业、自由事业的人们致以我们的敬意！\n\n人人皆兄弟姊妹！"
  NRR.event.64.a: "人人皆兄弟姊妹"

  NRR.event.65.t: "新的名字？"
  NRR.event.65.desc: "随着南亚再次统一，一项新提案在议会中提出，大部分人认为应当保留建国时的“恒河”主体，但是也有相当一部分人认为应当更改为南亚以彰显一个统一的新国家的包容性。"
  NRR.event.65.a: "还是维持原国名不变吧"
  NRR.event.65.b: "南亚民主联邦"
  NRR.event.65.c: "南亚联盟"
  NRR.event.65.d: "南亚革命联盟"

  NRR.event.66.t: "专家会诊"
  NRR.event.66.d: "拉西纳山，总统府邸，三楼会议室。\n\n“好吧，首先，政府部分，”塔兹米开宗明义，“前政府最大的败笔就是纵容腐败和官僚体制改革的失利，这也是我们的首要问题。拉伯克？”\n\n“我赞同，事实上，民共党内部的相当一部分成员对于‘除鼠计划’的失败感到惋惜，”拉伯克适时地将原来娜洁希坦主导下的“除鼠计划”草案推到塔兹米面前，“现在没了参议院的阻挠，我相信我们会成功的。”\n\n“这我并不反对，拉伯克，”塔兹米点了点头，“但是我的意思是我们能否做到更多？”\n“更多？”\n\n“是的，这样的法案确实能够整顿风气，固然也能满足很多人的诉求—将受波及的人压缩到最小范围，”塔兹米敲着桌子，“但是，我在想一种制度性的解决方案。”\n“将目前的政府工作体系一分为二，最终回归到中央政府，下面的各层级划分为相互独立的两套体系，实行相互监督和制衡；同时，成立专门的监察部来专案专办以提升重要案件的行政效率。”\n\n塔兹米说完，会议室一时陷入沉默，玛茵和拉伯克一时被突如其来的新设想给震惊到了，或者说，被吓到了。\n\n“等…等一下！”拉伯克快速反应过来，“这简直是在政府部门内掀起一波海啸，这会引发极大的震动，带来极不稳定的各种可能！”\n\n“设立监察部门倒在各方可以接受的范围之内，”玛茵仍在思索，“但是双独立体系会造成更严重的冗员和超编，这样的常态化分裂恐怕也会带来持续性的低效…我们真的做好相应的准备了吗？”"
  NRR.event.66.a: "嗯，你们说得对，看来这份方案需要更多推敲"
  NRR.event.66.b: "这个系统需要一次灌肠！"

  NRR.event.67.t: "批准决定"
  NRR.event.67.d: "国家监察部：\n\n经恒河国民大会通过、由最高国家重建委员会起草的《监察部组织法》将于本月正式生效，现将部门人员配置、组织架构、主要负责人任命决定通知你处，望知悉并回文。\n\n现令你部门于十五日内，向重建委员会提交详细的人员部署安排，下级机关的设立安排，工作方针和各项具体工作计划。\n\n重建委员会认为目前的重点在于政府部门的内部纪律与腐败问题，这将是你部门工作方向制定的出发点。\n\n国民大会和重建委员会期待你部门能迅速调集力量，完善部署，拿出成绩。\n祝成功！"
  NRR.event.67.a: "国家重建委员会\n签名：塔兹米"

  NRR.event.68.t: "在花园播种"
  NRR.event.68.d: "拉西纳山，总统府邸，下午，一楼花园。\n一场小雨刚刚结束。\n\n“今天早上召开的教育部重整会议很不好，”塔兹米将地上的一枚石子踢进草丛中，“一份清楚的各地教育落实情况报表都拿不出来，要求他们进行摸排也是敷衍了事，这样下去教育方面的局面根本打不开。”\n\n“倒也不能完全怪他们，”玛茵看着一滴雨水从花园的一株草上滑落，“共和国如今对于教育体制还没有作出一个明确的规定，许多地方完全由私立教育机构承担教育的责任，公立教育和私立机构的对立和无序也导致教育质量的不均衡。”\n\n“教材也是一个重要的问题，”塔兹米补充道，“许多地方的教材完全没有得到国家的审查和监督，他们到底在给学生教授什么知识我们一无所知。”\n“总的来说，学校方面可以说是一穷二白，我们缺足够的教师，足够的学校以及一套成熟的教育立法规制。”\n\n“人才方面的话，我想我可以提供一个思路？”\n一直坐在花园长凳上的赤瞳突然开口。\n“目前共和军存在许多上了年纪的军官，他们很多都是军龄十余年二十多年的老兵，军队的文职岗位有限，许多此前因国内战争而扩招征募的后方士官也需要重新安置，我想这也许是个办法。”\n\n“让军人去当老师？”玛茵摇了摇头，“学生不是士兵，他们不应当被命令，他们去学校的目的是学习，不是服从。”\n\n“他们都是一群经受过考验的人，”赤瞳依旧面不改色，“我相信在具体工作中，他们会学会适应新的环境。”\n塔兹米思索了一会。"
  NRR.event.68.a: "我们都曾是学生，在教育问题上应当慎之又慎"
  NRR.event.68.b: "赤瞳，如果你相信他们，那我自然也会，不论阻力如何"

  NRR.event.69.t: "第一堂课"
  NRR.event.69.d: "汤米从未想到自己第二次走进小学，是以一个老师的身份。\n\n汤米在动荡的岁月匆匆完成了自己的小学阶段，之后不就便因为战争和灾难中断了学业，尽管如此，大致识字的他在加入革命军后很快被提拔到后勤部进行文书工作，在军队内部的快速培训后，汤米就一直干着文书工作，在危急时刻也偶尔上前线扛过几次枪，所幸都不是十分惨烈的战斗，他也就一直工作到了今天。\n\n坦率地说他并不完全接受这份新工作，但是当军队内部对非战斗部门开始精简的消息传来之后，汤米发现自己的上尉军衔不能带来任何继续晋升的可能性。与其这样，不如回到家去拿到一份体面的工作，从此离开军旅，过上普通日子。\n\n这么想着，汤米推开了教室的门。正如所有人都能预料的那样，教师里几十个调皮捣蛋的小鬼哄闹一团，即使金属铃敲打的铃声尖锐无比，也被这喧闹压过一头，显得势单力薄了起来。\n\n“安静！”\n汤米拿出了在军营中军官的势头，洪亮的嗓音和健硕的身形形成了很好的组合效果。学生们一时安静了下来，都望着他们的新老师。\n他保持着军人的步伐和简练的动作，在黑板上写下自己的名字。\n\n“从今天开始，我就是你们的数学老师。”\n“哦我的天哪他居然要当我们班的老师！”教室后方的一些男生开始窃窃私语。\n“在我的课堂上，不允许吃零食！打瞌睡！发言要举手！”\n“他看起来好凶……”窗边的两个女生小声嘀咕着。\n“上课期间上厕所要打报告！”\n\n教室保持着大致的安静，但嘀咕的声音仍留流窜在教室各处。\n\n意识到下马威的威力似乎大过头了，汤米停顿了三秒，开口接着说：\n“不过今天嘛，既然是我们第一次见面，我有必要让大家更多地了解一下我，就不上课了，讲一些我在军队中的故事吧。”\n\n军旅生涯，那可太对男孩子们的胃口了，对于女孩子而言，帅气的士兵也往往是她们喜欢的形象之一，一群十几岁的小孩子仿佛瞬间忘记了刚才的严肃气氛，兴致勃勃地等待故事的开始。\n“那时候我还在曼德勒，给前线的一个团送物资……”"
  NRR.event.69.a: "比较生硬的转变，但是个好的开始"

  NRR.event.70.t: "开学演讲"
  NRR.event.70.d: "同学们好，很荣幸来到德里市第三中学，参加大家的开学仪式。\n\n站在这里，我很羡慕大家能在崭新的校园和教室开始自己的学习。我没有大家这么好的运气，我成长在一个偏远的村子，村长就是我们村子里最博学的人，也是我们所有小孩的老师。我和我的同伴们还没能像大家这样学习九年、十二年，我们认了几年的字，会读会写之后，我们就开始练体力，为了奔个前途来这里学技艺，那时候，这儿还叫帝都。\n\n在这期间中，我的好朋友们不幸去世，这让我受到了很大的打击，于是我参加革命，经过十余年的不懈努力，才在今天可以站在这里向大家讲讲我的一些话。\n\n我的幼年和青年已经过去了，那是一段惊险的、悲壮的也是不堪回首的往事，但是你们的青春尚未开始，共和国的火炬终将传递到你们的手上。我的任务，我们的任务，就是确保你们能在安稳、安全的环境下成长起来，成为国家的新生力量。\n\n人是终会老去的，属于一代人的时代也终会随着那代人的逝去而结束，但你们是未来的新生代，无限的可能与理想都藏在不断逼近却从未到来的明天之中，所以明天才总是那么令人期待，所以你们才那么受人关注并抱以期许。\n\n我读的书并不算多，读过的书里面，打发时间的课外书占了绝大多数（笑声）。幻想乡有个作家写了本小说，在那部小说的最后一句写道：“人类的所有智慧就在这两个词里:等待和希望。“\n\n今天，就让我们把这两个词各自拿去一半吧，我们在耐心地等待，国家在等待重振旗鼓，南亚在等待新生；而你们，亲爱的同学们，希望就在你们的身上，未来就在你们的身上！\n（掌声）"
  NRR.event.70.a: "看着台下一知半解但鼓掌的学生们，塔兹米羡慕着他们的天真和快乐"

  NRR.event.71.t: "老鼠？仓鼠？"
  NRR.event.71.d: "拉西纳山，总统府邸，三楼会议室。\n\n“我劝你谨慎。“\n\n今天的会议室只有拉伯克和塔兹米两人。在得知今天会议的主题后，拉伯克坐下来就如是说道。\n“为了什么？你还是民共党？“\n\n“为了我们所有人，“拉伯克今天的态度尤为坚定，“直至今日，重建委员会的计划能够得到国民大会的支持，第一是社会党和民共党左翼本就支持这样的改革，第二是因为反对改革的人民党议员要么拒绝投票，要么就是之前的案底被查出来而面临起诉。”\n“但是你想过没有，如果在党派问题上动刀子，那我们的支持者也会站到我们的对立面反对我们？这会让我们在国民大会上孤立无援。“\n\n“我们可以以行政命令的方式强制……“\n“是！当然！这是《重建法》赋予你的权力！“拉伯克敲了敲桌子，”但是谁来执行，谁又会阻挠？党派问题本就是一团乱麻，如果擅加干涉就会适得其反！“\n\n“这正是民共党失败的原因不是吗？”塔兹米对拉伯克提出的问题不置可否，“难道你不认为许多人应当为今天失败的政党秩序承担责任吗？”\n“怎么承担，像处理参议院那样，把社会党和民共党的人也抓起来或者关进去？然后你一个人站在投票箱前投赞成票？”\n“我什么时候说过这样的话？”塔兹米的火气也起来了，“那就按你的说法，接着让那群脑满肠肥的议员和商人、实业家沆瀣一气，让国民大会成为黑金政治的天堂？”\n\n两人意识到这样的交流无济于事，各自抱着肩膀靠在椅子上安静了几分钟。\n\n“听着，塔兹米，”拉伯克从怀中拿出了一张纸，上面写着一些简短的承诺，底下是社会党和民主共和党的几个主要人士的签名。\n“我事先跟他们几个人聊了聊，他们愿意配合并加入到规范政党资金的行动中，只要你停止对民共党右翼的清算，我的意思是，停止在现在这个麻烦的时候进行清算。”\n“算我求你了。”\n\n塔兹米看着手中的这张纸，它可以很重，也可以很轻。"
  NRR.event.71.a: "塔兹米叹了口气，在这张纸上签下了自己的名字"
  NRR.event.71.b: "塔兹米摇了摇头，把它推回拉伯克面前"

  NRR.event.72.t: "海德拉"
  NRR.event.72.d: "德里市 国民大会 二楼会议室。\n\n即使把这群人的脑袋全砍下来，明天也会出现几个穿着和他们一模一样的人出现在议会中，只不过是换了个名字和样貌。\n\n就像爱琴海多首怪物海德拉那样。\n\n塔兹米面带微笑地看着社会党、民主共和党和人民党的主要人士依次落座，心中如是想着。\n在拉伯克点头示意人到齐之后，塔兹米坐了下来，清了清嗓子。\n\n“感谢诸位能拨冗参加这次会议，”塔兹米不失礼貌地开口发言，“在过去的几个月里，我相信恒河的政党体系得到了相当程度的改变。”\n众人的反应令人寻味，社会党的干事们神情不变、民共党代表保持着谨慎与体面，人民党的领袖则默不作声。\n\n“我想在新的规章制度下，各政党的运作将会走向公开化与透明化，”塔兹米扫过他们每个人的面庞，“各位所需要做的就是在这一新规的框架下，履行自己对国家的义务，还有什么问题吗？”\n\n社会党和民共党的数人看了看拉伯克，又相互交换了眼神，或点头或耸肩，算是赞成，至少是不反对。而人民党的代表的神情显然已经不对了。\n\n“塔兹米先生？”“请讲。”“我作为人民党的代表，希望您能暂时中止对人民党议员们正在进行的的司法侦察和审理。”\n“理由呢？”\n“没有理由，先生，”代表扯了扯领带，“议员作为民意代表，具有不被侵犯的议员特权，除非被国民大会开除资格，否则不受逮捕和侦察……”\n\n“或除非正在进行犯罪而必须采取措施予以制止的，”塔兹米直接打断了他，“先生，除了现成的，我手里还有许多材料，你想要另一场重建委员会的独立调查吗？”\n\n人民党代表憋红了脸，但塔兹米的威胁显然奏效，他最终手一滑，摔坐在椅子上。\n\n塔兹米站起来，环顾在场诸位。"
  NRR.event.72.a: "“很好，散会”"

  NRR.event.73.t: "烘焙师与切蛋糕"
  NRR.event.73.d: "拉西纳山，总统府邸，二楼办公室。\n\n“…综上所述，统计署和财政部给出来的结论是相近的，”玛茵翻看着财政部送来的简报，最终将它们整理好递给塔兹米，“就目前而言，恢复经济是国家最为紧迫的近期目标。”\n“这就需要政府对各行各业进行补贴的同时减少对非紧要行业的管控，“拉伯克靠坐在沙发上，”同时给地方政府放权，让他们更多地掌控自身地区的经济发展，这比我们在德里冥思苦想要灵活得多。“\n\n塔兹米静静地听着二人的分析，翻看着几份调查报告和报表。\n\n“我反而认为财政部和工业部在不应该投资的地方补贴得过多了，”塔兹米捏了捏鼻子，摘下眼镜，“将这些资金集中起来，放在重工业和我们急缺的军工产业上，让全国的产业拧成一股绳，这将对恒河接下来的各项行动更为有利。”\n\n“重工业？”拉伯克皱起了眉头，“现在国家需要的外贸、商业和民用工业的复苏，我们要外汇，要就业，要各种东西，重工业目前给不了我们这些急需的东西。”\n\n“如果钢铁和军工不能被发展起来，那你说的那些都会被夺走，”塔兹米寸步不让，“难道我们到了安稳发展的时候了吗，南面的圣杯、西北方的苏联、东边的樱花，各个都把恒河当成肥肉。”\n“再提到央地财政上，离开了中央直属机关的监督，政府资金的浪费数目简直就是一个天文数字！省长市长们的豪车、市长夫人们身上手上的圣杯国衣服和宝石国的珍贵宝石，这些东西的数量可比各地公路铁路的里程数增长快得多！”\n\n“你太偏激！”拉伯克站起来瞪着塔兹米，“怎么，德里的部门里头就各个都是圣人？如果合理的损耗和无心的投资失败也被称作贪腐，那咱们干脆不用运作政府，开个大型监狱倒是一步到位！”\n“那我一定要任命你作狱长…!”\n\n“你们两个！”玛茵及时起身中断了二人的争吵，“难道这样的争吵就能搞定这些问题吗？”\n\n“反正他的方案在我这儿通不过！”拉伯克翘起二郎腿，“国家经济是一个婴儿，不是牲口！把它的头按进池子里就能喝水?异想天开！”\n\n“塔兹米…”玛茵拉了拉塔兹米的衣角，“你是不是应该再考虑一下…?”"
  NRR.event.73.a: "“……行，你是专家你说了算！”"
  NRR.event.73.b: "“我还非要跟你争一争不可！”"

  NRR.event.74.t: "季度财报"
  NRR.event.74.d: "拉西纳山，总统府邸，二楼办公室。\n\n“上季度全国的国民生产总值较去年同期增长了8.6个百分点，”拉伯克坐在塔兹米的桌前念着前天统计署送来的财报，“各地的商业部门在刚开始表现出停滞，但是增长速度的提速弥补了此前的停顿…”\n\n塔兹米努了努嘴，两手一摊，表现出一副“果然如此”的样子。\n\n“搞不明白你在得意什么……”拉伯克没好气地说，“选中的方案最后还是我和财政部的人加班加点熬夜完善细化，才能有今天这样的成果，你倒是大手一挥清闲的很……”\n\n“这不正证明我的判断是对的吗，”塔兹米抿了口红茶，“让你做财政委员，是我在经济工作中最正确的决定。”\n\n“懒得念了，你自己看得了，”拉伯克往后靠，没好气地把报表甩给塔兹米，“我要申请公休，你小子欠我和财政部所有人一个人情，还有通讯处！因为这堆破方案给各地打不完的电话，光通讯处就报修了十几次！”\n“好好好，”塔兹米举手投降，“批准假期，完全赞成。话说，玛茵这些天不在德里，她去哪儿了？”\n\n“还不是把你之前的那些贪污浪费的气话听进去了，”拉伯克翻了个白眼，“玛茵现在坐火车和汽车在各地转，确保各处的项目资金都用到实处了，前天和她通电话的时候她也是有气无力的，明显是累坏了。”\n塔兹米一愣，尴尬和愧疚同时出现在他的脸上。\n\n“我说你小子真得把你这脾气好好改改，”拉伯克今天明显是累得顾不上体面，“之前你冲别人发脾气，也是人家玛茵到处做善后工作，你欠她的人情可比欠我们的多得多！你不对人家好一些，你简直都不算人。”\n“……这一点我无法反驳。”\n\n“少来这套，”拉伯克摆了摆手，“打算什么时候在一块，你们不着急我们都急了。”\n“没影的事儿…还给你急上了。”\n“得得得！平时火急火燎办事一人，这时候矫揉造作起来了，”拉伯克撇了撇嘴，“今天请我吃饭，先把我这份情还了再说。”\n\n塔兹米苦笑着掏出钱包。"
  NRR.event.74.a: "“地方你挑”"

  NRR.event.75.t: "民口夺食"
  NRR.event.75.d: "拉西纳山，总统府邸，上午，一楼花园。\n\n“又是粮食短缺的报告，”塔兹米一脸忧心地看着刚刚送达的西部北部乡村地区的饥荒预警，“这已经是本季度的第二次了。到我们手上只是预警，我担心现在，恐怕早就开始出现饿死人的情况了……”\n“当地省政府没有储备粮？”玛茵接过塔兹米手中的报告。\n\n“不是总量的原因，玛茵……”\n塔兹米捂着脸。\n“是配给的问题，恒河按理说是一个粮食多产的国家，气候和降水足以支持一年多收，”塔兹米踩了踩脚下的土地，“但是粮食都集中在各个城市里，多产的中部和南部农业产地不愿意把粮食送到需求少且不稳定的农村，地方政府也不愿意补贴这种销售。”\n\n“你还记得我给你看过的那张列车运输表吗，那班列车本应是运输救济粮的……”\n\n两人坐在同一张长椅上，沉默弥漫在花园里。\n\n“我想我们可以在委员会提议建立一项由中央财政直接拨发的补贴。”玛茵提出建议。\n\n塔兹米抓起一把泥土，让它们慢慢慢慢地像沙漏一样从手中漏下。\n“给城市的主粮运输定下配额……由政府调拨粮食配给到农村…“塔兹米喃喃自语，”只要几年，只要粮食配给制维持几年，解决了饥荒问题，道路运输和配给链条都会完善起来……“\n\n“塔兹米，我知道你不相信官僚体系，”玛茵叹了口气，“但是这样的作法只会给他们更多的操作空间，最终的落实效果会更加不可控。"
  NRR.event.75.a: "“哎，你说得对，这只是我的一个想法罢了”"
  NRR.event.75.b: "“……如果我连饥饿都无法解决，那我就是罪人”"

  NRR.event.76.t: "千万人之伟大"
  NRR.event.76.d: "德里市 国民大会 议会厅。\n\n301票赞成，77票弃权，132票反对，40席缺席或待补选\n\n“感谢议长，感谢诸位的支持，”塔兹米点头向议长致意，并向议员席深鞠一躬，“我们共同的努力正在救人民于水火。”\n左侧的社会党响起掌声，中间的民共党响起稀稀落落的掌声。\n\n“在此前，我们在饥荒救治方面的努力仅仅是行政命令，和临时性的救治措施，”塔兹米拿起刚刚通过的法案，“现在，我们可以很自豪地向国家和世界宣告，我们已经建立起一套防治饥荒的法案和系统。”\n\n掌声更加响亮。\n\n“过去的千百年，恒河不乏繁荣富裕的时代，但是谁来看看这些生活在生死线上下的人？谁考虑过那些最破败最无人问津的村庄？没有！”\n\n“一个国家的繁荣，是由千万人之力缔造的，无论其贫富贵贱，无论其信仰民族。”\n“而一个国家的伟大，则必须体现在千万人身上，论其是否有机会自食其力，是否有机会求得生路、接受教育、实现抱负。”\n“而在此之前，他们至少应当活着，他们至少应当有足够的粮食健康地活着。”\n\n“这项法案不是结束，它仅仅是一个开始，”塔兹米挥起拳头，“我们所有人都经历过旧帝国时期的黑暗统治，贵族的餐桌上堆满了美酒与禽肉，但外面的人民却饥肠辘辘，所以他们衰落，所以他们失败，所以他们灭亡！”\n\n“共和国的使命就是结束这一切，从今天开始，从这部法案开始！”\n\n“恒河的伟大不止于此，共和国的伟大也不止于此！”"
  NRR.event.76.a: "一场更响亮的掌声结束了这场演讲"

  NRR.event.77.t: "嗜血的提议"
  NRR.event.77.d: "在我们下达战略部署的不久后，加尔各答的艾斯德斯方面打来电话，要求参与到我们的军事行动中，她们希望主动参与到这次战役当中，且没有要求任何的报酬，仅仅要求由我方提供装备后勤，以及给予他们适当的独立指挥权。\n\n这份提案看上去没什么问题，但是国防部总觉得存在疑点，尤其是所谓的独立指挥权会不会带来什么后果，无人能够预测。\n\n赤瞳极力建议不要理睬这项提议"
  NRR.event.77.a: "这场战争国防部确实足以胜任"
  NRR.event.77.b: "这场战争需要我们全力以赴，答应她"
  NRR.event.77.c: "这场战争需要我们全力以赴，答应她"

  NRR.event.78.t: "恶果"
  NRR.event.78.d: "“停！请你们停止开火，我们遵照你们的要求停止抵抗，请你们遵照你们的约定，接收我们的武器，保证我们的生命安全！”\n\n通讯机传来敌军几近哀嚎般的求饶。\n\n“元帅，怎么处理？”艾斯德斯的副官，兰，听着通讯传来的声音，转头看向坐在指挥所中的艾斯德斯。\n“什么怎么处理，杀光他们。”\n艾斯德斯睁开眼，仿佛听到了一个很奇怪的问题。\n\n“为什么不停火，你们为什么不停火！这违反了交战准则，你们这是屠杀，请你们回复，请你们……”\n通讯设备被兰关掉。\n\n“除此之外，还有一件事情需要汇报。”\n“讲。”\n“侦察部队报告了战场不远处的数座村落，”兰在沙盘上用旗帜标记出来，“根据驻守观测，发现敌军的后勤补给都来源于这些零散的村庄，许多粮食的掩藏点分布于每家每户之中。”\n\n一丝笑容出现在艾斯德斯的脸上，兰很明白，战时元帅脸上的笑容往往意味着死亡。\n\n“兰，告诉近卫营，我要出击了。”\n“但是我随后该如何向友军汇报我们的行动。”\n\n“发现大规模敌军，通讯设施突然损坏无法与外界联络，就这样。”艾斯德斯站起身披上披风，将刚刚沙盘上的旗帜全部扫落在地。"
  NRR.event.78.a: "这就是屠杀"


  NRR.event.79.t: "又一个恶果"
  NRR.event.79.d: "无需赘言。\n\n又是一场屠杀。\n\n又是千人万人的死亡。\n\n你很清楚你在做什么。\n\n无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言。无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！无需赘言！\n\n这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！这是屠杀！"
  NRR.event.79.a: "你很清楚你在做什么"

  NRR.event.80.t: "使命完成"
  NRR.event.80.d: "德里市 国民大会 议会厅。\n\n“女士们，先生们，”塔兹米清了清嗓子，“今天有可能是我最后一次以重建委员会主席的身份站在这里讲话。”\n“正如我数年前所承诺的那样，只要国家的危机状态得到缓解，腐烂和衰落的势头被扭转，国家重建委员会的目的就圆满达成，它的使命也已经完成。现在，我们一致认为，它的使命现在已经完成了。”\n\n“在此，”塔兹米向第一排的玛茵、拉伯克、赤瞳等人看去，“请允许我向重建委员会的各位委员、政府各部门工作人员、国会议员以及千千万万对我们的工作报以期待的人们表达诚挚的谢意。”\n\n塔兹米深鞠一躬，台下议员席响起掌声。\n\n“正如我此前所承诺的那样，”塔兹米整了整衣衫，他突然发现自己又瘦了，衣服穿在身上比去年看着又宽了一些，“我本就不是一个适合成为公职人员的人，国家和共和事业的危难迫使我不得不担起责任。所以在重建委员会解散之后，我将不再担任公职，同时我也将离开政府办公府邸，在新大选的结果出来之后。”\n\n“朋友们，”尽管塔兹米已经在议会、广场、发布会等公开场合演讲多次，但今天仍然让他感到一丝呼吸困难，“和恒河的千百年历史相比，共和国就如同一个刚刚诞生的婴儿，我所能做的全部，恐怕也就相当于为我们的祖国换了一次尿布（台下笑声，玛茵也笑了），它的路还相当漫长，改革和进步的事业方兴未艾，一切，就指望诸位，和所有正在工作的忠诚无畏的爱国志士了。”\n\n“我衷心、衷心地，为我们的共和国祈祷，拜托你们了，拜托拜托。”\n\n台下响起雷鸣般的掌声，就连议会右侧的人民党席位中都响起了掌声。"
  NRR.event.80.a: "“谢谢你们，谢谢，这就是我要说的全部”"

  NRR.event.81.t: "真理报专访节目：新道路（节选）"
  NRR.event.81.d: "采访者为苏联《真理报》记者 叶甫根尼·哈尔代伊。受访者为最高国家重建委员会主席 塔兹米。\n\n叶甫根尼：祝贺您，塔兹米先生，祝贺您在恒河共和国、乃至整个南亚所取得的成就。\n塔兹米：不敢当，如您和世界所看到的这样，这些成果离开我可以，但是离不开重建委员会诸位的努力。\n\n叶甫根尼：您过谦了。苏联人民和世界人民都在期待未来的恒河会走向何种道路。\n塔兹米：（笑）恐怕这就不是我能够回答的了，正如之前的国家广播所说的那样，在新大选的结果出来之后，我将会辞去一切公职，成为一个普通人。至于您所提及的问题，恐怕大选不久后组建的新一届国民大会和政府会回答您的。\n\n叶甫根尼：回顾您的各种“重建”措施，您认为您是一个社会主义者吗？\n塔兹米：我想我们对社会主义的定义需要厘清。在我看来，社会主义应当遵循它的本义，即社会至上，强调集体利益、良好秩序与公共美德的重要性。在这样的定义下，我毫无疑问是一个社会主义者。\n\n叶甫根尼：（笑）您在演讲中常说您读书学习的时间不长，但今天您所展现的理论水平很高。让我们进一步细化这个问题，结合您的各项治国措施，您认为您是一个列宁主义者吗？\n塔兹米：（笑）确实读书不多（二人笑）。不，我不认为我是一个列宁主义者，我对马克思主义确实是以一种尊敬的态度去学习的，但是，您瞧，我甚至没有自己的党派，重建委员会解散后，我甚至不会有任何的政治关系。所以退一万步来说，我至少算不上一个标准的马克思列宁主义者，在你们苏联人看来。\n\n叶甫根尼：您的回答很严谨，在未来的大选中，您会加入党派吗？或者您会给哪个党派投票呢？会是此前和您一直走得很近的社会党吗？\n塔兹米：根据恒河共和国的《选举法》，我不应该，也不能透露我的选择（二人笑）。"
  NRR.event.81.a: "谈笑风生"

  NRR.event.82.t: "投票日"
  NRR.event.82.d: "德里市 玛茵家 客厅。\n\n“今天是全国选举的第一天，我们可以看到各地的竞选活动非常激烈，难以想象这般活动还要持续半个月左右，如果算上计票、宣布结果和组建政府，这将是近几年来最难熬的三个月了，评论员先生，您的看法是什么？”\n“好吧，结合大选的形势我们倒是能够清晰地看到一些有趣的趋势。社会党貌似将中心放在了北部地区和中部的工业城市；与此相对的，民主共和党在巩固南方选区的基础上也在争夺中部地区的城市和农村；人民党的势力已经日薄西山，但是他们也在边缘选区和一些农村地区拉票，我们目前还没有得到更多的最新消息，也许会有一些新政党的出现也犹未可知……”\n\n“你已经投票了？”玛茵一边沏着茶，一遍听着广播电台的播报。\n“是的，我把选票留在了拉西纳山的信箱里，今天已经寄出了，”塔兹米坐在客厅的沙发上翻看着今天的报纸，“天哪，上百人抢投票箱？警察也不管管…”\n\n“那当然了，这种场景全国都在发生，”玛茵端着茶盘放到了茶几上，拿起一杯抿了一口，“警力早就不足了，今天赤瞳都被要求去国防部讨论是否动用驻军维持秩序的事情。”\n\n“《拉伯克在曼德勒主持竞选活动》……”塔兹米翻到下一版，“哼，这小子还挺上镜的。”\n\n“诶，你投给谁了？”玛茵好奇地问，并把茶杯递给塔兹米。\n“哦谢谢。那我可不能说，”塔兹米接过茶杯，在嘴上做了一个拉拉链的手势，“知法犯法，罪加一等。”\n\n“没劲！”玛茵坐了下来，“有什么不能说的嘛，外国记者面前不能说就算了，我你也不告诉？”\n“那你说说你投给谁了？”塔兹米端起茶杯往嘴边送。\n“你都不说我干嘛告诉你？保密！”"
  NRR.event.82.a: "“好烫！”"

  NRR.event.83.t: "向昨日告别！"
  NRR.event.83.d: "德里市 共和广场 傍晚。\n\n“谢谢大家，谢谢，”塔兹米一次又一次地接过观众送来的大束鲜花，又将它们放在脚边，就像站在一楼官邸外的花园中那般，“请不用再送了，我申请的演讲时间只有一个小时，超时了警察局是要找我的麻烦的！”\n\n台下响起了笑声，倒也同时起到了静场的作用。\n\n“谢谢你们，谢谢，”塔兹米保持着演讲时一如既往的自信笑容，“在你们面前，我没有什么忌讳或者羞于提起的事情，没有大家的支持，我无法做到今天的这些。”\n\n“尽管，我做得并不完美，回顾很多事情，我总是觉得还有改进的空间，还有一些弊端应该避免，”塔兹米平静地说着，“我并非完人，我也有着许多不足和错误。”\n\n“但是，我向你们保证，在消灭犯罪，打击腐败的问题上，我尽到了我的义务。”\n“我努力保证全国那些最偏远地区的孩子也能吃上饱饭，我改革我们的教育，让我们年轻的学生能够得到先进的体系的科学知识和道德习惯。”\n“尽管有好有坏，尽管美中不足，”塔兹米停顿了一下，清了清嗓子，“但是我想我们应当看到，不堪回首的旧日已经过去，我们开创了一个新的局面。”\n\n“这是一个怎样的局面呢？许多的改革存在可能，更高更快的增长和发展值得期待，更富足更稳定的生活值得为之奋斗。”（掌声）\n“我们可以宣告，昨天已经过去，我们已经与昨日告别，与腐烂的、黑暗的、令人作呕的东西告别了，再也不见了！（掌声喝彩声）\n\n“明天就在眼前，黎明已至，胜利已至！"
  NRR.event.83.a: "每个人都期盼着黎明，即使它还未到来"
  NRR.event.83.b: "每个人都期盼着黎明，即使它还未到来"
  NRR.event.83.c: "每个人都期盼着黎明，即使它还未到来"

  NRR.event.84.t: "贺信"
  NRR.event.84.d: "致塔兹米先生：\n\n见字如面，我真诚地向你表示祝贺。\n\n尽管自上次离别之后，我再也没有来过德里与你见面，但是身在加尔各答，我时常关注着你和你们的各项成果和工作。\n正如我们双方都知道的是，我们曾属于彼此对立的阵营，相互之间都有着深深的仇恨，也许我的信件不足以说明什么，但是我依然要向你表达我最诚挚的敬意。\n\n在你之前，我从不相信你们能做到些什么，包括什么改变这个国家，改变这片土地之类的梦想，我曾经嗤之以鼻，认为只是你们的异想天开。\n但在和你分开之后，听闻你们的各项举措，结合我所听到见到的各地的真实情况，我的观点开始发生转变：你们真的在改变这一切。\n\n尽管这些改变才刚刚开始，它还需要继续地观察，但是你们的努力让我汗颜，让我羞愧于此前的态度和想法。\n谢谢你们，塔兹米先生，还有支持着你的人，你们的成绩即使是对你们抱有敌意的人都无法矢口否认。\n\n因此，我衷心祝愿你们、或者说我们的事业能继续这样健康地发展下去，毕竟加尔各答也是恒河乃至南亚的组成部分之一，至少现在我真心地如此认为。\n\n如果有我帮得上忙的地方，请你尽管吩咐，毕竟，我也只是一个渴望幸福和希望的普通的人而已。"
  NRR.event.84.a: "威尔，敬上"

  NRR.event.85.t: "上班日"
  NRR.event.85.d: "拉西纳山，总统府邸，清晨，门口。\n\n从山脚或者半山腰步行数十分钟走到官邸门口的塔兹米整理了一下领带和衣领。每天早晨的步行是他保持清醒工作的一项长期习惯。\n\n迈步走进，塔兹米发现玛茵似乎也是刚到不就，正在准备推门进去。\n\n“你居然会到的比我早，”塔兹米略感惊讶，“这几年来还是头一回。”\n“毕竟是最后一天嘛。”玛茵耸了耸肩。\n\n“是啊，最后一天了。”塔兹米长舒一口气，推开大门。\n\n“选举的结果还在统计吗？”\n“有的省的投票过于混乱，各投票点的选票收集都要重新筛查。还有的比如古吉拉特省，居然出现了公开举报贿选舞弊的情况，导致整个选区的投票都要审核裁定是否重新组织。”\n\n“真麻烦。”\n“是啊，真麻烦。”\n\n两人嘴上虽然在抱怨，但是难掩轻松神色。反正，他们应该可以置身事外了。\n“笑什么呢？”塔兹米打趣道。\n“怎么，快下岗了不能笑一笑？”玛茵迅速回击，“没工作，我可连今晚的饭都吃不上了嘞！”\n\n此时，二人走到了各自的办公室门口。\n\n“没事，”塔兹米拧下门把手，"
  NRR.event.85.a: "“饭我请。”"

  NRR.event.86.t: "最后一天……"
  NRR.event.86.d: "拉西纳山，总统府邸，下午，二楼办公室。\n\n“还没签完嘛？”\n早早解决完日常工作的玛茵百无聊赖地坐在塔兹米办公室的沙发上。\n\n“别着急，还没到下班时间呢。”塔兹米拿起一本关于中央省工业区的批地许可，开始翻看文件。\n\n玛茵只能继续坐在沙发上，望着墙上钟表的秒针一圈接着一圈的转，看了一会儿玛茵觉得有点眼花，居然出现了秒针在倒着走的幻觉。她转过头，看向窗外正在下山的太阳，天色也逐渐从白色转向橙黄。\n\n“完事了，”塔兹米在一份《xx市中等学校改革、合并规划书》签下了自己的名字，合上了文件，长长地伸了一个懒腰，“嗯？钟停了？”\n\n玛茵回过神来，墙上的钟表的时间停留在一分钟以前，是刚刚停下的。\n“又得上发条了吧，”玛茵不经意地回答，比起这种小事，终于能下班了才是头等关心的大事。\n\n“是啊，也罢，正好，我们的工作结束了，”塔兹米起身，耸了耸肩，开始拿起自己的外衣，“走吧，地方你定。”\n\n但事不随人愿。\n\n门外的走廊出现急促的皮鞋踩过地毯的声音，让两个神经敏锐老兵突然停住了手头的动作。\n没有敲门声，门被直接推开。\n\n“先生，女士...抱歉。”通讯室秘书喘着气，看来她事先去敲了离楼梯较近的玛茵的办公室，发现无人后径直小跑到塔兹米的办公室。\n“什么事？”塔兹米的直觉告诉他，绝非是又一个选区舞弊这种事情。\n“紧急……紧急事态，加尔….加尔…….“\n\n“叮铃铃铃！“\n塔兹米办公室桌边的红色电话铃声不适时地响起，这只可能是国防部的来电。"
  NRR.event.86.a: "哦不……"

  NRR.event.87.t: "第一天"
  NRR.event.87.d: "“是我。赤瞳吗？”\n“是的，你们那边得到消息了吗？“电话那头的赤瞳时不时传来咳嗽声。\n\n“秘书刚刚过来，玛茵正在和她聊，”塔兹米看着坐在沙发上眉头逐渐紧锁的玛茵看着电文，一旁是正在汇报的秘书，“直接和我说吧，发生了什么。”\n“加尔各答军区完全失去联络，她们进入无线电静默状态了。”\n\n惊天霹雳。\n\n“什么？”塔兹米无法控制住自己的音量，将玛茵和秘书吓了一跳。\n\n作为参加过战争的人，他们很清楚，无线电静默意味着一场行动正在筹备，或者说，一场战役走向了倒计时。\n\n“不仅是加尔各答，普那卡、大吉岭和阿萨姆同时和我们失去了联系。”赤瞳带来了更糟的消息。\n那意味着恒河中心与东部的陆路被完全切断。\n\n“国防部为什么没有预警？”\n“国防部在一小时前与他们的通讯完全正常，甚至包括轮换表，物资需求表各种表格，直到半小时前的惯例呼叫完全没有得到回应开始，国防部才开始启用备案行动。”\n\n“你的意思是，一个此前没有任何异常的地区，在半个小时前突然让我们完全联络不上，与此同时我们控制的通道地区也没有传来任何呼救和讯号？”塔兹米不敢相信。\n“是的，尽管我本人不愿相信，但是半个小时以来我们和上述地区的呼叫全部无果只能证明我的想法是错的，”赤瞳的咳嗽声开始频繁起来，“对面可是艾斯德斯。”\n\n办公室只有沉默。\n\n“我们国防部见。”塔兹米不等回应，挂断电话，抓起座位上的西服。\n“玛茵，我们得出发了。”"
  NRR.event.87.a: "那枚嵌在所有人心中的铅弹，最终毒性发作"

  NRR.event.88.t: "紧急会议"
  NRR.event.88.d: "德里市 国防部 作战会议厅。\n\n“国防部已经紧急将巴特那作为我们的临时指挥中心，”赤瞳指向桌上的大型战略地图，“被切断的东部地区也与我们取得联系，她们将采取守势，借助革命战争时期的旧工事，防范艾斯德斯可能的东进。”\n\n“印度洋有可疑的外国舰船动向吗？”玛茵在作战桌上指向加尔各答港区南部的海域。\n\n“没有，我们的雷达没有探测到军用舰艇，”赤瞳摇了摇头，“保险起见，在你们来之前，国防部动用了与他国的紧急红线电话，向最可能干预的几个国家进行了通电。”\n\n“她们的反应是一致的：她们不知道在发生什么。”\n\n“没有他国援助，此前的通讯和情报正常……”玛茵咬着指甲，“你的意思是那个杂种只凭借她军区的军队，就要发动战争？她在想什么，还以为是革命战争时期吗？”\n\n“我无法否定你的论断，”赤瞳叹了口气，“尽管我很想拿出一些推翻这一观点的材料，但是国防部核查了一遍军区所有通讯记录及表格文件，没有发现我们想要的‘异常’”\n\n“因为她倚重的不是军队。”\n\n坐在一旁沉默不语的塔兹米突然发话，玛茵和赤瞳侧目看去。\n\n“是这里。”\n塔兹米站起来，指向地图上的红圈重点—加尔各答。\n\n“城市？”玛茵和赤瞳不明所以，“艾斯德斯是一个军事奇才不假，但她不至于蠢到以为巷战就能抵消敌我差距……”\n“错了，”塔兹米缓慢地摇头，“她必输无疑，但如果她真输了，加尔各答也就完了。”\n\n“她是个疯子，她只想杀光所有人，”"
  NRR.event.88.a: "“或者所有人陪她一块死。”"

  NRR.event.89.t: "别无选择"
  NRR.event.89.d: "城市，是天然的复杂的永久防御工事。\n\n“加尔各答的外围是坚固的堡垒群和战时工事，而城市市区，是密集的现代建筑群，”塔兹米继续着他的分析，“如果我们想要在她的精锐军团的防御下推进尺寸之地，那就必须……”\n\n“使用重炮。”前炮兵参谋玛茵意识到了问题的所在。\n“是的，使用火炮，甚至空军，轰炸我们自己的城市，”塔兹米一拳锤在桌子上，“一个拥有百万人口的城市。”\n\n赤瞳没有反驳，她意识到塔兹米的推测是接近真相的。\n\n“她是想干什么，以城市的人为要挟想谈判吗？”玛茵无法跟上这种思路，“她想要什么，完全独立的一个国家？还是……”\n“你们还没意识到吗？她是个彻头彻尾的疯子！”塔兹米已经无心慢慢分析，“她只想让更多人死，仅此而已！而且，如果我们不速战速决，那她就会更加肆无忌惮地草菅人命，我方士兵的死伤只会更多！”\n\n卑鄙是卑鄙者的通行证，高尚是高尚者的墓志铭。\n是啊，我们何时开始期待，一个旧帝国的特务头子，会是一个正常人？\n\n“使用夜袭特遣队呢？”赤瞳看了眼玛茵，继续望向沙盘，“以尖刀战术插入心脏，破坏他们的指挥中枢……”\n\n“我们手里没有她们完整的布防图，各中枢的驻地，包括各级通讯点……”塔兹米抓着自己的头发，“这样的突袭只能是送死，我早该想到的，我早该做准备的……”\n\n是啊，从何时开始，他放松了对艾斯德斯的警惕？是重建计划的顺利推进吗？是南亚的顺利统一吗？\n也许都不是，恐怕自交易的那天晚上开始，他就从来没有完全认识到对手的可怕与残忍。"
  NRR.event.89.a: "如果一场可怕交易的结果并不令人恐惧，那可怕的便是交易本身"

  NRR.event.90.t: "下达命令……"
  NRR.event.90.d: "三个人站在会议室，言语跟不上思绪的速度，只有滴滴的电报声标志着时间的流失。\n\n“看来，只有攻坚方案了，”陆军总长赤瞳打破沉默，“等到最终的围城战时，东侧佯攻进行火力压制；西侧负责主攻，以东西两侧将加尔各答切割成南北两半包围歼灭，我只能尽量减少炮火的使用，但每一丝火力的减少就是成倍士兵的阵亡……”\n\n“……你有预计时间和伤亡人数吗？”\n\n“……时间不难估计，咳咳，”赤瞳强行抑制住咳嗽，“按照敌我兵力和装备的对比，两天时间，最慢三天。”\n“但是伤亡…我估不出来，几千，几万，很难说，而牵涉的平民死伤，我更加无从判断，即使按照常规攻城战，恐怕也在数万人左右……”\n\n“……”\n\n“赤瞳，拜托你……让国防部拟定计划吧……”塔兹米说出这话时仿佛被抽干了力气。\n“等一下，塔兹米！”玛茵站了起来，“这可是几十万条人命，几十万啊！”\n“如果我们晚一分钟，这个数字还要再加几百。”赤瞳低头扶住玛茵的肩膀。\n\n“……”\n\n“玛茵……”又是几分钟的沉默，塔兹米抬起头来，眼神活力全无，“今晚我就要去巴特那，你留在德里继续处理其他工作，我们随时保持联系……赤瞳，等你这边处理完了，我们在巴特那会合。”\n\n两人轻轻点了点头。"
  NRR.event.90.a: "这时，门被突然撞开"
  NRR.event.90.b: "没有奇迹，没有荣誉，只有死亡"

  NRR.event.91.t: "转机"
  NRR.event.91.d: "“等一下！”闯入之人是拉伯克，“紧急情况！”\n\n还能有什么情况比现在更紧急的吗……？三个人齐刷刷地看向拉伯克。\n\n“刚刚，民共党总部陈列馆仓库的一台今天接线维护的老电报机突然接收到了信号，”气喘吁吁的拉伯克手中握着一份电文，“我们无法查实有线电报的来源，但是这里面的密文我们非常熟悉！”\n“陈列馆的那台电报机……？”塔兹米疑惑地接过电文，“那些不都是革命战争时期的老物件……？”\n\n然后塔兹米看着眼前的电报密文愣住了，以及一旁看着的玛茵。\n这种密文的排列方式非常眼熟，塔兹米和玛茵肯定都见过，但是陈旧的记忆一时堵住，需要大脑的一丝电信号将它们输送到眼前。\n\n“这是……”\n“这是1928年我们破获的狩人军团的那一版密文！”玛茵抢先说了出来，“看，这几个字母，是“我”的意思！“\n\n对，确实是，塔兹米有印象，这是他们在夜袭团中少有过的几次完全破获的密文版本。但是它随后不久就被更换，为什么……？\n赤瞳熟练地从抽屉里拿出了旧时的破译密码本，这是老军人的珍藏。塔兹米顾不上客气，翻开密码本就开始翻译。\n\n“呼叫、“\n四个人共同翻译着密文。\n“德里、我、是、威尔“"
  NRR.event.91.a: "呼叫德里，我是威尔，紧急通讯"

  NRR.event.92.t: "紧急通讯"
  NRR.event.92.d: "呼叫德里，我是威尔，紧急通讯。\n\n现在整个加尔各答军区进入全面戒严管制，我被迫只能以这种方式与你们取得联系，如果你们收到了，请不要作出具体回复，请长按一次，间隔四秒，重复三次，表示你们的回文，我无暇解释太多。\n\nAS（塔兹米注：艾斯德斯）现在全面接管了加尔各答及全区的军务，许多反对她的内部成员在今晚早些时候被逮捕，甚至遇害。\n\n\n我反对AS。\n\n为了加尔各答军区数百万人，也为了这个国家不要再次陷入全面的战火，我此刻决定反对AS，即使背负叛徒之名。\n\n正如我之前所写的那封信所说，当你们需要帮助的时候，请尽管吩咐。\n\n如果你们收悉，请迅速回电。我随时等待回电，情形特殊，切勿失去机会。\n\n\n确认回文后，我会向你们注明AS军力分布。以及城防图，我会向你们约定交接地点、人物及暗号。\n\n请你们相信我，正如我相信你们能拯救这个国家一样。"
  NRR.event.92.a: "请你们拯救这里"

  NRR.event.93.t: "计划有变，但是有利的变化"
  NRR.event.93.d: "玛茵激动的泪水打湿了电文纸。\n\n“塔兹米！”\n\n\n“嗯，”塔兹米一扫此前的颓势神色，他直起身子，“赤瞳，我想我们知道该做出什么决定了。”\n\n“夜袭组将会成立专班，负责与威尔的加密通讯，”老练的陆军总长和夜袭行动组长恢复了以往的专业姿态，“国防部将根据随后到手的城防图拟定接下来的攻城计划，确保最小限度的城市损伤和平民误伤。”\n\n“辛苦了，那我还是先去巴特那，”塔兹米点点头，“希望你们这边能尽快拿出完美的方案，”\n“让那个疯子看看，她输得有多彻底。”\n\n“玛茵，”塔兹米转身将双手放到她的肩头，“还是按照原计划安排，你负责后方的稳定和组织。拉伯克，帮帮忙。”\n\n“我会竭尽所能，党派那边的事情交给我。”拉伯克抱着肩膀。\n\n\n“会很快结束吗？”玛茵抬头望着塔兹米。\n“会的，我保证。”塔兹米亲了一下玛茵的额头，随后穿上西装，快步走出会议室。"
  NRR.event.93.a: "“诸位，我们德里再见！”"

  NRR.event.94.t: "破门得分，轻取三分"
  NRR.event.94.d: "围城战漂亮且干净地结束了。\n\n狩人军团对于正面拒敌颇有心得，但对于被偷袭往往表现得惊慌失措，正如他们在革命战争期间的数次受挫那样。\n\n尤其是当敌人出现在他们意想不到的地方。\n\n15个小时55分。\n整个加尔各答攻城战只持续了16个小时不到。\n\n当消息从前线传到后方，整个南亚欢呼雀跃，最后的钉子被拔除，最后一个危害稳定与繁荣的祸害被根除。\n\n报纸们歌颂着国防部和革命军的英勇无畏，政府处理危机的高效有序。\n\n当狩人军团的投降受俘人员排成排走出城市的照片被前线记者拍下，送往全世界后，没有人再敢质疑南亚的稳定。\n\n至于艾斯德斯？既然照片没有拍到她，应该是战死或者被秘密处决了吧，这样的人渣，无人在意她的死活。\n\n新的篇章开始了，新的生活开始了。\n\n所有人都这么想着。"
  NRR.event.94.a: "万幸中的万幸"

  NRR.event.95.t: "归家时刻"
  NRR.event.95.d: "德里市 玛茵家 客厅。\n\n\n叮咚。\n\n玛茵家的门铃响了起来。\n\n\n是他回来了。\n\n玛茵不假思索地跑去开门。\n\n\n果然是他。\n\n她的朋友、她的伙伴、她的英雄。\n\n“欢迎回家……唔！”\n\n访客一把抱过屋子的主人。"
  NRR.event.95.a: "虽然显得有点着急，但可以理解"

  NRR.event.96.t: "真正的最后一天"
  NRR.event.96.d: "拉西纳山，总统府邸，二楼办公室。\n\n\n“这次是真正的最后一天了，”塔兹米开心地把自己的个人物品清理到箱子里，“忘了告诉你了，左手边第三个柜子是坏的，全抽出来会掉出来，你别忘了。”\n\n“行，”拉伯克点点头，“要不要搭把手？”\n\n“怎么？这么快就想搬进来了？”塔兹米笑着打趣道。\n\n\n“去你的，”拉伯克撇撇嘴，“我只是在想没了这些东西该怎么布置房间罢了。”\n\n“不过也快了吧，”塔兹米停下手中的活，“目前的选票统计进展，对你们不是很有利嘛，胜券在握嘛。”\n\n“应该吧……”拉伯克摸着下巴，“中部还有北部的一些选区还没有统计出来，胜负犹未可知，但是应该没什么问题……”\n\n\n“哦，那我可要提前表示祝贺了，”塔兹米装模作样地行了一个旧帝国时期的贵族礼，“未来尊敬的大总统阁下。”\n\n“少调侃我了。”拉伯克摆了摆手，随后他的神情也突然闪过一丝忧愁。当他坐在这个位置的时候，他又该怎么办呢？\n\n\n“行了，”不假多时，塔兹米的所有个人物品整理完了，\n“一起走？”"
  NRR.event.96.a: "“嗯，我的车就在外面，后备箱应该放得下。”"

  NRR.event.97.t: "努力与回报"
  NRR.event.97.d: "德里市 国防部 会见室。\n\n“……所以，我传递完了最后的关键情报，就坐在自己的家里，然后你们就来了，我就被你们带过来了。”\n\n威尔平静地坐在沙发上，向对面下笔极快的国防部记录员说完了最后的陈述，就仿佛一次寻常的任务简报一样。\n“我想这就可以了吧？”坐在对侧沙发的塔兹米望向记录员，得到对方的肯定答复后，塔兹米站起身，走到威尔面前。\n\n“塔兹米先生……”威尔刚刚站起身，塔兹米就握住了他的手。\n“谢谢你！威尔，谢谢你……”塔兹米情难自已地摇着威尔的手。\n\n“你拯救了成千上万的人免遭死亡与伤痛，你是我的恩人……！”\n\n“塔兹米先生过誉了，”威尔礼貌地笑了笑，“是你们的成功让我相信谁才是真正为国的一方。”\n\n“你接下来打算怎么办？”两人握手完毕，塔兹米为威尔开门。\n“不好说，”威尔想了想，“加尔各答也有人等着我回去，我厌倦了尔虞我诈的日子，我也只是个想过普通日子的正常人而已。”\n\n“是黑瞳？”\n威尔点了点头。塔兹米舒了口气，既是为二人的未来感到高兴，又为了两姐妹之间仍未和解感到担忧。\n\n“好吧威尔先生，我相信新政府会尊重你的一切决定的，”塔兹米笑着说，“可能他们还是会要求你协助加尔各答的统合工作，但是相信我，你的选择至上。”\n\n“谢谢，塔兹米先生。”“不客气，祝你一切顺利，记得给我发请柬。”"
  NRR.event.97.a: "两人又握了握手，威尔踏上了返程，而塔兹米去见另一位来客"

  NRR.event.98.t: "特殊租客"
  NRR.event.98.d: "德里市 ████区 某住宅。\n\n塔兹米打开房门，示意跟随者跟着他进屋。屋内设施精致，装潢华丽。\n“哦~！”艾斯德斯惊讶了一会，“这真是令我意外，好精致的布置。”\n“过奖了，”塔兹米点了点头，指着屋内的各处，“你的餐食每天三顿，由专人定时送达，如果你有其他的餐食要求，你可以用黑色的电话，拿起来说就行，所以屋内没有厨房，也没有煤气燃气设施，。一楼二楼都有厕所，二楼的厕所带淋浴室稍大些，卧室在二楼。”\n\n塔兹米熟练地领着艾斯德斯在屋里参观，宛如一名租房的房东在为房东介绍陈设。\n“所以，你还有什么问题吗？”参观一圈结束，塔兹米望着艾斯德斯。\n“这个，是窃听器吧？”艾斯德斯微笑着拿起书桌旁边的盆栽，指了指花盆的底座。\n\n“当然。”塔兹米坦诚地点了点头。\n“真不敢相信，你们现在竟然能够生产如此精致的窃听器。”\n\n“制造是能制造，但是没有这么高的质量和产量，”塔兹米环顾卧室，“这所房子里的数百个监视设施，大半还是从圣杯进口的，据说有的还有最新的摄像功能。”\n“吼~真是让你们费心了。”\n\n“没什么，比起在屋外专门轮值监视你的上百人的特别小组而言，这些只是前置措施，”塔兹米抱以同样的微笑，“为了这一套方案，赤瞳和我熬了几天才拟定完成。”\n\n与此同时，五十米外的小屋，轮值小组正在调试监听设备。"
  NRR.event.98.a: "“为了让你永远待在这里，整个国家都在努力。”"

  NRR.event.99.t: "定制牢笼"
  NRR.event.99.d: "德里市 ████区 某住宅 客厅。\n\n\n“说实在的，我很惊讶。”艾斯德斯坐在了沙发上，她显得很快接受了这里。\n\n“为什么？”塔兹米本来想喝口茶，但是意识到这座房屋无法烧热水，也没有茶叶，只能清了清嗓子。\n\n“因为我现在已经看到了一个王。”艾斯德斯转头看向他。\n\n他想起来了，是他们见面的第一晚提及的内容。\n\n“那天我就告诉过你，未来的共和国没有王，”塔兹米翘起二郎腿，“我只曾经组织起一个小圈子，邀请了我的老战友们，我们在一起解决了很多问题。而现在，我只是一个普通人。”\n“那一天我也回答过你，我们所指的王的含义并不相同。”\n\n“也许吧，但是我不在乎了，”塔兹米笑了笑，把腿放下，“还有什么要求吗？”\n“有。”\n“请说。”\n\n“偶尔有空的话，来看看我吧，”艾斯德斯笑了起来，“威尔这小子估计不会来看我了，黑瞳也是，想起来，现在能说得上话的，恐怕也就你了。”\n\n“看我的时候，带一副国际象棋来。”\n\n塔兹米点点头。"
  NRR.event.99.a: "“现在我已经不忙了，我答应你，如果有空的话。”"

  NRR.event.100.t: "只是平凡的一天"
  NRR.event.100.d: "德里市区 大街 上午。\n\n“啊呵~”\n玛茵打着哈欠，很明显昨晚的聚会让她没有休息好，尤其是灌进去那么多啤酒，让她起床之后久违地感受到了一丝宿醉的头痛。\n\n“让你昨晚不要多喝，你不听，”塔兹米摸了摸玛茵的脑袋，“你哪里喝得过雷欧奈啊，她可是我们之中最能喝的了，拉伯克也是，他这些年在党派之间的应酬那么多，你和他俩拼杯……真是不好说你。”\n\n“毕竟雷欧奈好不容易回来一趟嘛，”玛茵撇了撇嘴，“难得的老战友们团聚的日子，怎么能不让他们尽兴而归呢？”\n“再说了，谁让你这么早把我拉起来嘛，今天明明什么安排都没有啊？”\n\n“哎……”塔兹米无言反驳玛茵的狡辩，这时，一辆汽车快速驶过，带起的风让两人抬手遮挡，无意间看到了街对面一家刚刚开始营业的大酒店。\n“挺气派的嘛，”塔兹米望着人来人往的大酒店，不禁感慨，“我倒是没什么印象了，这家店是什么时候建的来着？”\n\n“就是一年前，笨，”玛茵白了一眼，“这份规划用地申请当初是给你的，你偷懒塞给我来审核，真是的，一点记性都没……”\n\n“我们就在这里办婚礼怎么样？”\n“诶？！”玛茵被塔兹米突如其来的建议吓了一跳，“不要啦！这么多人…就在我们家旁边的小饭店和大家吃顿饭就行了啦。”\n\n“哎……”塔兹米被玛茵的回答弄得哭笑不得，“好吧好吧，等到了日子再详细安排吧。”\n\n“你还没有告诉我，今天带我出来是干嘛呢？”玛茵不依不饶地追问。\n“啊，今天嘛……”塔兹米看了一眼夹在腋窝的国际棋盘，"
  NRR.event.100.a: "“见一位熟人，我们两个都认识。“"

  NRR.event.101.t: "……这是命令"
  NRR.event.101.d: "前线 炮兵阵地\n\n“装填弹药！“炮兵中尉大声宣布部队下发的指令。\n炮兵营的士兵们开始忙碌起来，校准火炮位置，驾车搬运弹药箱，军需官拿着表格站在一旁统计核对着下发的炮弹数量是否一致。\n\n“诶，你听说了吗，我们的炮击目标？”\n“没有，你有消息？“\n\n准备期间，阵地里三三两两的士兵聚在一起开始小声私语。\n\n“蠢货！你的炮兵技巧培训课白学了！“一名老兵模样的士兵低声训斥道，“想想我们的位置，再看看炮击位置，你还不明白吗，我们要打加尔各答了！”\n“啊……?上面真的下了炮击城市的命令？”一侧的新兵明显感到惊讶，“我两个月前公休的时候还去玩了一趟，挺棒的一个城市…居然…”\n\n“呸！棒个屁，”老兵不屑一顾，“那座城市里有一大群杂碎守在那儿，你不知道吧，我可是革命战争时期就入伍的老兵，那群畜生有次杀光了我在的一个班！只有我活了下来！”\n“但是……城市里还有那么多平民，他们什么错都没有……”\n\n“唔嗯……”老兵一时被呛住，不知道该怎么回答，他压了压军帽，\n“那是，那是他们不走运……”\n\n“叽叽喳喳什么呢！”炮兵中尉注意到闲聊的两个人，“快点动起来！”\n老兵动作明显更加利索，迅速停下话头开始调整炮口，而新兵站在原地。\n\n“报告长官！”“讲。”\n“请问，我们是不是要对加尔各答城进行炮击？向那座有数十万乃至上百万人的城市进行火炮打击？”\n\n中尉盯了眼背过身去的老兵，顿了一顿，思索如何回答新兵的问题。但他发现，他想不出答案。最终，他做出了和老兵一样的动作，他压了压尉官的军帽。\n\n“……执行命令，士兵。”中尉甩下一句话转身离开。"
  NRR.event.101.a: "这是命令。"

  NRR.event.102.t: "沉默的指挥部"
  NRR.event.102.d: "巴特那 前线临时总指挥部 指挥所\n\n……\n……\n\n“…塔兹米。”\n“嗯？”\n“…你在想什么？”刚刚下发作战命令的赤瞳闭着眼瘫在椅子上，最近十余日的不间断工作让这样一位老军人都无法保持精神。\n\n……\n……\n\n“我不知道。”\n“我不知道我们是否做的是对的。”\n\n……\n……\n\n“……不要让这种无聊的问题困扰住你，你也曾经是军人。”\n\n……\n……\n\n“…不，”\n“我是罪人。”\n\n……\n……\n\n“不要让已成既定事实的东西干扰你的理智。”\n\n……\n……\n\n“哎……”赤瞳叹了口气。\n“觉得累了的话就去睡一觉吧，接下来的事情只多不少。”\n\n……\n……"
  NRR.event.102.a: "指挥所的门被打开，然后被关上"

  NRR.event.103.t: "诀别的电话"
  NRR.event.103.d: "加尔各答城外围，围城第四天，前沿指挥所。\n\n“报告。”一名军官从外走进指挥所。\n“讲。”被战事，尤其是数日的攻城战搅得完全无法正常休息的赤瞳的眼底尽是煎熬产生的黑色。\n“不是攻坚的战事问题，”军官显得有些疑惑，“加尔各答内部向我们打进来一通电话，电话的那头，说是艾斯德斯本人。”\n\n“接进来！”同样憔悴的塔兹米在听到这个人名后如沉睡猛醒一般站起来，“就接到这里的电话上！”\n军官被吓了一跳，立刻转身出去。而塔兹米踉跄着走到指挥所的桌子上，拿起话筒守着，直到杂音出现。\n\n“喂喂……啊，是塔兹米吗？”电话那头传来忽远忽近的炮声，以及那熟悉的声音。\n“……你想干什么。”\n\n“别这么冷淡嘛，这就是我送你的最后一份礼物了哦~”\n“礼物！？”塔兹米无法控制住自己的情绪，“生灵涂炭，上万人数万人的伤亡，你管这叫礼物？你这个十足的恶魔，这叫礼物？！”\n\n“当然是。”\n电话那头的声音依旧如此平静，没有悔意，没有愧疚，甚至没有一丝情绪的波动，仿佛一切都是常识一样。这让塔兹米感到一阵全身寒颤。\n“正如我们第一天见到的那晚所预言的那样，你已经成为了王。”\n\n“一个为了实现目标，舍弃其他的王。”\n“一个为了达成目的，不择手段的王。”\n“一个为了夺得胜利，舍弃人命的王。”\n\n“是我赢了，”话筒那一头传来轻笑，“共和国也会有王，它只是没有冠冕，没有依仗。”\n“今天，我给你准备了专属于你的加冕礼，这数万人的盛宴，还不够华丽吗？”\n“……”\n\n“好啦，你现在肯定说不出来话了吧，我要说的也就是这些。哦？你们的部队已经逼近这里了？比我预计的快，不过我怎么会被你们抓住呢？永别了，塔兹米。”\n“你给我等一下！”\n\n电话那头传来爆炸声。"
  NRR.event.103.a: "然后，话筒那头只剩下沙沙的杂音"

  NRR.event.104.t: "战场清扫报告"
  NRR.event.104.d: "巴特那 指挥所。\n\n“截至目前，敌我两军的伤亡不在数万人之下，”军官正在向指挥部的二人汇报着战场清扫的初步统计报告，“不算失踪和受伤，仅我军在各处的阵亡应该在七千人到一万人之间，待进一步统计。”\n“平民伤亡情况呢？”昨日刚刚返回的赤瞳和塔兹米都精神不佳，因此精神稍好一些的塔兹米负责追问。\n\n“……统计处还在统计，”军官擦了擦汗，“但是就目前来看，城区包括交战各地，失踪、受伤和遇难的人，应该不下十万……”\n\n“狩人军团主要干部的下落呢？”\n“全部死亡，”军官快速翻到下一页，\n“首犯艾斯德斯的尸体无法找到，接近她所在地方的先头部队在到达前发生了大当量的爆炸，我们没能找到她的尸骸，现有遗骸也难以辨认，仅能找到艾斯德斯的残破军装，和她的军帽。”\n“她的副官，兰，在围城战的第四天，我军由东西分割加尔各答之后，他所在的北城区被包围，在军队炸开堡垒门之前，他举枪自尽了，遗体已经验明正身。”\n\n“比较奇怪的是这名叫威尔的……”军官翻到了下一页，“他的尸体被发现在自己的家中，貌似是狩人军团的人自己干的，现场有战斗的痕迹，冲突原因不明。”\n“……还有，他旁边一具女性尸体也已经确认，是……是赤瞳总长的妹妹，黑瞳女士。”\n\n“是吗，她死了啊……”一直沉默不语的赤瞳突然叹了口气，“……也罢。”\n\n“以上，请问还有什么问题吗？”\n“没有了，详细的统计数据完成核实后立刻上报。”\n“是。”"
  NRR.event.104.a: "门刚刚关上，赤瞳就歪在椅子上昏睡过去，塔兹米也趴在桌子上，直到深夜醒来"

  NRR.event.105.t: "我们的孩子"
  NRR.event.105.d: "加尔各答城区 受炮击的废墟区某处。\n\n“谁看到了我的孩子——！”\n一名妇女失魂落魄地抓住每一个路过的人，打扫战场的士兵，三三两两巡逻的士兵，或者同为平民的路人。\n\n“谁看到了我的孩子！他才五岁，他是棕色的头发！鼻子很扁！”母亲抓住每一个人，她的双手都是灰泥，破损流血的指甲缝里也都是，明显，她扒过废墟的很多地方。尽管她抓住的每一个人要么说不知道，要么直接甩开她，但她依然在不停地问，仿佛在抓住希望一样。\n“谁看到了我的孩子——！”\n带有哭腔的，母亲的喊声在空荡宁静的街道上显得格外响亮。\n\n\n在街道的另一头，老兵听到这哭声，浑身一颤。\n“唔……真吓人……”老兵看了看女人的方向，然后扭头继续走着。\n\n今天只有他一个人。\n那个他之前搭话的新兵，在围城的第二天，在炮兵阵地前移的时候被敌军的狙击手击中，当场毙命。\n\n真是倒霉……老兵看向这一片片建筑残骸，也许其中的一个弹坑或者倒塌的建筑就是因为他的那门火炮。\n真是倒霉。"
  NRR.event.105.a: "他们都如此年轻，那名士兵，那个孩子"

  NRR.event.106.t: "欢迎回来"
  NRR.event.106.d: "德里市 玛茵家 客厅。\n\n敲门声响起，而不是门铃。玛茵走到门前，轻轻打开门。\n塔兹米回来了，许久不见，他整个人消瘦了一圈，胡子也不剃，头发散乱，衣服也没有清洗。\n\n“太好了……你能平安回来，”玛茵松了口气，“快进来吧。”\n“……嗯，我回来了。”\n\n“先洗个澡吧，”玛茵往屋内走去，“热水已经烧好，如果你饿的话…”\n\n扑通\n\n塔兹米昏倒在地上。\n\n“塔兹米？！”"
  NRR.event.106.a: "压力、负罪感、后悔、遗憾，最终压垮了他"

  NRR.event.107.t: "谴责"
  NRR.event.107.d: "德里市 国民大会 议会厅。\n\n“我们无法理解！”议会右侧的一名人民党议员站起来高声喊道，“人民党要求重新审议‘重建计划’以来的一系列决议的合理性！”\n“对方这是在借机生事！”中间一名民主共和党议员站起来反对，引来附和声和嘘声。\n\n“难道你们认为今天的惨案与重建委员会以来的一系列糟糕的决策没有关系吗？”\n“一派胡言，你们只不过是在颠倒黑白，来停止对你们贪墨的清算罢了！”\n\n“肃静！肃静！”\n议长用力的敲槌，议会厅许久才堪堪安静下来。\n\n“根据议会的运作法则，只要提案方达到总议席的十分之一，就可以提交议案，你们能够满足吗？”\n“可以，尊敬的议长，”那名人民党议员故作姿态地将一份数十人签名的议案交给了议长。\n\n议会席出现一阵骚动。\n“肃静！肃静！”议长又敲了敲槌。\n\n片刻过后。\n“提案者共59人，”议长高声宣布，“满足最低55人的提案要求，现在将议案发至所有人阅览，并审议表决！”\n\n议会席炸开了锅。"
  NRR.event.107.a: "肃静！肃静！"

  NRR.event.108.t: "险胜"
  NRR.event.108.d: "德里市 国民大会 议会厅。\n\n“现在宣布统计结果！”议长高声宣读，“183票赞成，101票弃权，253票反对，13席缺席。弹劾动议没有得到通过！”\n\n随着议长敲槌声，许多人都送了一口气。\n但骚动也随之而来。\n\n因为投下赞成票的并非只有人民党，民共党的议员发现，很明显，这样的赞成票数量，代表自己的部分同僚也投下了赞成票。甚至，可能会有社会党的赞成票。\n\n人民党又一次失败了，但他们没有以往那样垂头丧气，相反，他们鼓起掌，仿佛在庆祝一场胜利。\n\n这也确乎是一场胜利，因为他们这次动议让人们看到了，反对的力量开始壮大了。"
  NRR.event.108.a: "至少…至少今天他们没有成功"

  NRR.event.109.t: "谢谢，再见"
  NRR.event.109.d: "拉西纳山，总统府邸，大门口。\n\n拉伯克的车缓缓停下，他锁好车门，正打算往里走，突然发现塔兹米正抱着自己物品的箱子走出门外。\n“塔兹米？”拉伯克挥手打了个招呼。\n\n塔兹米双手抱着箱子，只能点点头以致意。\n“我送你一程吧。东西放后备箱。”\n“谢谢。”\n\n汽车又发动起来，拉伯克开着车，往山下驶去。\n“去你家，还是玛茵家？”\n“还是先回我家吧。”塔兹米叹了口气。\n\n“怎么了？最近一直无精打采的，”拉伯克看出老友状态不对劲，“别什么事情都藏心里，有事儿就说。”\n塔兹米张了张嘴，但旋即摇了摇头。\n“我会说的，但不是今天，哪天有空，我们大家再聚一聚吧……”\n\n“嗯，也好，”拉伯克点点头，“我最近在忙民共党的事情，忙完了应该就有空了，到时候再说。”\n\n然后，二人一路无话。\n\n半小时后，车停在了塔兹米租的公寓楼门口。\n\n“拉伯克。”\n“嗯？”\n“后面的事情，就拜托你了。”塔兹米的语气很轻。\n“哦……嗯……我知道。”拉伯克知道老友指的是什么，点了点头。"
  NRR.event.109.a: "塔兹米下了车，随后是后备箱打开和关上的声音"

  NRR.event.110.t: "夕阳下山"
  NRR.event.110.d: "德里郊区，一处山坡，黄昏。\n\n玛茵走在前面，塔兹米默默地跟在后面。\n\n“到了，”玛茵指着山坡上的大树，“我们就坐那里吧。”\n“嗯。”塔兹米点点头。\n\n两个人背靠着大树坐下。自塔兹米回到家后，好几天足不出户，于是玛茵提议带他出来走走散散心。\n塔兹米没有反对，只是点头，然后跟着玛茵。\n\n景色确实很美，夕阳西下的晚霞让二人一时忘记了言语，清风吹过山坡，只有沙沙声和归巢鸟类的叫声。\n许久。\n\n“…玛茵。”\n“嗯…?”\n\n“我觉得我失败了，”塔兹米双手抱紧膝盖，这是他几天来首次主动开口说话，“彻头彻尾的失败了。”\n“你已经尽到你能做的全部了，”玛茵将手放在塔兹米的手背上，“没人奢求你能尽善尽美。”\n\n“…嗯。”塔兹米默默点了点头。\n\n“不论怎么说，比旧帝国的时候，甚至比你之前，已经好不少了，”玛茵靠在大树上，和塔兹米一起看着夕阳，“让我们相信拉伯克吧，他了解你，我们也了解他。”\n\n“……嗯。”塔兹米慢慢将弯起的膝盖放平，两人的手也自然地落在了地面上。"
  NRR.event.110.a: "“谢谢你，玛茵”"

  NRR.event.111.t: "真相"
  NRR.event.111.d: "拉西纳山 总统府邸 二楼办公室 深夜。\n\n“明天还得去参加国民大会的质询，回答加尔各答的情况……”\n玛茵伏在办公桌上，开始预想被针对的问题和有价值的回驳。\n\n敲门声响起。\n“什么事？”\n“玛茵女士，那我就先走了，钥匙放在走廊楼梯口的地毯里面了。”\n“好的，路上小心。”\n“还有一件事情，半个小时前，门卫说有一件寄给您的包裹，很厚，门卫颠了一下，没有危险，好像是一堆文件？”\n\n“文件？”玛茵抬起头，“谁寄来的？”\n“没有署名寄件人，只写了您收。门卫把它放到您的门口了”\n“行，我知道了。”\n\n秘书的脚步声渐渐远去，玛茵低下头，又写好了一个回答后，她走到办公室门口，将那个厚厚的包裹抱进办公室。\n\n正如秘书所说，这个包裹确实很重，粗一估量，应该有几公斤，甚至可能接近十公斤。\n谁会寄来这种包裹呢？玛茵拿起裁纸刀，剪开包裹的外皮"
  NRR.event.111.a: "是一叠被包起来的照片，和一大堆记述"

  NRR.event.112.t: "罪恶"
  NRR.event.112.d: "这是屠杀。\n\n这是屠杀的照片。\n\n无可辩驳的铁证。\n\n村庄，废墟，牲畜。\n\n老人，妇孺，青年。\n\n数字，数字，数字。\n尸体，尸体，尸体。\n\n玛茵将照片盖上，大口喘着粗气，此前的工作疲劳与此刻的惊吓产生了组合作用。\n大脑的保护本能让她在见到的第一眼就盖上这些照片。\n\n但真相盖不住。\n罪恶也是。\n\n残存的理智让玛茵将照片和文件翻回来，试图找到破绽。也许这是反对党的污蔑阴谋，也许只是伪造或者变造的数据和相片。\n\n但完全对得上。只是在此之前，它们被以“误伤、伪装的敌军、统计口径模糊”的理由蒙混过去，而无人察觉。\n地点、时间、数字。\n完全对得上。\n\n在某张照片背面的一句话，让玛茵知道了寄件人。\n“你是第一个知道的，不会是最后一个。”"
  NRR.event.112.a: "是艾斯德斯的字迹"

  NRR.event.113.t: "死途"
  NRR.event.113.d: "她想要保守秘密，\n她的良心不允许。\n\n她想要纠正罪恶，\n但罪恶已经酿成恶果。\n她想要寻求朋友的帮助，\n\n但无人知晓，她也不想让朋友知晓。\n她想向他询问答案，\n\n但她不想让他背负这等罪恶，她也不愿意相信他是这一切的元凶。\n\n疲惫、疲惫、疲惫、疲惫、疲惫、疲惫、疲惫、疲惫、疲惫、疲惫。\n\n煎熬、煎熬、煎熬、煎熬、煎熬、煎熬、煎熬、煎熬、煎熬、煎熬。\n\n痛苦、痛苦、痛苦、痛苦、痛苦、痛苦、痛苦、痛苦、痛苦、痛苦。\n\n她平静的将这些东西锁进一个只有她自己知道的，储物柜底下的暗格，这是她自己开凿的。\n\n一切的努力付诸东流：动乱、危机、罪恶，朋友的一意孤行，貌合神离的战友们，她再也无法仅凭自己维系下去了。\n\n死亡成了良药。\n\n她拉开了抽屉。"
  NRR.event.113.a: "里面放着那把她第一次来这里时携带的手枪"

  NRR.event.114.t: "失心疯"
  NRR.event.114.d: "塔兹米失踪了。\n\n他知道了玛茵的死讯，那是和前方加尔各答攻克的消息，同时被从后方送来的。\n\n得知消息的当场，塔兹米直接昏倒。等到苏醒后，他直接跳上了一辆摩托车，没有跟任何人商量就离开了指挥部。\n\n那辆摩托车后来被人发现在距离德里几十公里左右的路边，摩托车发生了侧翻，现场有血迹。\n\n从赤瞳那里得知消息的拉伯克在次日开车抵达了塔兹米的住处，没有人回应，心急的拉伯克直接撬开了塔兹米的门锁。\n\n他的家中一片整洁，保持着他离开时样子，没有人来过。\n\n于是拉伯克又去了玛茵的家。\n玛茵的家中一片狼藉，大量的柜子、书籍被翻找、扔在地上，衣柜和茶几也未能幸免。\n\n拉伯克猜测塔兹米曾来过，他可能想找出玛茵的死因，但是他应该没有找到。\n他不相信玛茵是自杀的。\n\n塔兹米没有在玛茵的葬礼上现身,拉伯克才他无法接受玛茵已经逝去的事实。"
  NRR.event.114.a: "但事实就是如此"

  NRR.event.115.t: "谣言"
  NRR.event.115.d: "自此之后，塔兹米再也没有出现在公众视野当中。\n\n媒体和坊间传言纷纷。\n\n有人说他英勇地死在了加尔各答城，与魔头艾斯德斯同归于尽，不许军方传出他的死讯。\n\n有人说他被暗害了，因为他的许多激进的改革措施损害到太多人的利益，被仇家暗算死在家中。\n\n有人说他无法面对加尔各答之战的十余万人的伤亡，在城破当日离开了恒河。\n\n也有人说，他是传闻中，南亚对外战争的某些传闻中屠杀村庄的主使，他酷烈地埋杀了所有反对他的人。\n\n这个世界最不缺的就是传言、流言和谣言。\n\n最缺乏的就是证据、证人和真相。\n\n总之，塔兹米再也没有出现过了。\n\n有人说，也许在之后的日子里，拉伯克和赤瞳知道他在哪，还去看望过他。\n\n但无人有证据。\n\n也有人说自己在某处见过塔兹米，他出现在某个寂静的夜晚，在某座大型的墓地。\n这样的鬼故事听起来真令人害怕。\n\n他成为了传说、谣言、鬼故事的主人公。\n但他再也没有出现过。"
  NRR.event.115.a: "再也没有"

  NRR.event.116.t: "尾声：恒河·大事记"
  NRR.event.116.d: "新选举正式结束，民主共和党虽此前势头受挫，席位未能过半，但依然维持议会第一大党地位，与第二大党社会党组成执政联盟。拉伯克担任新一届总统。宣布将延续国家重建计划的政策。\n\n新的时代到来了。\n1950年，塔兹米和玛茵举办了婚礼，夜袭团的成员尽数到场，包括娜洁希坦。\n1952年，经拉伯克主导协商，民主共和党与社会党合并为民主社会党，随后右翼党员出走，与人民党组建人民共和党。虽损失部分席位，但民主社会党成为了席位超三分之二的绝对主导党，标志着整体政府的继续左倾化。\n1953年，威尔与黑瞳举办了婚礼，塔兹米夫妇等人参加了婚礼，赤瞳对威尔与黑瞳表示祝福。\n1955年，再次大选，民主社会党继续维持超三分之二席位，拉伯克得以连任总统。\n1960年，南亚与各国签订《世界国家联合条约》，支持为世界经济往来、文化交流、政治认同的一体化而努力。\n1965年，赤瞳因诅咒逝世，整个南亚为其举行国葬，冠以“最忠诚的军人”美誉,黑瞳也参加了葬礼。\n1968年，南亚宣布具备核武器制造与投射能力。\n1971年，南亚成功发射人造卫星，成为世界第三个成功发射卫星的国家。\n1977年，圣杯声明完全放弃马尔代夫群岛及诸岛屿的行政权，尊重南亚人民的选择。\n1980年，娜洁希坦逝世，塔兹米与玛茵等夜袭成员出席其国葬，塔兹米与拉伯克为其抬棺。\n1983年，塔兹米逝世，全南亚为其举行国葬，冠以“南亚统一之父”的美名。同年，玛茵开始撰写夜袭组织回忆录。\n1985年，南亚及正义者同萌的诸成员国发表联合声明，正式将正义者同萌改名为“南方联盟”，呼吁亚非拉各国各民族为“一个独立、自由、繁荣的南方世界”而不懈努力。\n1987年，玛茵撰写，内含大量解密文件与娜洁希坦等人日记的《夜袭组织回忆录》出版，彼时全国才知道在革命时期存在着这样一个秘密的机动组织。\n1988年，拉伯克逝世。同年末，威尔逝世。\n1992年，黑瞳逝世。\n1993年，南亚成为世界第二大经济体，仅次于圣杯王国及诸附属国的总经济体。\n1998年，玛茵逝世。\n当21世纪的第一次日出来临之时，南亚作为一种新的社会主义国家及其第三世界领袖成为世界民族解放的象征与荣光，南亚的人民无不沐浴在这一统一、自由与繁荣的光明之中，昂首于世界之林。"
  NRR.event.116.a: "皆是后话"

  NRR.event.117.t: "尾声：恒河·大事记"
  NRR.event.117.d: "新选举正式结束，民主共和党虽此前势头受挫，但依然席位过半，维持议会第一大党地位，单独执政。拉伯克担任新一届总统。宣布将调整国家重建计划的政策，并探索新的道路。\n\n新的时代到来了。\n1950年，拉伯克邀请娜洁希坦重新返回政府，担任议长，娜洁希坦拒绝该提议，并宣布退出政坛。\n1953年，塔兹米和玛茵举办了婚礼，夜袭团的成员尽数到场，包括娜洁希坦。\n1954年，拉伯克民主共和党政府认为“国家重建计划”已经完成了它的使命，宣布保留其大致政策，其余政策将采取调整措施。\n1956年，新大选结束，民主共和党支持率一路下降，虽维持第一大党地位，但失去过半席位，在寻求人民党联合执政遭拒后，与社会党组成执政联盟，拉伯克得以连任。\n1959年，赤瞳因诅咒逝世，整个南亚为其举行国葬，冠以“最忠诚的军人”美誉。\n1962年，正义者同萌宣布将“采取更为温和的姿态”，将同萌重心从军事同盟和世界民族解放转移到经济一体化和自由交流方面。\n1967年，南亚核试验部分成功，但仍然缺乏投送能力。\n1970年，南亚与圣杯达成谅解备忘录，就租借地及南亚统一问题达成一致意见，承诺“以更加开放的经济”实现双方目标。\n1975年，南亚宣布具备核武器投放能力。\n1979年，娜洁希坦逝世，塔兹米与玛茵等夜袭成员出席其国葬，塔兹米与拉伯克为其抬棺。\n1981年，塔兹米逝世，引起全南亚争议，有反对者认为其应当为“加尔各答的悲剧”负责。\n1982年，政府组成联合调查评议组，最后，评议组以7：2的结果，认为“塔兹米继承了共和国的精神，是民主精神和共和理念的发扬者”。\n1988年，拉伯克逝世。\n1991年，玛茵参加了南亚电视台的采访，她在采访中表示她的丈夫已经为南亚“倾尽所有”，获得部分认可。\n1992年，玛茵逝世。\n1997年，圣杯王国的“世界民主评议小组”认为南亚“不是一个真正民主的国家，只是一个温和的带有民主色彩的社会主义国家。”\n当21世纪的第一次日出来临之时，南亚以即将成为世界第三经济大国的姿态矗立于世，它虽然历经磨难，但其现在的繁荣与发展仍然获得世界的认可，作为世界的一端继续维护着统一与稳定。"
  NRR.event.117.a: "皆是后话"

  NRR.event.118.t: "尾声：恒河·大事记"
  NRR.event.118.d: "新选举正式结束，民主共和党和社会党势头大减，民主共和党虽为第一大党，但内部分歧众多。拉伯克担任新一届总统。宣布将取消国家重建计划，并探索新的道路。\n\n新的时代到来了。\n1951年，南亚议会人民党提出不信任案动议，以微弱劣势未能通过。\n1953年，民主共和党宣布与人民党组成执政联盟，标志着其政策的向右倾斜。\n1955年，南亚恢复两院制，参议院再次设立。\n1957年，新大选结束，民主共和党支持率一路走低，遭遇大失败，仅维持三分之一左右席位，同步崛起的社会党与人民党的对立撕裂着整个社会。最终，一个由民主共和党主导的三党联合政府成立。\n1958年，赤瞳因诅咒逝世，人民党否决了为其举行国葬的决议。\n1960年，拉伯克宣布辞去总统职位，称其“已经完全无法弥合党派之间的裂痕。”\n1962年，娜洁希坦逝世，在世的夜袭团成员为其举行了葬礼，拉伯克与雷欧奈为其抬棺。\n1967年，正义者同萌宣布解散。\n1970年，南亚核试验失败。\n1972年，圣杯宣布“南亚不具备作为一个合格的主权国家的资格”，单方面宣布无限期延迟马尔代夫群岛及南亚各特权的行使权利，不承认此前与南亚签订达成的条约和共识。\n1976年，国际社会突然出现了“南亚曾经发生大屠杀”的传言。\n1977年，有传闻说，塔兹米死了。\n1980年，政府组成联合调查评议组，最后，评议组以4：5的结果，认为“塔兹米应当对加尔各答惨案负责，其政策利少害多，对南亚造成了不良后果”。\n1983年，南亚传出重大贪腐丑闻，整个国家的秩序开始动荡。\n1985年，拉伯克逝世。\n1987年，民主共和党解散，新成立的民主党和共和党继承了原来党派的左右两端，南亚政局进入多党时代。\n1989年，南亚爆发重大农业灾害，出现严重的灾荒，农业倒退，各地共计上百万民众游行抗议政府无能。\n1993年，世界媒体评价南亚的现代化“尚未成功。”\n当21世纪的第一次日出来临之时，南亚依旧在与贪腐、低效、社会撕裂等问题颤抖，它确实仍然继续作为一个国家而存在，但少有人能记得它曾经的辉煌，和它所代表的无限希望。"
  NRR.event.118.a: "皆是后话"

#人物介绍
  NRR_xitan_desc_leader: "前帝国将军、共和革命的再造者、革命军的领袖……娜洁希坦身上有诸多秘密和过往，但她数十年的传奇经历和不朽功绩，让她成为了当下革命军唯一的主心骨和决策者。凭借着她对旧帝国和老友劲敌艾斯德斯的了解，革命军总能在总体劣势的局面中抓到敌军的许多可乘之机，使得战局长期陷入互有胜负的僵持当中。\n\n诚然，随着革命军声势和支持者规模的不断扩大，比前线更令人头疼的后方内部问题，常常使得娜洁希坦进退失据，但凭借着全军上下对帝国同仇敌忾的斗志和不断好转的根据地情况，她尚能控制住整个局面。作为帝国旧将的她也能凭借昔日的关系网得到不少合作者的支持和援助，尽管这些援助总是附带着代价，但为了最终的胜利，为了打倒腐朽的帝国，娜洁希坦必须赌上一切。"
  NRR_TZM_desc_leader: "§R我们的共和国没落了。§!\n\n并非为某种崇高的理想、亦非为永载史册的功名，来自边陲村庄的塔兹米在一开始只是一个单纯的想前往帝都德里谋求一份生计的草根青年。当他被一名有怪癖的贵族家庭诱骗遇害之际，恰巧遇上了“夜袭”组织的秘密行动而得救，塔兹米由此窥探到这个国家的腐朽与残酷，与这一事实一同被他发现的，是先于他出发，惨死于他面前的两名同村好友。\n他义无反顾地加入了革命军，只是为了给他的同乡报仇，只是为了让那群害人的贵族、官僚不再祸害人民，只是为了对将死之际的绝望作出回答。凭借着踏实的干劲和与人为善的交际能力，塔兹米很快成为了革命军年轻一代的代表和夜袭组织中不可多得的重要行动干员。如此十五年，他终于见证了革命的胜利：旧帝国的轰然倒塌，共和国国旗高高飘扬。他心满意足地从“夜袭”退伍，渴望着他十余年来朝思暮想的普通生活：勤恳工作、在某个好日子组成家庭、养育后代。\n\n但是现实没有给他这样的结局。\n\n很快，他就在新的共和国身上看到了旧的蛆虫仍在蠕动：贵族的舞会仍昼夜不停，只不过现在的宾客多了共和国的新部长和官员；走私的黄金和华贵衣物供给源源不断，只不过这次是以“救灾物资”的名义运进首都；恶贯满盈的罪犯们仍在肆意起舞，只不过这次他们的名字前冠以“参议员”的美名。\n于是他让自己成为魔鬼，用着以往的他最不可能采取的方式，走到了恒河这个国家的舞台最前端。每当他闭上眼睛，同乡和大哥的惨死场面就萦绕在他的梦中挥之不去。\n\n这是他的机会，也是恒河最后的机会" 
  
#第二领袖
  NRR_chitong_buff: "§Y赤瞳§!\n@NRR§Y[FROM.Getname]§!的§C陆军总长§!\n\n§Y“老兵”§!\n  - 陆军经验增长：§G20.00%§!\n  - 陆军进攻：§G10.00%§!\n  - 陆军防御：§G10.00%§!\n"
  NRR_chitong_Diplomacy_desc: "§Y赤瞳§!\n@NRR§Y[FROM.Getname]§!的§C陆军总长§!\n\n§Y“老兵”§!\n  - 陆军经验增长：§G20.00%§!\n  - 陆军进攻：§G10.00%§!\n  - 陆军防御：§G10.00%§!\n"
  NRR_chitong_desc: "和令人尊敬的革命军统帅一样，作为革命军当中的老兵、“夜袭”组织资历最老的行动队长，赤瞳的身世亦是一个谜，尽管她如今尚未到而立之年，但是她是革命军当中少之又少的精锐。与塔兹米、玛茵这样的新进成员不同，在1921年那一支娜洁希坦率领杀出灾变区的部队之中，就有了赤瞳的身影，尽管那一年的她还只是个14岁的孩子。和她一同加入的还有她手中那边同样来历不明的武器——村雨丸。\n\n赤瞳的身手本就不凡，搭配上帝具的加成，她的加入对于革命军具有着相当重要的影响。擅长机动和突袭的赤瞳很快成为了革命残军中别动队的军官，并在曼德勒时期被授命组建一直为革命服务、活跃于敌后的地下组织——“夜袭”。不仅如此，赤瞳的作战经验同样为锻造一直精通游击和迂回作战的革命正规军提供了不可替代的作用。在资历和才能的双重加持下，赤瞳成为了军队内部无可争议的二号人物。\n\n但是，赤瞳才能的卓越以其健康状况的恶化为代价，作为帝具村雨的持有者，赤瞳身上所背负的诅咒长期以来恶化着赤瞳的身体机能，这一秘密虽只有她和娜洁希坦两人知道，但也让她不得不在如此年轻的岁数淡出前线的具体行动，转型成为军队的组织者。幸赖她极高的威望，只要赤瞳存在一日，那么革命军就将永远为革命尽忠，并在革命处于最危难的时刻保持稳定与克制。"

  NRR_MY_name: "玛茵"
  NRR_MY_political_desc: "§Y玛茵§!\n@NRR§Y[FROM.Getname]§!的§P国家重建委员会委员§!"
  NRR_MY_diplomacy_desc: "§Y玛茵§!\n@NRR§Y[FROM.Getname]§!的§P国家重建委员会委员§!"
  NRR_MY_deputy_leader_desc: "在这一天之前，玛茵从未想到自己会以政府要员的身份进入拉西纳山。\n\n突如其来的政府更迭，突如其来的冲突，但最突如其来的，莫过于坐在她面前的老战友、朋友—§R塔兹米§!。\n\n敬爱的§C老上司§!蛰居，熟悉的§G朋友§!站在陌生的舞台上判若两人。久经战阵的她也无法短时间接受这一变化。在她回到家的几天里，她茶饭不进，彻夜难眠。“国家重建”“重建委员会”“国民大会和参议院”“修正案与法案”，这些词她从未见过，从未想过，从未理解过，在加入革命军之前，她只是一个来自村子的小女孩，在加入革命军之后，她只是一个军人。\n\n她只知道，国家正面临危机，朋友正面临抉择。\n\n也许在某些时刻，尤其是共和建立后的日子里，她畅想过成为一个普通人，在一个恰当的时刻脱下军装，和一个人成立家庭，过上梦中的平淡生活。\n\n但至少不是今天。\n\n所以她亲自再次回到了拉西纳山，以不容拒绝的姿态加入到塔兹米主导的国家重建委员会，并呼吁战友们团结起来共克时艰。就仿佛是一夜之间，她完成了从一个军人到政治活动家的转变，她负责主持委员会的日常会议，参加塔兹米等人的闭门会议，外出活动以及组织工作的安排。\n\n如果无法回到§g昨日§!，那就让§P明日§!尽快来临。\n如果§R塔兹米§!相信他的方法能够拯救恒河，那§P玛茵§!就毫无保留地相信塔兹米。\n\n为了拯救§P国家§!，也为了拯救§R朋友§!。"
  
